<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cài Đặt Tài Khoản - MinhNet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fbBg: '#18191a',
                        fbPanel: '#242526',
                        fbHover: '#3a3b3c',
                        fbInput: '#3a3b3c',
                        fbBlue: '#2d88ff',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #18191a; color: #e4e6eb; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #3a3b3c; border-radius: 3px; }
    </style>
</head>
<body class="bg-fbBg text-[#e4e6eb] min-h-screen flex flex-col overflow-x-hidden pb-14">

    <!-- HEADER TOP -->
    <header class="h-14 bg-fbPanel border-b border-fbHover px-3 sm:px-4 flex items-center justify-between sticky top-0 z-40 shrink-0">
        <div class="flex items-center gap-3">
            <a href="trangchu.html" class="text-fbBlue text-2xl sm:text-3xl cursor-pointer hover:opacity-85 transition" title="Quay lại Bảng tin"><i class="fa-solid fa-arrow-left"></i></a>
            <span class="text-sm font-bold text-white">Cài Đặt Tài Khoản</span>
        </div>
        <div class="flex items-center gap-2">
            <a href="profile.html" class="text-xs bg-fbInput px-3 py-1.5 rounded-xl hover:bg-fbHover text-white font-bold">Trang Cá Nhân</a>
            <a href="trangchu.html" class="text-fbBlue font-bold text-xs bg-fbInput px-3 py-1.5 rounded-xl hover:bg-fbHover">Về Bảng Tin</a>
        </div>
    </header>

    <!-- NỘI DUNG CÀI ĐẶT -->
    <div class="w-full flex flex-col items-center bg-fbBg py-8 px-4">
        <div class="max-w-[600px] w-full bg-fbPanel rounded-2xl border border-fbHover p-6 sm:p-8 space-y-6 shadow-2xl">
            <div class="flex items-center gap-3 border-b border-fbHover pb-4">
                <div class="w-12 h-12 rounded-full bg-fbBlue/10 flex items-center justify-center text-fbBlue text-xl border border-fbBlue/20">
                    <i class="fa-solid fa-gear"></i>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-white">Tùy chỉnh tài khoản</h2>
                    <p class="text-xs text-[#b0b3b8]">Quản lý thông tin cá nhân và bảo mật hệ thống MinhNet</p>
                </div>
            </div>

            <div class="space-y-5 text-xs">
                <!-- Đổi Ảnh Đại Diện -->
                <div class="space-y-2">
                    <label class="font-semibold text-[#b0b3b8] uppercase text-[11px]">Ảnh đại diện mới</label>
                    <div class="flex items-center gap-4">
                        <div id="settings-avatar-preview" class="w-16 h-16 rounded-full bg-fbHover border border-fbHover overflow-hidden flex items-center justify-center shrink-0 font-bold text-lg">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <input type="file" id="settings-avatar-input" accept="image/*" class="w-full bg-fbInput border border-fbHover rounded-xl p-2.5 text-white text-xs file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-fbBlue file:text-white cursor-pointer hover:file:opacity-90">
                    </div>
                </div>

                <!-- Đổi Tiểu sử (Bio) -->
                <div class="space-y-2">
                    <label class="font-semibold text-[#b0b3b8] uppercase text-[11px]">Tiểu sử (Bio)</label>
                    <input type="text" id="settings-bio-input" placeholder="Nhập tiểu sử ngắn của bạn..." class="w-full bg-fbInput border border-fbHover rounded-xl p-3 text-white focus:outline-none focus:border-fbBlue text-xs">
                </div>

                <!-- Đổi Mật Khẩu SHA-256 -->
                <div class="space-y-2 pt-2 border-t border-fbHover">
                    <label class="font-semibold text-[#b0b3b8] uppercase text-[11px]">Mật khẩu mới (Mã hóa SHA-256)</label>
                    <input type="password" id="settings-new-pass" placeholder="Nhập mật khẩu mới nếu muốn đổi..." class="w-full bg-fbInput border border-fbHover rounded-xl p-3 text-white focus:outline-none focus:border-fbBlue text-xs">
                </div>

                <!-- Nút Lưu Thay Đổi -->
                <button onclick="saveAppSettings()" class="w-full bg-fbBlue hover:opacity-90 py-3.5 rounded-xl font-bold text-white transition shadow-lg cursor-pointer text-sm">
                    Lưu Thay Đổi
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB100rlybpLzv5ax2otgGPzDJc1l5pASyo",
            authDomain: "minh-s-website.firebaseapp.com",
            projectId: "minh-s-website",
            storageBucket: "minh-s-website.appspot.com",
            messagingSenderId: "453574408938",
            appId: "1:453574408938:web:f5b017647a17deacfc3593"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const loggedUser = localStorage.getItem("chat_user");
        if (!loggedUser) {
            alert("Vui lòng đăng nhập trước!");
            window.location.href = "trangchu.html";
        }

        // Khởi tạo hiển thị dữ liệu cũ nếu có
        const currentBio = localStorage.getItem("user_bio") || "";
        const currentAvatar = localStorage.getItem("user_avatar") || "";
        
        document.getElementById("settings-bio-input").value = currentBio;
        if (currentAvatar) {
            document.getElementById("settings-avatar-preview").innerHTML = `<img src="${currentAvatar}" class="w-full h-full object-cover">`;
        }

        // Xem trước ảnh khi chọn file mới
        document.getElementById("settings-avatar-input").onchange = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById("settings-avatar-preview").innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover">`;
            };
            reader.readAsDataURL(file);
        };

        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hash = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        window.saveAppSettings = async () => {
            const bio = document.getElementById("settings-bio-input").value.trim();
            const pass = document.getElementById("settings-new-pass").value.trim();
            const avatarFile = document.getElementById("settings-avatar-input").files[0];

            if (bio) {
                localStorage.setItem("user_bio", bio);
            }

            if (avatarFile) {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    localStorage.setItem("user_avatar", e.target.result);
                    await finalizeSettings(pass);
                };
                reader.readAsDataURL(avatarFile);
                return;
            }

            await finalizeSettings(pass);
        };

        async function finalizeSettings(pass) {
            if (pass) {
                const hashed = await hashPassword(pass);
                await setDoc(doc(db, "users", loggedUser), { password: hashed }, { merge: true });
                alert("Đã lưu cài đặt và cập nhật mật khẩu mã hóa SHA-256 thành công!");
            } else {
                alert("Đã lưu cài đặt thành công!");
            }
            window.location.href = "profile.html";
        }
    </script>
</body>
</html>
