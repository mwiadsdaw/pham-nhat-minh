<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cài Đặt & Kéo Thả Ảnh Bìa - MinhNet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fbBg: '#18191a',
                        fbPanel: '#242526',
                        fbHover: '#3a3b3c',
                        fbInput: '#3a3b3c',
                        fbBlue: '#2d88ff',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #18191a; color: #e4e6eb; }
        .drag-cover { cursor: grab; user-select: none; }
        .drag-cover:active { cursor: grabbing; }
    </style>
</head>
<body class="bg-fbBg text-[#e4e6eb] min-h-screen flex flex-col overflow-x-hidden pb-14">

    <!-- HEADER TOP -->
    <header class="h-14 bg-fbPanel border-b border-fbHover px-3 sm:px-4 flex items-center justify-between sticky top-0 z-40 shrink-0">
        <div class="flex items-center gap-3">
            <a href="trangchu.html" class="text-fbBlue text-2xl sm:text-3xl cursor-pointer hover:opacity-85 transition" title="Quay lại Bảng tin"><i class="fa-solid fa-arrow-left"></i></a>
            <span class="text-sm font-bold text-white">Cài Đặt & Đồng Bộ Cloud</span>
        </div>
        <div class="flex items-center gap-2">
            <a id="nav-profile-link" href="profile.html" class="text-xs bg-fbInput px-3 py-1.5 rounded-xl hover:bg-fbHover text-white font-bold">Trang Cá Nhân</a>
            <a href="trangchu.html" class="text-fbBlue font-bold text-xs bg-fbInput px-3 py-1.5 rounded-xl hover:bg-fbHover">Về Bảng Tin</a>
        </div>
    </header>

    <div class="w-full flex flex-col items-center bg-fbBg py-8 px-4">
        <div class="max-w-[650px] w-full bg-fbPanel rounded-2xl border border-fbHover p-6 sm:p-8 space-y-6 shadow-2xl">
            
            <div class="flex items-center gap-3 border-b border-fbHover pb-4">
                <div class="w-12 h-12 rounded-full bg-fbBlue/10 flex items-center justify-center text-fbBlue text-xl border border-fbBlue/20">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-white">Cài đặt tài khoản & Đồng bộ</h2>
                    <p class="text-xs text-[#b0b3b8]">Tùy chỉnh ảnh bìa, avatar, bio và đồng bộ trực tiếp lên Firebase</p>
                </div>
            </div>

            <!-- KHUNG KÉO THẢ CHỈNH ẢNH BÌA -->
            <div class="space-y-2">
                <div class="flex items-center justify-between">
                    <label class="font-semibold text-[#b0b3b8] uppercase text-[11px]">Vùng hiển thị ảnh bìa</label>
                    <input type="file" id="settings-cover-input" accept="image/*" class="hidden" onchange="handleCoverSelect(event)">
                    <button onclick="document.getElementById('settings-cover-input').click()" class="text-xs text-fbBlue font-bold hover:underline cursor-pointer"><i class="fa-solid fa-upload"></i> Tải ảnh bìa mới</button>
                </div>
                
                <div id="cover-drag-container" class="w-full h-52 sm:h-72 rounded-xl bg-black border border-fbHover relative overflow-hidden flex items-center justify-center select-none cursor-grab active:cursor-grabbing">
                    <img id="cover-drag-img" src="" class="absolute w-full h-full object-cover drag-cover hidden" style="object-position: center 50%;" draggable="false">
                    <span id="cover-placeholder" class="text-xs text-[#b0b3b8] italic">Bấm "Tải ảnh bìa mới" hoặc chọn ảnh có sẵn</span>
                </div>
            </div>

            <!-- CHỌN AVATAR -->
            <div class="space-y-3 pt-2 border-t border-fbHover">
                <label class="font-semibold text-[#b0b3b8] uppercase text-[11px]">Ảnh đại diện / GIF / Video ngắn</label>
                <div class="flex items-center gap-4">
                    <div id="settings-avatar-preview" class="w-16 h-16 rounded-full bg-fbHover border border-fbHover overflow-hidden flex items-center justify-center shrink-0 font-bold text-lg shadow">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <input type="file" id="settings-avatar-input" accept="image/*,video/*" class="w-full bg-fbInput border border-fbHover rounded-xl p-2.5 text-white text-xs file:mr-3 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-xs file:bg-fbBlue file:text-white cursor-pointer">
                </div>
            </div>

            <!-- BIO & PASS -->
            <div class="space-y-4 pt-2 border-t border-fbHover">
                <div>
                    <label class="font-semibold text-[#b0b3b8] uppercase text-[11px]">Tiểu sử (Bio)</label>
                    <input type="text" id="settings-bio-input" placeholder="Nhập tiểu sử ngắn..." class="w-full bg-fbInput border border-fbHover rounded-xl p-3 text-white focus:outline-none text-xs mt-1">
                </div>
                <div>
                    <label class="font-semibold text-[#b0b3b8] uppercase text-[11px]">Mật khẩu mới (SHA-256)</label>
                    <input type="password" id="settings-new-pass" placeholder="Mật khẩu mới nếu muốn đổi..." class="w-full bg-fbInput border border-fbHover rounded-xl p-3 text-white focus:outline-none text-xs mt-1">
                </div>
            </div>

            <button onclick="saveAppSettings()" class="w-full bg-fbBlue hover:opacity-90 py-3.5 rounded-xl font-bold text-white transition shadow-lg cursor-pointer text-sm">
                Lưu Thay Đổi & Đồng Bộ Cloud
            </button>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB100rlybpLzv5ax2otgGPzDJc1l5pASyo",
            authDomain: "minh-s-website.firebaseapp.com",
            projectId: "minh-s-website",
            storageBucket: "minh-s-website.appspot.com",
            messagingSenderId: "453574408938",
            appId: "1:453574408938:web:f5b017647a17deacfc3593"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const loggedUser = localStorage.getItem("chat_user");
        if (!loggedUser) window.location.href = "trangchu.html";

        document.getElementById("nav-profile-link").href = `profile.html?profile=${loggedUser}`;

        let coverPosYPercent = 50;
        let currentCover = "";
        let currentAvatar = "";
        let tempAvatarBase64 = "";

        const imgCover = document.getElementById("cover-drag-img");
        const placeholderCover = document.getElementById("cover-placeholder");

        // Lấy dữ liệu từ Firestore lên giao diện cài đặt
        async function loadUserData() {
            try {
                const ref = doc(db, "users", loggedUser);
                const snap = await getDoc(ref);
                if (snap.exists()) {
                    const data = snap.data();
                    
                    if (data.bio) {
                        document.getElementById("settings-bio-input").value = data.bio;
                    }
                    if (data.coverPercent !== undefined) {
                        coverPosYPercent = data.coverPercent;
                    }
                    if (data.cover) {
                        currentCover = data.cover;
                        imgCover.src = currentCover;
                        imgCover.style.objectPosition = `center ${coverPosYPercent}%`;
                        imgCover.classList.remove("hidden");
                        placeholderCover.classList.add("hidden");
                    }
                    if (data.avatar) {
                        currentAvatar = data.avatar;
                        if (currentAvatar.startsWith("data:video") || currentAvatar.includes("video/")) {
                            document.getElementById("settings-avatar-preview").innerHTML = `<video src="${currentAvatar}" class="w-full h-full object-cover" autoplay loop muted></video>`;
                        } else {
                            document.getElementById("settings-avatar-preview").innerHTML = `<img src="${currentAvatar}" class="w-full h-full object-cover">`;
                        }
                    }
                }
            } catch (err) {
                console.error("Lỗi tải dữ liệu cloud:", err);
            }
        }

        loadUserData();

        // KÉO THẢ ẢNH BÌA
        let isDragging = false;
        let startY = 0;
        let startPercent = 50;
        const dragContainer = document.getElementById("cover-drag-container");

        const startDrag = (e) => {
            if (!imgCover.src || imgCover.classList.contains("hidden")) return;
            isDragging = true;
            startY = e.pageY || (e.touches && e.touches[0].pageY);
            startPercent = coverPosYPercent;
        };

        const onDrag = (e) => {
            if (!isDragging) return;
            const currentY = e.pageY || (e.touches && e.touches[0].pageY);
            const deltaY = currentY - startY;
            
            let newPercent = startPercent - (deltaY / 2);
            if (newPercent < 0) newPercent = 0;
            if (newPercent > 100) newPercent = 100;

            coverPosYPercent = newPercent;
            imgCover.style.objectPosition = `center ${coverPosYPercent}%`;
        };

        const stopDrag = () => { isDragging = false; };

        dragContainer.addEventListener("mousedown", startDrag);
        window.addEventListener("mousemove", onDrag);
        window.addEventListener("mouseup", stopDrag);

        dragContainer.addEventListener("touchstart", startDrag);
        window.addEventListener("touchmove", onDrag);
        window.addEventListener("touchend", stopDrag);

        window.handleCoverSelect = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                currentCover = e.target.result;
                imgCover.src = currentCover;
                coverPosYPercent = 50;
                imgCover.style.objectPosition = `center 50%`;
                imgCover.classList.remove("hidden");
                placeholderCover.classList.add("hidden");
            };
            reader.readAsDataURL(file);
        };

        document.getElementById("settings-avatar-input").onchange = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                tempAvatarBase64 = e.target.result;
                if (file.type.startsWith("video")) {
                    document.getElementById("settings-avatar-preview").innerHTML = `<video src="${tempAvatarBase64}" class="w-full h-full object-cover" autoplay loop muted></video>`;
                } else {
                    document.getElementById("settings-avatar-preview").innerHTML = `<img src="${tempAvatarBase64}" class="w-full h-full object-cover">`;
                }
            };
            reader.readAsDataURL(file);
        };

        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hash = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // LƯU VÀ ĐỒNG BỘ LÊN FIRESTORE
        window.saveAppSettings = async () => {
            const bio = document.getElementById("settings-bio-input").value.trim();
            const pass = document.getElementById("settings-new-pass").value.trim();

            const payload = {
                bio: bio || "Chưa có tiểu sử",
                coverPercent: coverPosYPercent
            };

            if (currentCover) {
                payload.cover = currentCover;
            }

            if (tempAvatarBase64) {
                payload.avatar = tempAvatarBase64;
                localStorage.setItem("chat_avatar", tempAvatarBase64); // Đồng bộ nhanh localStorage
                localStorage.setItem("user_avatar", tempAvatarBase64);
            }

            if (pass) {
                payload.password = await hashPassword(pass);
            }

            try {
                await setDoc(doc(db, "users", loggedUser), payload, { merge: true });
                alert("Đã lưu và đồng bộ cloud thành công!");
                window.location.href = `profile.html?profile=${loggedUser}`;
            } catch (err) {
                console.error("Lỗi khi lưu:", err);
                alert("Có lỗi xảy ra khi lưu lên hệ thống.");
            }
        };
    </script>
</body>
</html>
