<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Chủ - MinhNet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

  <!-- Header Navigation -->
  <header class="sticky top-0 z-50 glass-panel border-b border-slate-800 px-6 py-4">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-cube text-cyan-400 text-xl"></i>
        <span class="text-lg font-bold bg-gradient-to-r from-cyan-400 to-purple-400 bg-clip-text text-transparent">MinhNet Hub</span>
      </div>
      <nav class="flex items-center space-x-4 text-sm font-medium">
        <a href="trangchu.html" class="text-cyan-400 flex items-center space-x-1.5"><i class="fa-solid fa-house"></i><span>Trang Chủ</span></a>
        <a href="newfeed.html" class="text-slate-300 hover:text-cyan-400 transition flex items-center space-x-1.5"><i class="fa-solid fa-newspaper"></i><span>Bảng Tin</span></a>
        <a href="profile.html" class="text-slate-300 hover:text-cyan-400 transition flex items-center space-x-1.5"><i class="fa-solid fa-user"></i><span>Cá Nhân</span></a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-4 py-12 text-center space-y-6">
    <div class="glass-panel p-10 rounded-3xl border border-slate-800 shadow-2xl space-y-4">
      <h1 class="text-3xl font-extrabold text-white">Chào mừng đến với hệ thống MinhNet</h1>
      <p class="text-slate-400 text-sm max-w-xl mx-auto">Nền tảng mạng xã hội thu nhỏ bảo mật bằng SHA-256, kết nối mượt mà, tốc độ cao.</p>
      
      <div class="flex justify-center gap-4 pt-4">
        <a href="newfeed.html" class="px-6 py-3 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-sm transition shadow-lg shadow-cyan-500/20 flex items-center space-x-2">
          <i class="fa-solid fa-rocket"></i><span>Vào Bảng Tin Ngay</span>
        </a>
        <a href="profile.html" class="px-6 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-sm transition border border-slate-700 flex items-center space-x-2">
          <i class="fa-solid fa-id-badge"></i><span>Quản Lý Tài Khoản</span>
        </a>
      </div>
    </div>
  </main>

</body>
</html>
