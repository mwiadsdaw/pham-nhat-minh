<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinhNet | Trang Chủ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fbBg: '#18191a',
                        fbPanel: '#242526',
                        fbHover: '#3a3b3c',
                        fbInput: '#3a3b3c',
                        fbBlue: '#2d88ff',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #18191a; color: #e4e6eb; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3a3b3c; border-radius: 3px; }
    </style>
</head>
<body class="bg-fbBg text-[#e4e6eb] min-h-screen flex flex-col overflow-x-hidden pb-14 lg:pb-0">

    <!-- KHUNG ĐĂNG NHẬP / ĐĂNG KÝ -->
    <div id="auth-container" class="fixed inset-0 z-50 bg-[#18191a] flex items-center justify-center p-4">
        <div class="bg-fbPanel p-6 sm:p-8 rounded-2xl max-w-md w-full border border-fbHover shadow-2xl space-y-5">
            <div class="text-center space-y-2">
                <div class="w-16 h-16 bg-fbBlue/10 rounded-full flex items-center justify-center text-fbBlue text-3xl mx-auto border border-fbBlue/20">
                    <i class="fa-solid fa-house"></i>
                </div>
                <h2 class="text-2xl font-bold text-white">Đăng Nhập MinhNet</h2>
                <p class="text-xs text-[#b0b3b8]">Hệ thống mạng xã hội cá nhân bảo mật</p>
            </div>
            <div class="space-y-3 pt-2">
                <div>
                    <label class="text-[11px] font-semibold text-[#b0b3b8] uppercase">Tên tài khoản</label>
                    <input type="text" id="auth-user" placeholder="Nhập username..." class="w-full bg-fbInput border border-transparent focus:border-fbBlue rounded-xl px-4 py-3 text-sm text-white focus:outline-none mt-1">
                </div>
                <div>
                    <label class="text-[11px] font-semibold text-[#b0b3b8] uppercase">Mật khẩu</label>
                    <input type="password" id="auth-pass" placeholder="Nhập mật khẩu..." class="w-full bg-fbInput border border-transparent focus:border-fbBlue rounded-xl px-4 py-3 text-sm text-white focus:outline-none mt-1">
                </div>
                <div class="flex gap-3 pt-3">
                    <button id="btn-login" class="flex-1 bg-fbBlue hover:opacity-90 py-3 rounded-xl text-xs font-bold transition text-white shadow-lg cursor-pointer">Đăng Nhập</button>
                    <button id="btn-register" class="flex-1 bg-fbHover hover:bg-[#4e4f50] py-3 rounded-xl text-xs font-bold transition text-white cursor-pointer">Đăng Ký</button>
                </div>
            </div>
        </div>
    </div>

    <!-- GIAO DIỆN CHÍNH -->
    <div id="app-container" class="hidden flex-1 flex flex-col h-screen overflow-hidden">
        <!-- HEADER TOP -->
        <header class="h-14 bg-fbPanel border-b border-fbHover px-3 sm:px-4 flex items-center justify-between sticky top-0 z-40 shrink-0">
            <div class="flex items-center gap-2 sm:gap-3">
                <a href="trangchu.html" class="text-fbBlue text-2xl sm:text-3xl cursor-pointer hover:opacity-80 transition" title="Trang chủ"><i class="fa-solid fa-house"></i></a>
                
                <!-- Ô tìm kiếm người dùng khác để gửi lời mời kết bạn & Lịch sử tìm kiếm -->
                <div class="relative">
                    <div class="bg-fbInput rounded-full px-3 py-2 flex items-center gap-2 w-[180px] md:w-[240px]">
                        <i class="fa-solid fa-search text-[#b0b3b8] text-xs"></i>
                        <input type="text" id="search-input" placeholder="Tìm kiếm người dùng..." onfocus="showSearchDropdown()" oninput="handleSearchInput(event)" class="bg-transparent text-xs text-white placeholder-[#b0b3b8] focus:outline-none w-full">
                    </div>

                    <!-- Dropdown kết quả tìm kiếm và lịch sử -->
                    <div id="search-dropdown" class="hidden absolute top-12 left-0 w-[280px] sm:w-[320px] bg-fbPanel border border-fbHover rounded-2xl shadow-2xl p-3 z-50 text-xs space-y-2">
                        <div class="flex items-center justify-between border-b border-fbHover pb-2">
                            <span class="font-bold text-[#b0b3b8]">Lịch sử tìm kiếm</span>
                            <button onclick="clearSearchHistory()" class="text-fbBlue hover:underline text-[11px] font-semibold">Xóa lịch sử</button>
                        </div>
                        <div id="search-results-list" class="space-y-1 max-h-[280px] overflow-y-auto"></div>
                    </div>
                </div>
            </div>

            <!-- Nút Friend ở giữa -->
            <div class="flex items-center gap-3">
                <a href="trangchu.html" class="text-fbBlue text-xl px-4 py-2 rounded-xl bg-fbHover transition" title="Trang chủ"><i class="fa-solid fa-house"></i></a>
                <a href="friends.html" class="text-[#b0b3b8] hover:text-white text-xl px-4 py-2 rounded-xl hover:bg-fbHover transition" title="Bạn bè"><i class="fa-solid fa-user-group"></i></a>
            </div>

            <div class="flex items-center gap-2 sm:gap-3 justify-end">
                <!-- Nút Thông báo (Notification) -->
                <div class="relative">
                    <button onclick="toggleNotificationMenu(event)" class="w-9 h-9 rounded-full bg-fbInput hover:bg-fbHover flex items-center justify-center text-[#b0b3b8] transition cursor-pointer relative" title="Thông báo">
                        <i class="fa-solid fa-bell text-sm"></i>
                        <span id="notif-badge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold rounded-full w-4 h-4 flex items-center justify-center">0</span>
                    </button>

                    <!-- Popup Thông báo -->
                    <div id="notif-dropdown" class="hidden absolute right-0 top-12 w-[300px] sm:w-[340px] bg-fbPanel border border-fbHover rounded-2xl shadow-2xl p-3 z-50 space-y-2">
                        <h4 class="text-sm font-bold text-white border-b border-fbHover pb-2">Thông báo</h4>
                        <div id="notif-list" class="space-y-2 max-h-[300px] overflow-y-auto"></div>
                    </div>
                </div>

                <a id="header-profile-link" href="profile.html" class="flex items-center gap-2 cursor-pointer hover:bg-fbHover p-1.5 rounded-full">
                    <div id="header-avatar" class="w-8 h-8 rounded-full bg-gradient-to-tr from-fbBlue to-purple-600 flex items-center justify-center font-bold text-xs text-white overflow-hidden shrink-0">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <span id="header-username" class="text-xs font-bold text-white hidden md:block">---</span>
                </a>
                
                <!-- Nút Cài đặt -->
                <a href="setting.html" title="Cài đặt tài khoản" class="w-9 h-9 rounded-full bg-fbInput hover:bg-fbHover flex items-center justify-center text-[#b0b3b8] transition cursor-pointer shrink-0">
                    <i class="fa-solid fa-gear text-xs"></i>
                </a>

                <button id="btn-logout" title="Đăng xuất" class="w-9 h-9 rounded-full bg-fbInput hover:bg-fbHover flex items-center justify-center text-[#b0b3b8] transition cursor-pointer shrink-0">
                    <i class="fa-solid fa-right-from-bracket text-xs"></i>
                </button>
            </div>
        </header>

        <!-- BODY CHÍNH -->
        <div class="flex-1 flex overflow-hidden relative">
            <!-- CỘT TRÁI (ĐÃ BỎ CÀI ĐẶT Ở CỘT TRÁI THEO YÊU CẦU) -->
            <div class="w-[260px] hidden lg:flex flex-col p-3 space-y-1 overflow-y-auto border-r border-fbHover shrink-0">
                <a id="sidebar-profile-link" href="profile.html" class="flex items-center gap-3 p-2.5 rounded-xl hover:bg-fbHover cursor-pointer transition">
                    <div id="sidebar-avatar" class="w-9 h-9 rounded-full bg-gradient-to-tr from-fbBlue to-purple-600 flex items-center justify-center text-white overflow-hidden font-bold shrink-0">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <span id="sidebar-username" class="text-xs font-bold text-white truncate">---</span>
                </a>
                <div class="flex items-center gap-3 p-2.5 rounded-xl bg-fbHover text-[#e4e6eb]">
                    <i class="fa-solid fa-newspaper text-fbBlue text-lg w-6 text-center"></i>
                    <span class="text-xs font-semibold">Bảng feed</span>
                </div>
                <!-- Nút Bạn bè ở cột trái -->
                <a href="friends.html" class="flex items-center gap-3 p-2.5 rounded-xl hover:bg-fbHover text-[#e4e6eb] transition">
                    <i class="fa-solid fa-user-group text-cyan-400 text-lg w-6 text-center"></i>
                    <span class="text-xs font-semibold">Bạn bè</span>
                </a>
            </div>

            <div class="flex-1 overflow-y-auto p-2 sm:p-4 flex flex-col items-center">
                <div class="max-w-[600px] w-full space-y-4 pb-20 lg:pb-4">
                    
                    <!-- KHUNG ĐĂNG BÀI -->
                    <div class="bg-fbPanel p-3 sm:p-4 rounded-xl border border-fbHover shadow space-y-3">
                        <div class="flex items-center gap-3">
                            <div id="create-post-avatar" class="w-10 h-10 rounded-full bg-fbHover flex items-center justify-center font-bold overflow-hidden shrink-0">
                                <i class="fa-solid fa-user text-sm"></i>
                            </div>
                            <div class="flex-1 bg-fbInput rounded-full px-4 py-2.5 flex items-center justify-between">
                                <input type="text" id="post-title-input" placeholder="Bạn đang nghĩ gì thế?" class="bg-transparent text-xs text-white placeholder-[#b0b3b8] focus:outline-none w-full">
                                <div class="flex items-center gap-2 shrink-0">
                                    <input type="file" id="local-file-input" accept="image/*,video/*" class="hidden" onchange="handleLocalFileSelect(event)">
                                    <button title="Đăng Ảnh/Video" onclick="document.getElementById('local-file-input').click()" class="text-green-500 hover:opacity-80 text-base cursor-pointer"><i class="fa-solid fa-photo-film"></i></button>
                                </div>
                            </div>
                        </div>

                        <div id="selected-media-preview" class="hidden text-[11px] text-green-400 px-3 bg-fbInput py-1.5 rounded-lg flex items-center justify-between">
                            <span id="selected-filename" class="truncate">Đã đính kèm tệp</span>
                            <button onclick="clearSelectedFile()" class="text-red-400 hover:underline font-bold ml-2">Xóa</button>
                        </div>

                        <div class="flex items-center justify-between pt-2 border-t border-fbHover">
                            <button onclick="submitNewPost()" class="w-full bg-fbBlue hover:opacity-90 py-2 rounded-xl text-xs font-bold text-white transition cursor-pointer">Đăng bài</button>
                        </div>
                    </div>

                    <!-- Danh sách bài viết -->
                    <div id="feed-posts-container" class="space-y-4 w-full"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, addDoc, collection, query, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB100rlybpLzv5ax2otgGPzDJc1l5pASyo",
            authDomain: "minh-s-website.firebaseapp.com",
            projectId: "minh-s-website",
            storageBucket: "minh-s-website.appspot.com",
            messagingSenderId: "453574408938",
            appId: "1:453574408938:web:f5b017647a17deacfc3593"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.myUser = localStorage.getItem("chat_user");
        let userAvatarBase64 = localStorage.getItem("user_avatar") || "";
        let uploadedFileBase64 = "";
        let allUsersData = [];

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hash = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        if (window.myUser) initApp();

        document.getElementById("btn-register").onclick = async () => {
            const u = escapeHTML(document.getElementById("auth-user").value.trim().toLowerCase());
            const p = document.getElementById("auth-pass").value.trim();
            if(!u || !p) return alert("Vui lòng điền đủ thông tin!");
            const ref = doc(db, "users", u);
            const snap = await getDoc(ref);
            if(snap.exists()) return alert("Tài khoản đã tồn tại!");
            
            const hashedPass = await hashPassword(p);
            await setDoc(ref, { username: u, password: hashedPass, friends: [], pendingRequests: [], searchHistory: [] });
            alert("Đăng ký thành công!");
        };

        document.getElementById("btn-login").onclick = async () => {
            const u = escapeHTML(document.getElementById("auth-user").value.trim().toLowerCase());
            const p = document.getElementById("auth-pass").value.trim();
            if(!u || !p) return alert("Vui lòng điền đủ thông tin!");
            const ref = doc(db, "users", u);
            const snap = await getDoc(ref);
            
            const hashedPass = await hashPassword(p);
            if(!snap.exists() || snap.data().password !== hashedPass) return alert("Sai tài khoản hoặc mật khẩu!");
            
            window.myUser = u;
            localStorage.setItem("chat_user", u);
            initApp();
        };

        document.getElementById("btn-logout").onclick = () => {
            localStorage.removeItem("chat_user");
            location.reload();
        };

        function initApp() {
            document.getElementById("auth-container").classList.add("hidden");
            document.getElementById("app-container").classList.remove("hidden");
            document.getElementById("header-username").innerText = window.myUser;
            document.getElementById("sidebar-username").innerText = window.myUser;

            document.getElementById("header-profile-link").href = `profile.html?profile=${window.myUser}`;
            document.getElementById("sidebar-profile-link").href = `profile.html?profile=${window.myUser}`;

            updateAvatarUI();
            loadFeedPosts();
            fetchAllUsers();
            listenNotifications();
        }

        function updateAvatarUI() {
            if(userAvatarBase64) {
                const imgTag = `<img src="${userAvatarBase64}" class="w-full h-full object-cover">`;
                const hAv = document.getElementById("header-avatar");
                const sAv = document.getElementById("sidebar-avatar");
                const cAv = document.getElementById("create-post-avatar");
                if(hAv) hAv.innerHTML = imgTag;
                if(sAv) sAv.innerHTML = imgTag;
                if(cAv) cAv.innerHTML = imgTag;
            }
        }

        async function fetchAllUsers() {
            onSnapshot(collection(db, "users"), (snap) => {
                allUsersData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            });
        }

        /* --- TÌM KIẾM NGƯỜI DÙNG & LỊCH SỬ --- */
        window.showSearchDropdown = () => {
            document.getElementById("search-dropdown").classList.remove("hidden");
            renderSearchHistoryOrResults("");
        };

        window.handleSearchInput = (e) => {
            renderSearchHistoryOrResults(e.target.value.trim().toLowerCase());
        };

        async function renderSearchHistoryOrResults(keyword) {
            const list = document.getElementById("search-results-list");
            const myDoc = await getDoc(doc(db, "users", window.myUser));
            const myData = myDoc.exists() ? myDoc.data() : {};
            const history = myData.searchHistory || [];

            if (!keyword) {
                if (history.length === 0) {
                    list.innerHTML = `<p class="text-center text-[#b0b3b8] py-2">Không có lịch sử tìm kiếm</p>`;
                    return;
                }
                list.innerHTML = history.map(item => `
                    <div class="flex items-center justify-between p-2 hover:bg-fbHover rounded-xl cursor-pointer" onclick="selectSearchUser('${escapeHTML(item)}')">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-clock-rotate-left text-[#b0b3b8]"></i>
                            <span class="font-semibold text-white">${escapeHTML(item)}</span>
                        </div>
                        <button onclick="event.stopPropagation(); removeSearchHistoryItem('${escapeHTML(item)}')" class="text-[#b0b3b8] hover:text-red-400 p-1"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                `).join("");
            } else {
                const filtered = allUsersData.filter(u => u.id !== window.myUser && u.id.toLowerCase().includes(keyword));
                if (filtered.length === 0) {
                    list.innerHTML = `<p class="text-center text-[#b0b3b8] py-2">Không tìm thấy người dùng</p>`;
                    return;
                }
                list.innerHTML = filtered.map(u => `
                    <div onclick="selectSearchUser('${escapeHTML(u.id)}')" class="flex items-center justify-between p-2 hover:bg-fbHover rounded-xl cursor-pointer">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 rounded-full bg-fbHover flex items-center justify-center font-bold overflow-hidden">
                                ${u.avatar ? `<img src="${u.avatar}" class="w-full h-full object-cover">` : '<i class="fa-solid fa-user"></i>'}
                            </div>
                            <span class="font-bold text-white">${escapeHTML(u.username || u.id)}</span>
                        </div>
                        <a href="profile.html?profile=${escapeHTML(u.id)}" class="text-xs bg-fbBlue px-2.5 py-1 rounded-lg text-white font-bold">Xem hồ sơ</a>
                    </div>
                `).join("");
            }
        }

        window.selectSearchUser = async (targetUser) => {
            const userRef = doc(db, "users", window.myUser);
            const snap = await getDoc(userRef);
            let history = snap.exists() && snap.data().searchHistory ? snap.data().searchHistory : [];
            if (!history.includes(targetUser)) {
                history.unshift(targetUser);
                await setDoc(userRef, { searchHistory: history }, { merge: true });
            }
            window.location.href = `profile.html?profile=${targetUser}`;
        };

        window.removeSearchHistoryItem = async (item) => {
            const userRef = doc(db, "users", window.myUser);
            const snap = await getDoc(userRef);
            if (snap.exists()) {
                let history = snap.data().searchHistory || [];
                history = history.filter(h => h !== item);
                await setDoc(userRef, { searchHistory: history }, { merge: true });
                renderSearchHistoryOrResults("");
            }
        };

        window.clearSearchHistory = async () => {
            await setDoc(doc(db, "users", window.myUser), { searchHistory: [] }, { merge: true });
            renderSearchHistoryOrResults("");
        };

        document.addEventListener("click", (e) => {
            const dropdown = document.getElementById("search-dropdown");
            const input = document.getElementById("search-input");
            if (dropdown && !dropdown.contains(e.target) && e.target !== input) {
                dropdown.classList.add("hidden");
            }
        });

        /* --- THÔNG BÁO NOTIFICATION --- */
        window.toggleNotificationMenu = (e) => {
            e.stopPropagation();
            document.getElementById("notif-dropdown").classList.toggle("hidden");
        };

        function listenNotifications() {
            onSnapshot(doc(db, "users", window.myUser), (snap) => {
                if(!snap.exists()) return;
                const notifs = snap.data().notifications || [];
                const badge = document.getElementById("notif-badge");
                const unread = notifs.filter(n => !n.read).length;

                if(unread > 0) {
                    badge.innerText = unread;
                    badge.classList.remove("hidden");
                } else {
                    badge.classList.add("hidden");
                }

                const container = document.getElementById("notif-list");
                if(notifs.length === 0) {
                    container.innerHTML = `<p class="text-center text-xs text-[#b0b3b8] py-2">Không có thông báo mới</p>`;
                    return;
                }

                container.innerHTML = notifs.map(n => `
                    <div onclick="location.href='friends.html'" class="p-2 rounded-xl hover:bg-fbHover cursor-pointer flex items-center gap-3 text-xs ${n.read ? 'opacity-70' : 'font-bold bg-fbHover/40'}">
                        <div class="w-8 h-8 rounded-full bg-fbBlue flex items-center justify-center text-white shrink-0">
                            <i class="fa-solid fa-user-plus"></i>
                        </div>
                        <div class="flex-1">
                            <p class="text-white">${escapeHTML(n.text)}</p>
                            <span class="text-[10px] text-[#b0b3b8]">Bấm để đi tới phần bạn bè</span>
                        </div>
                    </div>
                `).join("");
            });
        }

        /* --- BÀI VIẾT FEED --- */
        window.handleLocalFileSelect = (event) => {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedFileBase64 = e.target.result;
                document.getElementById("selected-filename").innerText = `Đã chọn: ${file.name}`;
                document.getElementById("selected-media-preview").classList.remove("hidden");
            };
            reader.readAsDataURL(file);
        };

        window.clearSelectedFile = () => {
            uploadedFileBase64 = "";
            document.getElementById("local-file-input").value = "";
            document.getElementById("selected-media-preview").classList.add("hidden");
        };

        window.submitNewPost = async () => {
            const title = escapeHTML(document.getElementById("post-title-input").value.trim());
            const media = uploadedFileBase64;
            if(!title && !media) return alert("Vui lòng nhập nội dung hoặc chọn tệp đính kèm!");

            await addDoc(collection(db, "posts"), {
                author: window.myUser,
                title,
                media,
                createdAt: serverTimestamp()
            });
            document.getElementById("post-title-input").value = "";
            clearSelectedFile();
            alert("Đăng bài thành công!");
        };

        function loadFeedPosts() {
            const q = query(collection(db, "posts"));
            onSnapshot(q, (snap) => {
                const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                docs.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                document.getElementById("feed-posts-container").innerHTML = docs.map(p => `
                    <div class="bg-fbPanel rounded-xl border border-fbHover p-4 space-y-3 shadow">
                        <a href="profile.html?profile=${escapeHTML(p.author)}" class="text-xs font-bold text-white hover:underline flex items-center gap-2">
                            <i class="fa-solid fa-circle-user text-base text-fbBlue"></i>
                            ${escapeHTML(p.author)}
                        </a>
                        ${p.title ? `<p class="text-xs text-slate-200 break-words">${escapeHTML(p.title)}</p>` : ''}
                        ${p.media ? `<div class="rounded-lg overflow-hidden bg-black max-h-[350px] sm:max-h-[400px] flex items-center justify-center"><img src="${p.media}" class="w-full object-cover"></div>` : ''}
                    </div>
                `).join("");
            });
        }
    </script>
</body>
</html>
