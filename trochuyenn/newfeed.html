    <!-- SCRIPT TÍCH HỢP BẢO MẬT SHA-256 & XSS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, addDoc, collection, query, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB100rlybpLzv5ax2otgGPzDJc1l5pASyo",
            authDomain: "minh-s-website.firebaseapp.com",
            projectId: "minh-s-website",
            storageBucket: "minh-s-website.appspot.com",
            messagingSenderId: "453574408938",
            appId: "1:453574408938:web:f5b017647a17deacfc3593"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.myUser = localStorage.getItem("chat_user");
        let userAvatarBase64 = localStorage.getItem("user_avatar") || "";
        let uploadedFileBase64 = "";
        const NOTIFICATION_HIDE_DURATION = 2 * 60 * 60 * 1000;

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        }

        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hash = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        window.switchMainTab = (tabName) => {
            ['home', 'reels', 'friends'].forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                if(el) el.classList.add('hidden');
            });
            
            ['home', 'reels', 'friends'].forEach(n => {
                const btn = document.getElementById(`nav-${n}`);
                if(btn) {
                    btn.classList.remove('border-fbBlue', 'text-fbBlue');
                    btn.classList.add('border-transparent', 'text-[#b0b3b8]');
                }
                const mBtn = document.getElementById(`mobile-nav-${n}`);
                if(mBtn) {
                    mBtn.classList.remove('text-fbBlue');
                    mBtn.classList.add('text-[#b0b3b8]');
                }
            });

            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            const activeNav = document.getElementById(`nav-${tabName}`);
            if(activeNav) activeNav.classList.add('border-fbBlue', 'text-fbBlue');

            const activeMNav = document.getElementById(`mobile-nav-${tabName}`);
            if(activeMNav) activeMNav.classList.add('text-fbBlue');
        };

        if (window.myUser) initApp();

        document.getElementById("btn-register").onclick = async () => {
            const u = escapeHTML(document.getElementById("auth-user").value.trim().toLowerCase());
            const p = document.getElementById("auth-pass").value.trim();
            if(!u || !p) return alert("Vui lòng điền đủ thông tin!");
            const ref = doc(db, "users", u);
            const snap = await getDoc(ref);
            if(snap.exists()) return alert("Tài khoản đã tồn tại!");
            
            const hashedPass = await hashPassword(p);
            await setDoc(ref, { username: u, password: hashedPass, avatar: "", bio: "" });
            alert("Đăng ký thành công!");
        };

        document.getElementById("btn-login").onclick = async () => {
            const u = escapeHTML(document.getElementById("auth-user").value.trim().toLowerCase());
            const p = document.getElementById("auth-pass").value.trim();
            if(!u || !p) return alert("Vui lòng điền đủ thông tin!");
            const ref = doc(db, "users", u);
            const snap = await getDoc(ref);
            
            const hashedPass = await hashPassword(p);
            if(!snap.exists() || snap.data().password !== hashedPass) return alert("Sai tài khoản hoặc mật khẩu!");
            
            window.myUser = u;
            localStorage.setItem("chat_user", u);
            initApp();
        };

        document.getElementById("btn-logout").onclick = () => {
            localStorage.removeItem("chat_user");
            location.reload();
        };

        function initApp() {
            document.getElementById("auth-container").classList.add("hidden");
            document.getElementById("app-container").classList.remove("hidden");
            document.getElementById("header-username").innerText = window.myUser;
            document.getElementById("sidebar-username").innerText = window.myUser;

            if(window.myUser === "phamnhatminh") {
                document.getElementById("admin-badge").classList.remove("hidden");
                document.getElementById("admin-menu-btn").classList.remove("hidden");
                document.getElementById("admin-broadcast-btn").classList.remove("hidden");
            }

            checkSystemNotification();
            loadFeedPosts();

            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('post');
            if (postId) openPostDetail(postId);

            updateAvatarUI();
        }

        function checkSystemNotification() {
            const hiddenUntil = localStorage.getItem("hide_system_notif_until");
            const now = new Date().getTime();
            if (hiddenUntil && now < parseInt(hiddenUntil)) return;

            const notifRef = doc(db, "system", "broadcast");
            getDoc(notifRef).then(snap => {
                if(snap.exists() && snap.data().message) {
                    document.getElementById("system-notification-banner").classList.remove("hidden");
                    document.getElementById("system-notification-text").innerText = snap.data().message;
                }
            });
        }

        window.dismissSystemNotification = () => {
            localStorage.setItem("hide_system_notif_until", new Date().getTime() + NOTIFICATION_HIDE_DURATION);
            document.getElementById("system-notification-banner").classList.add("hidden");
        };

        window.openBroadcastModal = () => document.getElementById("broadcast-modal").classList.remove("hidden");

        window.sendBroadcast = async () => {
            const msg = escapeHTML(document.getElementById("broadcast-input").value.trim());
            if(!msg) return;
            await setDoc(doc(db, "system", "broadcast"), { message: msg });
            localStorage.removeItem("hide_system_notif_until");
            alert("Đã gửi thông báo hệ thống!");
            document.getElementById("broadcast-modal").classList.add("hidden");
            checkSystemNotification();
        };

        function updateAvatarUI() {
            if(userAvatarBase64) {
                const imgTag = `<img src="${userAvatarBase64}" class="w-full h-full object-cover">`;
                document.getElementById("header-avatar").innerHTML = imgTag;
                document.getElementById("sidebar-avatar").innerHTML = imgTag;
                document.getElementById("create-post-avatar").innerHTML = imgTag;
            }
        }

        window.handleLocalFileSelect = (event) => {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedFileBase64 = e.target.result;
                document.getElementById("selected-filename").innerText = `Đã chọn: ${file.name}`;
                document.getElementById("selected-media-preview").classList.remove("hidden");
            };
            reader.readAsDataURL(file);
        };

        window.clearSelectedFile = () => {
            uploadedFileBase64 = "";
            document.getElementById("local-file-input").value = "";
            document.getElementById("selected-media-preview").classList.add("hidden");
        };

        window.submitNewPost = async () => {
            const title = escapeHTML(document.getElementById("post-title-input").value.trim());
            const media = uploadedFileBase64;
            const privacy = document.getElementById("post-privacy").value;
            const type = document.getElementById("post-type").value;
            if(!title && !media) return alert("Vui lòng nhập nội dung hoặc chọn tệp đính kèm!");

            await addDoc(collection(db, "posts"), {
                author: window.myUser,
                title,
                media,
                privacy,
                type,
                likes: [],
                comments: [],
                createdAt: serverTimestamp()
            });
            document.getElementById("post-title-input").value = "";
            clearSelectedFile();
            alert("Đăng bài thành công!");
        };

        function loadFeedPosts() {
            const q = query(collection(db, "posts"));
            onSnapshot(q, (snap) => {
                const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                docs.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                document.getElementById("feed-posts-container").innerHTML = docs.map(p => renderPostCard(p)).join("");
            });
        }

        function renderPostCard(p) {
            const likesCount = p.likes ? p.likes.length : 0;
            const isLiked = p.likes && p.likes.includes(window.myUser);
            const comments = p.comments || [];

            return `
                <div class="bg-fbPanel rounded-xl border border-fbHover p-3 sm:p-4 space-y-3 shadow">
                    <h4 class="text-xs font-bold text-white cursor-pointer hover:underline" onclick="window.location.href='profile.html?profile=${escapeHTML(p.author)}'">${escapeHTML(p.author)}</h4>
                    <p class="text-xs text-slate-200 break-words">${escapeHTML(p.title)}</p>
                    ${p.media ? `<div class="rounded-lg overflow-hidden bg-black max-h-[350px] sm:max-h-[400px] flex items-center justify-center"><img src="${p.media}" class="w-full object-cover"></div>`: ''}
                    
                    <div class="flex items-center justify-between text-[11px] text-[#b0b3b8] pt-1 border-t border-fbHover">
                        <span><i class="fa-solid fa-thumbs-up text-fbBlue"></i> ${likesCount} thích</span>
                        <span>${comments.length} bình luận</span>
                    </div>

                    <div class="grid grid-cols-3 gap-1 pt-1 border-t border-fbHover text-xs font-semibold text-[#b0b3b8]">
                        <button onclick="toggleLike('${p.id}')" class="hover:bg-fbHover py-2 rounded-lg flex items-center justify-center gap-1 transition cursor-pointer ${isLiked ? 'text-fbBlue font-bold' : ''}">
                            <i class="fa-solid fa-thumbs-up"></i> Thích
                        </button>
                        <button onclick="openPostDetail('${p.id}')" class="hover:bg-fbHover py-2 rounded-lg flex items-center justify-center gap-1 transition cursor-pointer">
                            <i class="fa-solid fa-comment"></i> Trả lời
                        </button>
                        <button onclick="sharePost('${p.id}')" class="hover:bg-fbHover py-2 rounded-lg flex items-center justify-center gap-1 transition cursor-pointer">
                            <i class="fa-solid fa-share"></i> Chia sẻ
                        </button>
                    </div>
                </div>
            `;
        }

        window.openPostDetail = async (postId) => {
            window.history.pushState({}, '', `?post=${postId}`);
            const postRef = doc(db, "posts", postId);
            const snap = await getDoc(postRef);
            if (!snap.exists()) return;

            const p = snap.data();
            const likesCount = p.likes ? p.likes.length : 0;
            const comments = p.comments || [];

            document.getElementById("modal-post-author").innerText = `Bài viết của ${p.author}`;
            document.getElementById("modal-post-content").innerHTML = `
                <div class="space-y-3">
                    <p class="text-sm text-slate-100 break-words">${escapeHTML(p.title)}</p>
                    ${p.media ? `<div class="rounded-xl overflow-hidden bg-black max-h-[400px] flex items-center justify-center border border-fbHover"><img src="${p.media}" class="w-full object-cover"></div>` : ''}
                    <div class="flex justify-between text-xs text-[#b0b3b8] pt-2 border-t border-fbHover">
                        <span><i class="fa-solid fa-thumbs-up text-fbBlue"></i> ${likesCount} lượt thích</span>
                        <span>${comments.length} bình luận</span>
                    </div>
                    <div class="space-y-4 pt-2">
                        <h5 class="text-xs font-bold text-white">Bình luận</h5>
                        ${comments.map((c, index) => `
                            <div class="space-y-2">
                                <div class="flex gap-2 items-start">
                                    <div class="w-7 h-7 rounded-full bg-fbHover flex items-center justify-center text-xs font-bold shrink-0 mt-1"><i class="fa-solid fa-user"></i></div>
                                    <div class="flex-1">
                                        <div class="bg-fbInput p-2.5 rounded-2xl max-w-[90%]">
                                            <span class="font-bold text-xs text-white block cursor-pointer hover:underline" onclick="window.location.href='profile.html?profile=${escapeHTML(c.user)}'">${escapeHTML(c.user)}</span>
                                            <span class="text-xs text-slate-200 break-words">${escapeHTML(c.text)}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            document.getElementById("modal-comment-btn").onclick = async () => {
                const input = document.getElementById("modal-comment-input");
                const text = escapeHTML(input.value.trim());
                if (!text) return;
                let updatedComments = p.comments || [];
                updatedComments.push({ user: window.myUser, text, time: 'Vừa xong', replies: [] });
                await setDoc(postRef, { comments: updatedComments }, { merge: true });
                input.value = "";
                openPostDetail(postId);
            };

            document.getElementById("post-detail-modal").classList.remove("hidden");
        };

        window.closePostDetailModal = () => {
            document.getElementById("post-detail-modal").classList.add("hidden");
            window.history.pushState({}, '', window.location.pathname);
        };

        window.toggleLike = async (postId) => {
            const postRef = doc(db, "posts", postId);
            const snap = await getDoc(postRef);
            if(!snap.exists()) return;
            let likes = snap.data().likes || [];
            if(likes.includes(window.myUser)) likes = likes.filter(u => u !== window.myUser);
            else likes.push(window.myUser);
            await setDoc(postRef, { likes }, { merge: true });
        };

        window.sharePost = (postId) => {
            const shareUrl = `${window.location.origin}${window.location.pathname.replace('newfeed.html', 'newfeed.html')}?post=${postId}`;
            navigator.clipboard.writeText(shareUrl);
            alert("Đã sao chép liên kết bài viết!");
        };

        window.openAdminModal = () => document.getElementById("admin-modal").classList.remove("hidden");
    </script>
</body>
</html>
