<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phòng Trò Chuyện Trực Tuyến - MinhNet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .glass-panel {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="glass-panel border-b border-slate-800 px-4 py-3 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="../index.html" class="flex items-center space-x-2 bg-slate-800/80 hover:bg-slate-700 text-slate-200 px-3.5 py-1.5 rounded-xl border border-slate-700/60 transition text-sm font-medium">
                <i class="fa-solid fa-house text-cyan-400"></i>
                <span>Trang chủ</span>
            </a>
            <h1 class="text-base sm:text-lg font-bold bg-gradient-to-r from-cyan-400 to-purple-400 bg-clip-text text-transparent flex items-center gap-2">
                <i class="fa-solid fa-comments text-cyan-400"></i> Phòng Trò Chuyện Chung
            </h1>
            <div class="w-20"></div> <!-- Spacer căn giữa tiêu đề -->
        </div>
    </header>

    <!-- Main Chat Container -->
    <main class="max-w-4xl mx-auto w-full flex-1 p-4 flex flex-col justify-between my-auto">
        <div class="glass-panel rounded-2xl p-4 flex flex-col h-[75vh] border border-slate-800 shadow-2xl">
            
            <!-- Nhập tên hiển thị -->
            <div class="pb-3 mb-3 border-b border-slate-800 flex items-center gap-3">
                <span class="text-xs text-slate-400 font-medium shrink-0"><i class="fa-solid fa-user-pen mr-1 text-cyan-400"></i> Tên của bạn:</span>
                <input type="text" id="chat-username" placeholder="Nhập tên hiển thị..." 
                       class="bg-slate-900 border border-slate-700/80 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-cyan-500 w-48 transition">
            </div>

            <!-- Khung chứa tin nhắn -->
            <div id="chat-messages" class="flex-1 overflow-y-auto space-y-3 pr-2 scrollbar-thin scrollbar-thumb-slate-800">
                <p class="text-slate-500 text-center py-10 text-xs">Đang tải lịch sử trò chuyện...</p>
            </div>

            <!-- Khu vực gửi tin nhắn -->
            <div class="pt-3 mt-3 border-t border-slate-800 flex gap-2">
                <input type="text" id="chat-message-input" placeholder="Nhập nội dung tin nhắn..." 
                       class="flex-1 bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-2.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition">
                <button id="chat-send-btn" class="bg-gradient-to-r from-cyan-600 to-purple-600 hover:opacity-90 text-white px-5 py-2.5 rounded-xl text-xs font-semibold transition shrink-0 flex items-center gap-1.5 shadow-lg shadow-cyan-500/10">
                    <span>Gửi</span>
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>

        </div>
    </main>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB100rlybpLzv5ax2otgGPzDJc1l5pASyo",
            authDomain: "minh-s-website.firebaseapp.com",
            projectId: "minh-s-website",
            storageBucket: "minh-s-website.appspot.com",
            messagingSenderId: "453574408938",
            appId: "1:453574408938:web:f5b017647a17deacfc3593"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Chống XSS
        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        }

        const msgInput = document.getElementById('chat-message-input');
        const nameInput = document.getElementById('chat-username');
        const sendBtn = document.getElementById('chat-send-btn');
        const messagesContainer = document.getElementById('chat-messages');

        // Gửi tin nhắn
        async function sendChatMessage() {
            const text = escapeHTML(msgInput.value.trim());
            const userName = escapeHTML(nameInput.value.trim()) || "Ẩn danh";
            if (!text) return;

            try {
                await addDoc(collection(db, "messages"), {
                    text: text,
                    user: userName,
                    createdAt: serverTimestamp()
                });
                msgInput.value = "";
            } catch (err) {
                alert("Lỗi gửi tin nhắn: " + err.message);
            }
        }

        sendBtn.onclick = sendChatMessage;
        msgInput.onkeypress = (e) => { if (e.key === 'Enter') sendChatMessage(); };

        // Lắng nghe realtime tin nhắn
        const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
        onSnapshot(q, (snapshot) => {
            if (snapshot.empty) {
                messagesContainer.innerHTML = `<p class="text-slate-500 text-center py-10 text-xs">Chưa có tin nhắn nào. Hãy mở lời chào đầu tiên!</p>`;
                return;
            }

            messagesContainer.innerHTML = snapshot.docs.map(docSnap => {
                const msg = docSnap.data();
                return `
                    <div class="flex flex-col items-start">
                        <span class="text-[10px] text-purple-400 mb-0.5 px-1 font-semibold"><i class="fa-solid fa-user-circle mr-1"></i>${escapeHTML(msg.user || 'Ẩn danh')}</span>
                        <div class="px-3.5 py-2 rounded-xl max-w-[85%] break-words bg-slate-900 text-slate-200 border border-slate-800 text-xs shadow-sm">
                            ${escapeHTML(msg.text)}
                        </div>
                    </div>
                `;
            }).join('');
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        });
    </script>
</body>
</html>
