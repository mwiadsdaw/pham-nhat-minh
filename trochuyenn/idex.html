<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinhNet | Phạm Nhật Minh</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fbBg: '#18191a',
                        fbPanel: '#242526',
                        fbHover: '#3a3b3c',
                        fbInput: '#3a3b3c',
                        fbBlue: '#2d88ff',
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase CDN SDKs (Compat v9) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #18191a;
            color: #e4e6eb;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a3b3c;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-fbBg text-[#e4e6eb] min-h-screen flex flex-col overflow-x-hidden">

    <!-- KHUNG ĐĂNG NHẬP / ĐĂNG KÝ -->
    <div id="auth-container" class="fixed inset-0 z-50 bg-[#18191a] flex items-center justify-center p-4">
        <div class="bg-fbPanel p-8 rounded-2xl max-w-md w-full border border-fbHover shadow-2xl space-y-5">
            <div class="text-center space-y-2">
                <div class="w-16 h-16 bg-fbBlue/10 rounded-full flex items-center justify-center text-fbBlue text-3xl mx-auto border border-fbBlue/20">
                    <i class="fa-solid fa-compass"></i>
                </div>
                <h2 class="text-2xl font-bold text-white">Đăng Nhập MinhNet</h2>
                <p class="text-xs text-[#b0b3b8]">Admin: phamnhatminh / 2011</p>
            </div>
            <div class="space-y-3 pt-2">
                <div>
                    <label class="text-[11px] font-semibold text-[#b0b3b8] uppercase">Tên tài khoản</label>
                    <input type="text" id="auth-user" placeholder="Nhập username..." class="w-full bg-fbInput border border-transparent focus:border-fbBlue rounded-xl px-4 py-3 text-sm text-white focus:outline-none mt-1">
                </div>
                <div>
                    <label class="text-[11px] font-semibold text-[#b0b3b8] uppercase">Mật khẩu</label>
                    <input type="password" id="auth-pass" placeholder="Nhập mật khẩu..." class="w-full bg-fbInput border border-transparent focus:border-fbBlue rounded-xl px-4 py-3 text-sm text-white focus:outline-none mt-1">
                </div>
                <div class="flex gap-3 pt-3">
                    <button id="btn-login" onclick="handleLogin()" class="flex-1 bg-fbBlue hover:opacity-90 py-3 rounded-xl text-xs font-bold transition text-white shadow-lg cursor-pointer">Đăng Nhập</button>
                    <button id="btn-register" onclick="handleRegister()" class="flex-1 bg-fbHover hover:bg-[#4e4f50] py-3 rounded-xl text-xs font-bold transition text-white cursor-pointer">Đăng Ký</button>
                </div>
            </div>
        </div>
    </div>

    <!-- GIAO DIỆN CHÍNH -->
    <div id="app-container" class="hidden flex-1 flex flex-col h-screen overflow-hidden">

        <!-- HEADER TOP -->
        <header class="h-14 bg-fbPanel border-b border-fbHover px-4 flex items-center justify-between sticky top-0 z-40 shrink-0">
            <div class="flex items-center gap-3 w-1/4">
                <i class="fa-solid fa-compass text-fbBlue text-3xl cursor-pointer" onclick="switchMainTab('home')"></i>
                <div class="bg-fbInput rounded-full px-3 py-2 flex items-center gap-2 w-full max-w-[240px]">
                    <i class="fa-solid fa-search text-[#b0b3b8] text-xs"></i>
                    <input type="text" placeholder="Tìm kiếm trên MinhNet" class="bg-transparent text-xs text-white placeholder-[#b0b3b8] focus:outline-none w-full">
                </div>
            </div>

            <div class="flex items-center gap-2 md:gap-6">
                <button onclick="switchMainTab('home')" id="nav-home" class="h-12 px-6 flex items-center justify-center border-b-4 border-fbBlue text-fbBlue text-xl rounded-lg hover:bg-fbHover transition cursor-pointer"><i class="fa-solid fa-house"></i></button>
                <button onclick="switchMainTab('reels')" id="nav-reels" class="h-12 px-6 flex items-center justify-center border-b-4 border-transparent text-[#b0b3b8] text-xl rounded-lg hover:bg-fbHover transition cursor-pointer"><i class="fa-solid fa-clapperboard"></i></button>
                <button onclick="switchMainTab('friends')" id="nav-friends" class="h-12 px-6 flex items-center justify-center border-b-4 border-transparent text-[#b0b3b8] text-xl rounded-lg hover:bg-fbHover transition cursor-pointer"><i class="fa-solid fa-user-group"></i></button>
            </div>

            <div class="flex items-center gap-3 w-1/4 justify-end">
                <div id="admin-badge" class="hidden bg-red-500/20 text-red-400 border border-red-500/30 text-[10px] px-2.5 py-1 rounded-full font-bold">
                    Admin Panel
                </div>
                <div class="flex items-center gap-2 cursor-pointer hover:bg-fbHover p-1.5 rounded-full" onclick="openProfile(myUser)">
                    <div id="header-avatar" class="w-8 h-8 rounded-full bg-gradient-to-tr from-fbBlue to-purple-600 flex items-center justify-center font-bold text-xs text-white overflow-hidden">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <span id="header-username" class="text-xs font-bold text-white hidden sm:block">---</span>
                </div>
                <button onclick="handleLogout()" title="Đăng xuất" class="w-9 h-9 rounded-full bg-fbInput hover:bg-fbHover flex items-center justify-center text-[#b0b3b8] transition cursor-pointer">
                    <i class="fa-solid fa-right-from-bracket text-xs"></i>
                </button>
            </div>
        </header>

        <!-- BODY CHÍNH -->
        <div class="flex-1 flex overflow-hidden relative">

            <!-- CỘT TRÁI CHUNG -->
            <div class="w-[280px] hidden lg:flex flex-col p-3 space-y-1 overflow-y-auto border-r border-fbHover shrink-0">
                <div onclick="openProfile(myUser)" class="flex items-center gap-3 p-2.5 rounded-xl hover:bg-fbHover cursor-pointer transition">
                    <div id="sidebar-avatar" class="w-9 h-9 rounded-full bg-gradient-to-tr from-fbBlue to-purple-600 flex items-center justify-center text-white overflow-hidden font-bold">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <span id="sidebar-username" class="text-xs font-bold text-white">---</span>
                </div>
                <div onclick="switchMainTab('home')" class="flex items-center gap-3 p-2.5 rounded-xl hover:bg-fbHover cursor-pointer transition text-[#e4e6eb]">
                    <i class="fa-solid fa-users text-fbBlue text-lg w-6 text-center"></i>
                    <span class="text-xs font-semibold">Bảng feed</span>
                </div>
                <div onclick="switchMainTab('reels')" class="flex items-center gap-3 p-2.5 rounded-xl hover:bg-fbHover cursor-pointer transition text-[#e4e6eb]">
                    <i class="fa-solid fa-clapperboard text-purple-400 text-lg w-6 text-center"></i>
                    <span class="text-xs font-semibold">Thước phim (Reels)</span>
                </div>
                <div onclick="switchMainTab('friends')" class="flex items-center gap-3 p-2.5 rounded-xl hover:bg-fbHover cursor-pointer transition text-[#e4e6eb]">
                    <i class="fa-solid fa-user-group text-cyan-400 text-lg w-6 text-center"></i>
                    <span class="text-xs font-semibold">Bạn bè</span>
                </div>
            </div>

            <!-- TAB 1: HOME -->
            <div id="tab-home" class="flex-1 flex overflow-hidden">
                <div class="flex-1 overflow-y-auto p-4 flex flex-col items-center">
                    <div class="max
