<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phạm Nhật Minh | Portfolio & Creator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        accentCyan: '#06b6d4',
                        accentPurple: '#8b5cf6',
                        accentEmerald: '#10b981',
                    },
                    animation: {
                        'float': 'float 4s ease-in-out infinite',
                        'pulse-glow': 'pulseGlow 3s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: '0.4' },
                            '50%': { opacity: '0.8' },
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-panel-hover:hover {
            background: rgba(30, 41, 59, 0.85);
            border-color: rgba(6, 182, 212, 0.4);
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.15);
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-darkBg text-slate-100 selection:bg-cyan-500 selection:text-white relative">

    <!-- Background Glow Blobs -->
    <div class="absolute top-0 left-1/4 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl pointer-events-none animate-pulse-glow"></div>
    <div class="absolute top-1/3 right-1/4 w-96 h-96 bg-cyan-600/20 rounded-full blur-3xl pointer-events-none animate-pulse-glow" style="animation-delay: 1.5s;"></div>

    <!-- ==================== HEADER / NAVIGATION BAR ==================== -->
    <header class="fixed top-0 left-0 right-0 z-50 glass-panel border-b border-slate-800/60 transition-all duration-300" id="navbar">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <!-- Logo / Name -->
            <a href="#hero" class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-500 bg-clip-text text-transparent flex items-center gap-2">
                <i class="fa-solid fa-code text-cyan-400"></i> Phạm Nhật Minh
            </a>

            <!-- Desktop Nav Links -->
            <nav class="hidden md:flex items-center gap-7 text-sm font-medium text-slate-300">
                <a href="#about" class="hover:text-cyan-400 transition-colors">Giới thiệu</a>
                <a href="#music-section" class="hover:text-cyan-400 transition-colors">Góc Âm Nhạc</a>
                <a href="#projects" class="hover:text-cyan-400 transition-colors">Dự án</a>
                <a href="/hoctap" class="hover:text-cyan-400 transition-colors flex items-center gap-1.5 text-cyan-300 font-semibold">
                    <i class="fa-solid fa-graduation-cap text-xs"></i> Học tập
                </a>
                <a href="/trochuyenn" class="hover:text-cyan-400 transition-colors flex items-center gap-1.5 text-purple-300 font-semibold">
                    <i class="fa-solid fa-comments text-xs"></i> Trò chuyện
                </a>
                <a href="#contact" class="hover:text-cyan-400 transition-colors">Liên hệ</a>
            </nav>

            <!-- CTA Button -->
            <div class="hidden md:block">
                <a href="#contact" class="px-5 py-2.5 rounded-full text-xs font-semibold uppercase tracking-wider bg-gradient-to-r from-cyan-500 to-purple-600 text-white shadow-lg shadow-cyan-500/20 hover:shadow-cyan-500/40 hover:scale-105 transition-all duration-300">
                    Kết nối ngay
                </a>
            </div>

            <!-- Mobile Menu Toggle Button -->
            <button id="menu-btn" class="md:hidden text-slate-300 hover:text-white text-2xl focus:outline-none">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>

        <!-- Mobile Menu Dropdown -->
        <div id="mobile-menu" class="hidden md:hidden glass-panel border-t border-slate-800 px-6 py-4 flex flex-col gap-3 text-slate-300">
            <a href="#about" class="mobile-link hover:text-cyan-400 py-1">Giới thiệu</a>
            <a href="#music-section" class="mobile-link hover:text-cyan-400 py-1">Góc Âm Nhạc</a>
            <a href="#projects" class="mobile-link hover:text-cyan-400 py-1">Dự án</a>
            <a href="/hoctap" class="mobile-link hover:text-cyan-400 py-1 font-semibold text-cyan-300 flex items-center gap-2">
                <i class="fa-solid fa-graduation-cap"></i> Học tập
            </a>
            <a href="/trochuyenn" class="mobile-link hover:text-cyan-400 py-1 font-semibold text-purple-300 flex items-center gap-2">
                <i class="fa-solid fa-comments"></i> Trò chuyện
