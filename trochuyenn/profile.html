<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Cá Nhân - MinhNet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fbBg: '#18191a',
                        fbPanel: '#242526',
                        fbHover: '#3a3b3c',
                        fbInput: '#3a3b3c',
                        fbBlue: '#2d88ff',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #18191a; color: #e4e6eb; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #3a3b3c; border-radius: 3px; }
    </style>
</head>
<body class="bg-fbBg text-[#e4e6eb] min-h-screen flex flex-col overflow-x-hidden pb-14">

    <!-- HEADER TOP -->
    <header class="h-14 bg-fbPanel border-b border-fbHover px-3 sm:px-4 flex items-center justify-between sticky top-0 z-40 shrink-0">
        <div class="flex items-center gap-3">
            <a href="newfeed.html" class="text-fbBlue text-2xl sm:text-3xl cursor-pointer hover:opacity-85 transition" title="Về Bảng Tin"><i class="fa-solid fa-arrow-left"></i></a>
            <span class="text-sm font-bold text-white">Trang Cá Nhân</span>
        </div>
        <a href="trangchu.html" class="text-fbBlue font-bold text-xs bg-fbInput px-3 py-1.5 rounded-xl hover:bg-fbHover">Về Trang Chủ</a>
    </header>

    <!-- CONTAINER PROFILE -->
    <div class="w-full flex flex-col items-center bg-fbBg pb-20">
        
        <!-- Khung Banner & Avatar Header -->
        <div class="w-full max-w-[1050px] bg-fbPanel border-b border-fbHover relative">
            <div class="w-full h-48 sm:h-72 md:h-80 bg-gradient-to-r from-slate-900 via-gray-800 to-zinc-900 relative rounded-b-xl overflow-hidden">
                <button class="absolute bottom-3 right-3 bg-white/10 hover:bg-white/20 backdrop-blur-md text-white text-xs font-semibold px-3 py-1.5 rounded-lg flex items-center gap-2 cursor-pointer transition">
                    <i class="fa-solid fa-camera"></i> Thêm ảnh bìa
                </button>
            </div>

            <div class="px-4 sm:px-8 pb-4 relative flex flex-col md:flex-row items-center md:items-end justify-between gap-4 -mt-16 sm:-mt-20">
                <div class="flex flex-col md:flex-row items-center md:items-end gap-4 text-center md:text-left">
                    <div class="relative group">
                        <div id="profile-avatar-box" class="w-32 h-32 sm:w-40 sm:h-40 rounded-full border-4 border-fbPanel bg-fbHover flex items-center justify-center text-5xl font-bold text-white overflow-hidden shadow-2xl relative">
                            <i class="fa-solid fa-user"></i>
                        </div>
                    </div>
                    <div class="space-y-1 mb-2">
                        <h2 id="profile-username" class="text-2xl sm:text-3xl font-extrabold text-white">---</h2>
                        <p id="profile-friends-count" class="text-xs font-semibold text-[#b0b3b8]">222 người bạn</p>
                    </div>
                </div>

                <div id="profile-action-btn" class="flex items-center gap-2 mb-2 w-full md:w-auto justify-center"></div>
            </div>

            <div class="px-4 sm:px-8 border-t border-fbHover flex items-center gap-1 sm:gap-2 overflow-x-auto text-xs sm:text-sm font-semibold text-[#b0b3b8]">
                <button class="py-3 px-3 sm:px-4 text-fbBlue border-b-4 border-fbBlue font-bold">Bài viết</button>
                <button class="py-3 px-3 sm:px-4 hover:bg-fbHover rounded-lg">Giới thiệu</button>
                <button class="py-3 px-3 sm:px-4 hover:bg-fbHover rounded-lg">Bạn bè</button>
                <button class="py-3 px-3 sm:px-4 hover:bg-fbHover rounded-lg">Ảnh</button>
            </div>
        </div>

        <!-- Bố cục 2 Cột -->
        <div class="w-full max-w-[1050px] p-2 sm:p-4 grid grid-cols-1 md:grid-cols-5 gap-4 mt-2">
            
            <!-- CỘT TRÁI -->
            <div class="md:col-span-2 space-y-4">
                <div class="bg-fbPanel p-4 rounded-xl border border-fbHover space-y-3 shadow">
                    <h3 class="text-base font-bold text-white">Giới thiệu</h3>
                    <div class="space-y-2 text-xs text-slate-300">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-location-dot text-[#b0b3b8] w-4 text-center"></i>
                            <span>Sống tại <strong class="text-white">Đông Xuân, Hà Nội</strong></span>
                        </div>
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-graduation-cap text-[#b0b3b8] w-4 text-center"></i>
                            <span>Học sinh tại <strong class="text-white">THPT Sóc Sơn</strong></span>
                        </div>
                    </div>
                </div>

                <!-- Box Đổi Mật Khẩu SHA-256 -->
                <div class="bg-fbPanel p-4 rounded-xl border border-fbHover space-y-3 shadow">
                    <h3 class="text-base font-bold text-white">Bảo mật tài khoản</h3>
                    <p class="text-[11px] text-[#b0b3b8]">Đổi mật khẩu mới (Mã hóa SHA-256 an toàn tuyệt đối)</p>
                    <input type="password" id="new-password" placeholder="Nhập mật khẩu mới..." class="w-full bg-fbInput border border-transparent focus:border-fbBlue rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
                    <button id="update-pass-btn" class="w-full bg-fbBlue hover:opacity-90 py-2 rounded-xl text-xs font-bold text-white transition">Cập nhật mật khẩu</button>
                </div>
            </div>

            <!-- CỘT PHẢI (Bài viết cá nhân) -->
            <div class="md:col-span-3 space-y-4">
                <div class="bg-fbPanel p-3 rounded-xl border border-fbHover flex items-center justify-between shadow">
                    <h3 class="text-sm font-bold text-white">Bài viết của bạn</h3>
                </div>
                <div id="profile-posts-container" class="space-y-4"></div>
            </div>

        </div>

    </div>

    <!-- SCRIPT PROFILE & SHA-256 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, collection, query, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB100rlybpLzv5ax2otgGPzDJc1l5pASyo",
            authDomain: "minh-s-website.firebaseapp.com",
            projectId: "minh-s-website",
            storageBucket: "minh-s-website.appspot.com",
            messagingSenderId: "453574408938",
            appId: "1:453574408938:web:f5b017647a17deacfc3593"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const targetUser = urlParams.get('profile') || localStorage.getItem("chat_user");
        const loggedUser = localStorage.getItem("chat_user");

        if(!loggedUser) {
            alert("Vui lòng đăng nhập trước!");
            window.location.href = "newfeed.html";
        }

        document.getElementById("profile-username").innerText = targetUser === 'phamnhatminh' ? 'Phạm Nhật Minh' : targetUser;
        
        const actionBox = document.getElementById("profile-action-btn");
        if(targetUser === loggedUser) {
            actionBox.innerHTML = `
                <button class="bg-fbBlue hover:opacity-90 px-4 py-2 rounded-lg text-xs font-bold text-white flex items-center gap-1.5 cursor-pointer shadow"><i class="fa-solid fa-plus"></i> Thêm vào tin</button>
                <button class="bg-fbHover hover:bg-[#4e4f50] px-4 py-2 rounded-lg text-xs font-bold text-white flex items-center gap-1.5 cursor-pointer"><i class="fa-solid fa-pen"></i> Chỉnh sửa trang cá nhân</button>
            `;
        } else {
            actionBox.innerHTML = `
                <button class="bg-fbBlue hover:opacity-90 px-4 py-2 rounded-lg text-xs font-bold text-white flex items-center gap-1.5 cursor-pointer shadow"><i class="fa-solid fa-message"></i> Nhắn tin</button>
                <button class="bg-fbHover hover:bg-[#4e4f50] px-4 py-2 rounded-lg text-xs font-bold text-white flex items-center gap-1.5 cursor-pointer"><i class="fa-solid fa-user-check"></i> Bạn bè</button>
            `;
        }

        // Tải danh sách bài viết riêng của user này từ Firebase cũ
        const q = query(collection(db, "posts"));
        onSnapshot(q, (snap) => {
            const userPosts = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                .filter(p => p.author === targetUser)
                .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            
            const container = document.getElementById("profile-posts-container");
            if (userPosts.length === 0) {
                container.innerHTML = `<div class="bg-fbPanel p-6 rounded-xl border border-fbHover text-center text-xs text-[#b0b3b8] italic">Chưa có bài viết nào.</div>`;
            } else {
                container.innerHTML = userPosts.map(p => `
                    <div class="bg-fbPanel rounded-xl border border-fbHover p-4 space-y-3 shadow">
                        <h4 class="text-xs font-bold text-white">${escapeHTML(p.author)}</h4>
                        <p class="text-xs text-slate-200 break-words">${escapeHTML(p.title)}</p>
                        ${p.media ? `<div class="rounded-lg overflow-hidden bg-black max-h-[350px] flex items-center justify-center"><img src="${p.media}" class="w-full object-cover"></div>`: ''}
                    </div>
                `).join("");
            }
        });

        // Hàm băm SHA-256 đổi mật khẩu
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hash = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        document.getElementById("update-pass-btn").onclick = async () => {
            const pass = document.getElementById("new-password").value.trim();
            if(!pass) return alert("Vui lòng nhập mật khẩu mới!");
            const hashed = await hashPassword(pass);
            
            await setDoc(doc(db, "users", loggedUser), { password: hashed }, { merge: true });
            alert("Đã cập nhật mật khẩu mới và mã hóa SHA-256 thành công!");
            document.getElementById("new-password").value = "";
        };

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        }
    </script>
</body>
</html>
