<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Cá Nhân - MinhNet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fbBg: '#f0f2f5',
                        fbPanel: '#ffffff',
                        fbHover: '#e4e6eb',
                        fbInput: '#f0f2f5',
                        fbBlue: '#1877f2',
                        fbText: '#050505',
                        fbSubText: '#65676b'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f0f2f5; color: #050505; }
    </style>
</head>
<body class="bg-fbBg text-fbText min-h-screen flex flex-col overflow-x-hidden pb-14">

    <!-- HEADER TOP -->
    <header class="h-14 bg-fbPanel border-b border-gray-200 px-4 flex items-center justify-between sticky top-0 z-40 shrink-0 shadow-sm">
        <div class="flex items-center gap-3">
            <a href="trangchu.html" class="text-fbBlue text-2xl hover:opacity-85 transition" title="Quay lại Bảng tin"><i class="fa-solid fa-arrow-left"></i></a>
            <span class="text-sm font-bold text-fbText">Trang Cá Nhân</span>
        </div>
        <div class="flex items-center gap-2">
            <a href="setting.html" class="text-xs bg-fbHover px-3 py-1.5 rounded-lg hover:bg-gray-300 text-fbText font-bold flex items-center gap-1.5 transition">
                <i class="fa-solid fa-gear text-fbBlue"></i> Cài đặt
            </a>
            <a href="trangchu.html" class="text-fbBlue font-bold text-xs bg-fbHover px-3 py-1.5 rounded-lg hover:bg-gray-300">Về Bảng Tin</a>
        </div>
    </header>

    <!-- TRANG CÁ NHÂN FACEBOOK LIGHT MODE -->
    <div class="w-full flex flex-col items-center bg-fbBg">
        
        <!-- HEADER PROFILE CONTAINER -->
        <div class="w-full max-w-[1090px] bg-fbPanel border-b border-gray-200 rounded-b-xl shadow-sm overflow-hidden">
            
            <!-- Ảnh bìa -->
            <div id="profile-cover-box" class="w-full h-48 sm:h-72 md:h-80 bg-gray-300 relative overflow-hidden flex items-center justify-center">
                <button class="absolute bottom-4 right-4 bg-white hover:bg-gray-100 text-fbText text-xs font-semibold px-3 py-1.5 rounded-md shadow flex items-center gap-2 border border-gray-200">
                    <i class="fa-solid fa-camera"></i> Thêm ảnh bìa
                </button>
            </div>

            <!-- Avatar & Tên & Nút chức năng -->
            <div class="px-4 sm:px-8 pb-4 relative flex flex-col md:flex-row items-center md:items-end justify-between gap-4 border-b border-gray-200">
                <div class="flex flex-col md:flex-row items-center md:items-end gap-5 text-center md:text-left -mt-16 sm:-mt-20 z-20 w-full md:w-auto">
                    
                    <div class="relative shrink-0">
                        <div id="profile-avatar-box" class="w-36 h-36 sm:w-40 sm:h-40 rounded-full border-4 border-white bg-gray-200 flex items-center justify-center text-5xl font-bold text-gray-500 overflow-hidden shadow-md">
                            <i class="fa-solid fa-user"></i>
                        </div>
                    </div>

                    <div class="space-y-1 mb-2">
                        <h2 id="profile-username" class="text-2xl sm:text-3xl font-extrabold text-fbText tracking-tight">---</h2>
                        <p id="profile-friends-count" class="text-xs font-bold text-fbSubText">119 người bạn</p>
                    </div>
                </div>

                <!-- Nút thao tác -->
                <div id="profile-action-btn" class="flex items-center gap-2 mb-2 w-full md:w-auto justify-center shrink-0 z-20"></div>
            </div>

            <!-- Thanh Tabs Nav -->
            <div class="px-4 sm:px-8 flex items-center justify-between text-xs font-bold text-fbSubText">
                <div class="flex items-center gap-1 overflow-x-auto">
                    <button id="tab-timeline" onclick="switchMainTab('timeline')" class="py-3 px-4 text-fbBlue border-b-2 border-fbBlue font-bold">Bài viết</button>
                    <button id="tab-about" onclick="switchMainTab('about')" class="py-3 px-4 hover:bg-fbHover rounded-md transition">Giới thiệu</button>
                    <button id="tab-friends" onclick="switchMainTab('friends')" class="py-3 px-4 hover:bg-fbHover rounded-md transition">Bạn bè</button>
                    <button id="tab-photos" onclick="switchMainTab('photos')" class="py-3 px-4 hover:bg-fbHover rounded-md transition">Ảnh</button>
                    <button id="tab-reels" onclick="switchMainTab('reels')" class="py-3 px-4 hover:bg-fbHover rounded-md transition">Reels</button>
                    <button class="py-3 px-4 hover:bg-fbHover rounded-md transition">Xem thêm <i class="fa-solid fa-caret-down"></i></button>
                </div>
                <button class="p-2 hover:bg-fbHover rounded-md"><i class="fa-solid fa-ellipsis"></i></button>
            </div>
        </div>

        <!-- BỐ CỤC CHÍNH (Thay đổi linh hoạt theo Tab) -->
        <div id="main-view-container" class="w-full max-w-[1090px] p-2 sm:p-4 mt-2"></div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB100rlybpLzv5ax2otgGPzDJc1l5pASyo",
            authDomain: "minh-s-website.firebaseapp.com",
            projectId: "minh-s-website",
            storageBucket: "minh-s-website.appspot.com",
            messagingSenderId: "453574408938",
            appId: "1:453574408938:web:f5b017647a17deacfc3593"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const loggedUser = localStorage.getItem("chat_user");
        const targetUser = urlParams.get('profile') || loggedUser;
        let currentSk = urlParams.get('sk') || '';

        let userAvatarBase64 = localStorage.getItem("user_avatar") || "";
        let userCoverBase64 = localStorage.getItem("user_cover") || "";
        let coverPercent = localStorage.getItem("user_cover_percent") || "50";

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        document.getElementById("profile-username").innerText = targetUser === 'phamnhatminh' ? 'Phạm Nhật Minh' : targetUser;

        // Render Avatar
        if (userAvatarBase64) {
            if (userAvatarBase64.startsWith("data:video")) {
                document.getElementById("profile-avatar-box").innerHTML = `<video src="${userAvatarBase64}" class="w-full h-full object-cover" autoplay loop muted></video>`;
            } else {
                document.getElementById("profile-avatar-box").innerHTML = `<img src="${userAvatarBase64}" class="w-full h-full object-cover">`;
            }
        }

        // Render Cover Photo
        if (userCoverBase64) {
            document.getElementById("profile-cover-box").innerHTML = `
                <img src="${userCoverBase64}" class="w-full h-full object-cover" style="object-position: center ${coverPercent}%;">
            `;
        }

        // Action Buttons
        if (targetUser === loggedUser) {
            document.getElementById("profile-action-btn").innerHTML = `
                <button class="bg-fbBlue hover:bg-blue-600 px-4 py-2 rounded-lg text-xs font-bold text-white flex items-center gap-1.5 shadow-sm"><i class="fa-solid fa-plus"></i> Thêm vào tin</button>
                <button class="bg-fbHover hover:bg-gray-300 px-4 py-2 rounded-lg text-xs font-bold text-fbText flex items-center gap-1.5 shadow-sm"><i class="fa-solid fa-pen"></i> Chỉnh sửa trang cá nhân</button>
            `;
        } else {
            document.getElementById("profile-action-btn").innerHTML = `
                <button class="bg-fbBlue hover:bg-blue-600 px-4 py-2 rounded-lg text-xs font-bold text-white flex items-center gap-1.5 shadow-sm"><i class="fa-solid fa-message"></i> Nhắn tin</button>
            `;
        }

        // CÁC MỤC TRONG MENU GIỚI THIỆU
        const aboutSections = [
            { id: 'about', label: 'Giới thiệu' },
            { id: 'directory_personal_details', label: 'Thông tin cá nhân' },
            { id: 'directory_work', label: 'Công việc' },
            { id: 'directory_education', label: 'Trình độ học vấn' },
            { id: 'directory_activites', label: 'Sở thích' },
            { id: 'directory_interests', label: 'Mối quan tâm' },
            { id: 'directory_travel', label: 'Du lịch' },
            { id: 'directory_links', label: 'Liên kết' },
            { id: 'directory_contact', label: 'Thông tin liên hệ' },
            { id: 'directory_name', label: 'Tên' },
            { id: 'directory_details', label: 'Chi tiết về bạn' }
        ];

        // QUẢN LÝ CHUYỂN TAB VÀ ĐỔI URL (PUSHSTATE)
        window.switchMainTab = function(tabName, subSk = '') {
            const newParams = new URLSearchParams(window.location.search);
            if (tabName === 'about') {
                newParams.set('sk', subSk || 'about');
            } else if (tabName === 'friends') {
                newParams.set('sk', 'friends');
            } else if (tabName === 'photos') {
                newParams.set('sk', 'photos');
            } else {
                newParams.delete('sk');
            }
            
            const newUrl = `${window.location.pathname}?${newParams.toString()}`;
            window.history.pushState({ path: newUrl }, '', newUrl);
            renderPageContent();
        };

        window.onpopstate = function() {
            renderPageContent();
        };

        function updateTabStyles(activeTab) {
            ['timeline', 'about', 'friends', 'photos', 'reels'].forEach(tab => {
                const btn = document.getElementById(`tab-${tab}`);
                if (btn) {
                    if (tab === activeTab) {
                        btn.className = "py-3 px-4 text-fbBlue border-b-2 border-fbBlue font-bold";
                    } else {
                        btn.className = "py-3 px-4 hover:bg-fbHover rounded-md transition font-bold";
                    }
                }
            });
        }

        function renderPageContent() {
            const params = new URLSearchParams(window.location.search);
            const sk = params.get('sk') || '';
            const container = document.getElementById("main-view-container");

            if (sk.startsWith('directory_') || sk === 'about') {
                updateTabStyles('about');
                renderAboutView(container, sk);
            } else if (sk === 'friends') {
                updateTabStyles('friends');
                container.innerHTML = `<div class="bg-fbPanel p-6 rounded-xl border border-gray-200 text-center font-bold text-sm">Danh sách Bạn bè</div>`;
            } else if (sk === 'photos') {
                updateTabStyles('photos');
                container.innerHTML = `<div class="bg-fbPanel p-6 rounded-xl border border-gray-200 text-center font-bold text-sm">Thư viện Ảnh</div>`;
            } else {
                updateTabStyles('timeline');
                renderTimelineView(container);
            }
        }

        // INTERFACE BÀI VIẾT (TIMELINE)
        function renderTimelineView(container) {
            container.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                    <div class="md:col-span-2 space-y-4">
                        <div class="bg-fbPanel p-4 rounded-xl border border-gray-200 space-y-3 shadow-sm">
                            <h3 class="text-base font-bold text-fbText">Giới thiệu</h3>
                            <div class="space-y-3 text-xs text-fbSubText">
                                <div class="flex items-center gap-3">
                                    <i class="fa-solid fa-house text-gray-500 text-sm w-4 text-center"></i>
                                    <span>Sống tại <strong class="text-fbText">Đông Xuân, Hà Nội</strong></span>
                                </div>
                                <div class="flex items-center gap-3">
                                    <i class="fa-solid fa-graduation-cap text-gray-500 text-sm w-4 text-center"></i>
                                    <span>Học sinh tại <strong class="text-fbText">THPT Sóc Sơn</strong></span>
                                </div>
                            </div>
                            <button onclick="switchMainTab('about')" class="w-full bg-fbHover hover:bg-gray-300 py-2 rounded-lg text-xs font-bold text-fbText">Chỉnh sửa tiểu sử</button>
                        </div>

                        <div class="bg-fbPanel p-4 rounded-xl border border-gray-200 space-y-3 shadow-sm">
                            <div class="flex items-center justify-between">
                                <div>
                                    <h3 class="text-base font-bold text-fbText">Bạn bè</h3>
                                    <p class="text-xs text-fbSubText">119 người bạn</p>
                                </div>
                                <button onclick="switchMainTab('friends')" class="text-xs text-fbBlue font-semibold hover:bg-blue-50 p-1.5 rounded-md">Xem tất cả bạn bè</button>
                            </div>
                        </div>
                    </div>

                    <div class="md:col-span-3 space-y-4">
                        <div class="bg-fbPanel p-3.5 rounded-xl border border-gray-200 shadow-sm space-y-3">
                            <div class="flex items-center gap-2">
                                <div class="w-10 h-10 rounded-full bg-gray-200 overflow-hidden shrink-0 flex items-center justify-center">
                                    <i class="fa-solid fa-user text-gray-400 text-xl"></i>
                                </div>
                                <input type="text" placeholder="Bạn đang nghĩ gì?" class="w-full bg-fbInput hover:bg-gray-200 px-4 py-2.5 rounded-full text-xs outline-none cursor-pointer">
                            </div>
                        </div>
                        <div id="profile-posts-container" class="space-y-4"></div>
                    </div>
                </div>
            `;
            loadFirestorePosts();
        }

        // INTERFACE GIỚI THIỆU (ABOUT) WITH SIDEBAR
        function renderAboutView(container, activeSk) {
            const currentSub = activeSk || 'about';

            let rightContentHTML = '';
            if (currentSub === 'about') {
                rightContentHTML = `
                    <div class="space-y-4">
                        <div>
                            <h4 class="text-sm font-bold text-fbText mb-2">Tiểu sử</h4>
                            <div class="flex items-center gap-3 text-xs text-fbSubText">
                                <i class="fa-solid fa-hand-wave text-lg"></i>
                                <span>Giới thiệu về bạn</span>
                            </div>
                        </div>
                        <hr class="border-gray-200">
                        <div>
                            <h4 class="text-sm font-bold text-fbText mb-2">Chi tiết đã ghim</h4>
                            <div class="flex items-center gap-3 text-xs text-fbSubText">
                                <i class="fa-solid fa-thumbtack text-lg"></i>
                                <span>Chi tiết đã ghim</span>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentSub === 'directory_personal_details') {
                rightContentHTML = `
                    <div class="space-y-4 text-xs">
                        <div>
                            <p class="font-bold text-fbSubText mb-1">Vị trí</p>
                            <div class="flex items-center gap-2.5 text-fbText font-semibold"><i class="fa-solid fa-location-dot text-base text-gray-500"></i> Tỉnh/thành phố hoặc thị trấn hiện tại</div>
                        </div>
                        <div>
                            <p class="font-bold text-fbSubText mb-1">Quê quán</p>
                            <div class="flex items-center gap-2.5 text-fbText font-semibold"><i class="fa-solid fa-house text-base text-gray-500"></i> Quê quán</div>
                        </div>
                        <hr class="border-gray-200">
                        <div>
                            <p class="font-bold text-fbSubText mb-1">Sinh nhật</p>
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-2.5">
                                    <i class="fa-solid fa-cake-candles text-base text-gray-500"></i>
                                    <div>
                                        <p class="font-bold text-fbText">24 tháng 12</p>
                                        <p class="text-[11px] text-fbSubText">1995</p>
                                    </div>
                                </div>
                                <i class="fa-solid fa-lock text-gray-400"></i>
                            </div>
                        </div>
                        <hr class="border-gray-200">
                        <div>
                            <p class="font-bold text-fbSubText mb-1">Giới tính</p>
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-2.5"><i class="fa-solid fa-user text-base text-gray-500"></i> <span class="font-bold text-fbText">Nam</span></div>
                                <i class="fa-solid fa-lock text-gray-400"></i>
                            </div>
                        </div>
                        <div>
                            <p class="font-bold text-fbSubText mb-1">Danh xưng</p>
                            <div class="flex items-center gap-2.5"><i class="fa-solid fa-comment-dots text-base text-gray-500"></i> <span class="font-bold text-fbText">anh ấy</span></div>
                        </div>
                    </div>
                `;
            } else if (currentSub === 'directory_work') {
                rightContentHTML = `
                    <div class="space-y-3">
                        <h4 class="text-sm font-bold text-fbText mb-2">Công việc</h4>
                        <div class="flex items-center gap-3 text-xs text-fbSubText">
                            <i class="fa-solid fa-briefcase text-lg text-gray-500"></i>
                            <span>Kinh nghiệm làm việc</span>
                        </div>
                    </div>
                `;
            } else if (currentSub === 'directory_education') {
                rightContentHTML = `
                    <div class="space-y-4 text-xs">
                        <div>
                            <h4 class="text-sm font-bold text-fbText mb-2">Đại học</h4>
                            <div class="flex items-center gap-3 text-fbSubText"><i class="fa-solid fa-graduation-cap text-lg text-gray-500"></i> Trường cao đẳng/đại học</div>
                        </div>
                        <hr class="border-gray-200">
                        <div>
                            <h4 class="text-sm font-bold text-fbText mb-2">Trường trung học</h4>
                            <div class="flex items-center gap-3 text-fbSubText"><i class="fa-solid fa-school text-lg text-gray-500"></i> Trường trung học phổ thông</div>
                        </div>
                    </div>
                `;
            } else if (currentSub === 'directory_activites') {
                rightContentHTML = `
                    <div class="space-y-3">
                        <h4 class="text-sm font-bold text-fbText mb-2">Sở thích</h4>
                        <div class="flex items-center gap-3 text-xs text-fbSubText">
                            <i class="fa-solid fa-[#1877f2] fa-icons text-lg text-gray-500"></i>
                            <span>Sở thích</span>
                        </div>
                    </div>
                `;
            } else if (currentSub === 'directory_interests') {
                rightContentHTML = `
                    <div class="space-y-4 text-xs">
                        <div>
                            <h4 class="text-sm font-bold text-fbText mb-1">Âm nhạc</h4>
                            <div class="flex items-center gap-3 text-fbSubText"><i class="fa-solid fa-music text-base text-gray-500"></i> Nhạc</div>
                        </div>
                        <div>
                            <h4 class="text-sm font-bold text-fbText mb-1">Chương trình TV</h4>
                            <div class="flex items-center gap-3 text-fbSubText"><i class="fa-solid fa-tv text-base text-gray-500"></i> Chương trình TV</div>
                        </div>
                        <div>
                            <h4 class="text-sm font-bold text-fbText mb-1">Phim</h4>
                            <div class="flex items-center gap-3 text-fbSubText"><i class="fa-solid fa-film text-base text-gray-500"></i> Phim</div>
                        </div>
                        <div>
                            <h4 class="text-sm font-bold text-fbText mb-1">Game</h4>
                            <div class="flex items-center gap-3 text-fbSubText"><i class="fa-solid fa-gamepad text-base text-gray-500"></i> Game</div>
                        </div>
                    </div>
                `;
            } else {
                rightContentHTML = `
                    <div class="text-xs text-fbSubText italic">
                        Đang hiển thị nội dung cho mục: <strong class="text-fbText">${currentSub}</strong>
                    </div>
                `;
            }

            const sidebarHTML = aboutSections.map(sec => `
                <button onclick="switchMainTab('about', '${sec.id}')" class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold ${sec.id === currentSub ? 'bg-blue-50 text-fbBlue font-bold' : 'hover:bg-fbHover text-fbText'} transition">
                    ${sec.label}
                </button>
            `).join('');

            container.innerHTML = `
                <div class="bg-fbPanel rounded-xl border border-gray-200 shadow-sm p-4 grid grid-cols-1 md:grid-cols-3 gap-4 min-h-[420px]">
                    <div class="md:col-span-1 border-r border-gray-200 pr-2 space-y-1">
                        <h3 class="text-lg font-extrabold text-fbText px-3 mb-2">Giới thiệu</h3>
                        ${sidebarHTML}
                    </div>
                    <div class="md:col-span-2 pl-2 pt-1">
                        ${rightContentHTML}
                    </div>
                </div>
            `;
        }

        function loadFirestorePosts() {
            const q = query(collection(db, "posts"));
            onSnapshot(q, (snap) => {
                const userPosts = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                    .filter(p => p.author === targetUser)
                    .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                
                const container = document.getElementById("profile-posts-container");
                if (!container) return;
                if (userPosts.length === 0) {
                    container.innerHTML = `<div class="bg-fbPanel p-6 rounded-xl border border-gray-200 text-center text-xs text-fbSubText italic">Chưa có bài viết nào.</div>`;
                } else {
                    container.innerHTML = userPosts.map(p => `
                        <div class="bg-fbPanel rounded-xl border border-gray-200 p-4 space-y-3 shadow-sm">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-2.5">
                                    <div class="w-9 h-9 rounded-full bg-gray-200 overflow-hidden flex items-center justify-center font-bold text-xs">
                                        ${p.author ? p.author.charAt(0).toUpperCase() : 'U'}
                                    </div>
                                    <div>
                                        <h4 class="text-xs font-bold text-fbText">${escapeHTML(p.author === 'phamnhatminh' ? 'Phạm Nhật Minh' : p.author)}</h4>
                                        <p class="text-[10px] text-fbSubText">Vừa xong <i class="fa-solid fa-earth-americas"></i></p>
                                    </div>
                                </div>
                            </div>
                            ${p.title ? `<p class="text-xs text-fbText break-words leading-relaxed">${escapeHTML(p.title)}</p>` : ''}
                            ${p.media ? `<div class="rounded-lg overflow-hidden bg-black max-h-[400px] flex items-center justify-center -mx-4"><img src="${p.media}" class="w-full object-cover"></div>` : ''}
                        </div>
                    `).join("");
                }
            });
        }

        // Khởi chạy khi load trang
        renderPageContent();
    </script>
</body>
</html>
