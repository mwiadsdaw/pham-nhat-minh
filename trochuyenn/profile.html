<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Cá Nhân - MinhNet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fbBg: '#f0f2f5',
                        fbPanel: '#ffffff',
                        fbHover: '#e4e6eb',
                        fbInput: '#f0f2f5',
                        fbBlue: '#1877f2',
                        fbText: '#050505',
                        fbSubText: '#65676b'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f0f2f5; color: #050505; }
    </style>
</head>
<body class="bg-fbBg text-fbText min-h-screen flex flex-col overflow-x-hidden pb-14">

    <!-- HEADER TOP -->
    <header class="h-14 bg-fbPanel border-b border-gray-200 px-4 flex items-center justify-between sticky top-0 z-40 shrink-0 shadow-sm">
        <div class="flex items-center gap-3">
            <a href="trangchu.html" class="text-fbBlue text-2xl hover:opacity-85 transition" title="Quay lại Bảng tin"><i class="fa-solid fa-arrow-left"></i></a>
            <span class="text-sm font-bold text-fbText">Trang Cá Nhân</span>
        </div>
    </header>

    <!-- TRANG CÁ NHÂN FACEBOOK LIGHT MODE -->
    <div class="w-full flex flex-col items-center bg-fbBg">
        
        <!-- HEADER PROFILE CONTAINER -->
        <div class="w-full max-w-[1090px] bg-fbPanel border-b border-gray-200 rounded-b-xl shadow-sm overflow-hidden">
            
            <!-- Ảnh bìa -->
            <div id="profile-cover-box" class="w-full h-48 sm:h-72 md:h-80 bg-gray-300 relative overflow-hidden flex items-center justify-center">
                <button onclick="document.getElementById('cover-input-file').click()" class="absolute bottom-4 right-4 bg-white hover:bg-gray-100 text-fbText text-xs font-semibold px-3 py-1.5 rounded-md shadow flex items-center gap-2 border border-gray-200 z-10 cursor-pointer">
                    <i class="fa-solid fa-camera"></i> Thêm ảnh bìa
                </button>
                <input type="file" id="cover-input-file" class="hidden" accept="image/*" onchange="handleCoverUpload(event)">
            </div>

            <!-- Avatar & Tên & Nút chức năng -->
            <div class="px-4 sm:px-8 pb-4 relative flex flex-col md:flex-row items-center md:items-end justify-between gap-4 border-b border-gray-200">
                <div class="flex flex-col md:flex-row items-center md:items-end gap-5 text-center md:text-left -mt-16 sm:-mt-20 z-20 w-full md:w-auto">
                    
                    <div class="relative shrink-0 group">
                        <div id="profile-avatar-box" onclick="toggleAvatarMenu(event)" class="w-36 h-36 sm:w-40 sm:h-40 rounded-full border-4 border-white bg-gray-200 flex items-center justify-center text-5xl font-bold text-gray-500 overflow-hidden shadow-md cursor-pointer relative">
                            <i class="fa-solid fa-user"></i>
                        </div>

                        <div id="avatar-popup-menu" class="hidden absolute left-0 sm:left-auto sm:right-0 mt-2 w-48 bg-white rounded-xl shadow-xl border border-gray-200 py-1.5 z-50 text-xs font-semibold">
                            <button onclick="document.getElementById('avatar-input-file').click()" class="w-full text-left px-4 py-2.5 hover:bg-fbHover flex items-center gap-2 text-fbText">
                                <i class="fa-solid fa-camera text-fbBlue"></i> Cập nhật ảnh đại diện
                            </button>
                        </div>
                        <input type="file" id="avatar-input-file" class="hidden" accept="image/*" onchange="handleAvatarUpload(event)">
                    </div>

                    <div class="space-y-1 mb-2">
                        <h2 id="profile-username" class="text-2xl sm:text-3xl font-extrabold text-fbText tracking-tight">---</h2>
                        <p id="profile-friends-count" class="text-xs font-bold text-fbSubText">119 người bạn</p>
                    </div>
                </div>

                <!-- Nút thao tác -->
                <div id="profile-action-btn" class="flex items-center gap-2 mb-2 w-full md:w-auto justify-center shrink-0 z-20"></div>
            </div>

            <!-- Thanh Tabs Nav -->
            <div class="px-4 sm:px-8 flex items-center justify-between text-xs font-bold text-fbSubText">
                <div class="flex items-center gap-1 overflow-x-auto">
                    <button id="tab-timeline" onclick="switchMainTab('timeline')" class="py-3 px-4 text-fbBlue border-b-2 border-fbBlue font-bold">Tất cả</button>
                    <button id="tab-about" onclick="switchMainTab('about')" class="py-3 px-4 hover:bg-fbHover rounded-md transition">Giới thiệu</button>
                    <button id="tab-friends" onclick="switchMainTab('friends')" class="py-3 px-4 hover:bg-fbHover rounded-md transition">Bạn bè</button>
                    <button id="tab-photos" onclick="switchMainTab('photos')" class="py-3 px-4 hover:bg-fbHover rounded-md transition">Ảnh</button>
                    <button id="tab-reels" onclick="switchMainTab('reels')" class="py-3 px-4 hover:bg-fbHover rounded-md transition">Reels</button>
                    <button class="py-3 px-4 hover:bg-fbHover rounded-md transition">Xem thêm <i class="fa-solid fa-caret-down"></i></button>
                </div>
                <button class="p-2 hover:bg-fbHover rounded-md"><i class="fa-solid fa-ellipsis"></i></button>
            </div>
        </div>

        <!-- BỐ CỤC CHÍNH -->
        <div id="main-view-container" class="w-full max-w-[1090px] p-2 sm:p-4 mt-2"></div>

    </div>

    <!-- MODAL CHỈNH SỬA TRANG CÁ NHÂN -->
    <div id="edit-profile-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="px-5 py-3 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-base font-bold text-fbText">Chỉnh sửa trang cá nhân</h3>
                <button onclick="closeEditModal()" class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600 flex items-center justify-center font-bold text-base">✕</button>
            </div>
            
            <div class="p-5 overflow-y-auto space-y-4 text-xs font-semibold">
                <div>
                    <label class="block text-fbSubText mb-1">Tiểu sử</label>
                    <textarea id="edit-bio" rows="2" class="w-full bg-fbInput border border-gray-300 rounded-lg p-2.5 outline-none focus:border-fbBlue" placeholder="Nhập tiểu sử của bạn..."></textarea>
                </div>

                <div>
                    <label class="block text-fbSubText mb-1">Sống tại</label>
                    <input type="text" id="edit-location" class="w-full bg-fbInput border border-gray-300 rounded-lg p-2.5 outline-none focus:border-fbBlue" placeholder="VD: Đông Xuân, Hà Nội">
                </div>

                <div>
                    <label class="block text-fbSubText mb-1">Quê quán</label>
                    <input type="text" id="edit-hometown" class="w-full bg-fbInput border border-gray-300 rounded-lg p-2.5 outline-none focus:border-fbBlue" placeholder="VD: Sóc Sơn, Hà Nội">
                </div>

                <div>
                    <label class="block text-fbSubText mb-1">Trường học</label>
                    <input type="text" id="edit-school" class="w-full bg-fbInput border border-gray-300 rounded-lg p-2.5 outline-none focus:border-fbBlue" placeholder="VD: THPT Sóc Sơn">
                </div>

                <div>
                    <label class="block text-fbSubText mb-1">Công việc</label>
                    <input type="text" id="edit-work" class="w-full bg-fbInput border border-gray-300 rounded-lg p-2.5 outline-none focus:border-fbBlue" placeholder="VD: Học sinh / Lập trình viên">
                </div>

                <div>
                    <label class="block text-fbSubText mb-1">Ngày sinh</label>
                    <input type="text" id="edit-birthday" class="w-full bg-fbInput border border-gray-300 rounded-lg p-2.5 outline-none focus:border-fbBlue" placeholder="VD: 08/03/2011">
                </div>

                <div>
                    <label class="block text-fbSubText mb-1">Giới tính</label>
                    <select id="edit-gender" class="w-full bg-fbInput border border-gray-300 rounded-lg p-2.5 outline-none focus:border-fbBlue">
                        <option value="Nam">Nam</option>
                        <option value="Nữ">Nữ</option>
                        <option value="Khác">Khác
