<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Cá Nhân - MinhNet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fbBg: '#18191a',
                        fbPanel: '#242526',
                        fbHover: '#3a3b3c',
                        fbInput: '#3a3b3c',
                        fbBlue: '#2d88ff',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #18191a; color: #e4e6eb; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3a3b3c; border-radius: 3px; }
    </style>
</head>
<body class="bg-fbBg text-[#e4e6eb] min-h-screen flex flex-col overflow-x-hidden pb-14">

    <!-- HEADER TOP -->
    <header class="h-14 bg-fbPanel border-b border-fbHover px-4 flex items-center justify-between sticky top-0 z-40 shrink-0">
        <div class="flex items-center gap-3">
            <a href="trangchu.html" class="text-fbBlue text-2xl hover:opacity-85 transition" title="Quay lại Bảng tin"><i class="fa-solid fa-arrow-left"></i></a>
            <span class="text-sm font-bold text-white">Trang Cá Nhân</span>
        </div>
    </header>

    <!-- CONTAINER TRANG CÁ NHÂN -->
    <div class="w-full flex flex-col items-center bg-fbBg">
        <div class="w-full max-w-[1090px] bg-fbPanel border-b border-fbHover rounded-b-xl overflow-hidden shadow-lg">
            
            <!-- Ảnh Bìa -->
            <div id="profile-cover-box" class="w-full h-48 sm:h-72 md:h-80 bg-fbHover relative overflow-hidden flex items-center justify-center">
                <button id="btn-cover-edit" onclick="document.getElementById('cover-input-file').click()" class="hidden absolute bottom-4 right-4 bg-fbPanel hover:bg-fbHover text-white text-xs font-semibold px-3 py-1.5 rounded-md flex items-center gap-2 border border-fbHover z-10 cursor-pointer">
                    <i class="fa-solid fa-camera"></i> Thêm ảnh bìa
                </button>
                <input type="file" id="cover-input-file" class="hidden" accept="image/*" onchange="handleCoverUpload(event)">
            </div>

            <!-- Avatar & Thông tin -->
            <div class="px-4 sm:px-8 pb-4 relative flex flex-col md:flex-row items-center md:items-end justify-between gap-4 border-b border-fbHover">
                <div class="flex flex-col md:flex-row items-center md:items-end gap-5 text-center md:text-left -mt-16 sm:-mt-20 z-20 w-full md:w-auto">
                    <div class="relative shrink-0 group">
                        <div id="profile-avatar-box" class="w-36 h-36 sm:w-40 sm:h-40 rounded-full border-4 border-fbPanel bg-fbHover flex items-center justify-center text-5xl font-bold text-gray-400 overflow-hidden shadow-md cursor-pointer">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <input type="file" id="avatar-input-file" class="hidden" accept="image/*" onchange="handleAvatarUpload(event)">
                    </div>

                    <div class="space-y-1 mb-2">
                        <h2 id="profile-username" class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">---</h2>
                        <p id="profile-friends-count" class="text-xs font-bold text-[#b0b3b8]">0 người bạn</p>
                    </div>
                </div>

                <!-- Nút Hành Động Kết Bạn / Sửa Trang Cá Nhân -->
                <div id="profile-action-btn" class="flex items-center gap-2 mb-2 w-full md:w-auto justify-center shrink-0 z-20"></div>
            </div>

            <!-- Thanh Tabs Nav -->
            <div class="px-4 sm:px-8 flex items-center justify-between text-xs font-bold text-[#b0b3b8]">
                <div class="flex items-center gap-1 overflow-x-auto">
                    <button class="py-3 px-4 text-fbBlue border-b-2 border-fbBlue font-bold">Bài viết</button>
                    <a href="friends.html" class="py-3 px-4 hover:bg-fbHover rounded-md transition text-[#b0b3b8]">Bạn bè</a>
                </div>
            </div>
        </div>

        <!-- BỐ CỤC CHÍNH -->
        <div class="w-full max-w-[1090px] p-2 sm:p-4 mt-2 grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="md:col-span-1 space-y-4">
                <div class="bg-fbPanel p-4 rounded-xl border border-fbHover space-y-3 shadow-sm">
                    <h3 class="text-base font-bold text-white">Giới thiệu</h3>
                    <p id="profile-bio" class="text-xs text-[#b0b3b8] italic">Chưa có tiểu sử</p>
                </div>
            </div>
            <div class="md:col-span-2 space-y-4">
                <div id="profile-posts-container" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, arrayUnion, arrayRemove, collection, query, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB100rlybpLzv5ax2otgGPzDJc1l5pASyo",
            authDomain: "minh-s-website.firebaseapp.com",
            projectId: "minh-s-website",
            storageBucket: "minh-s-website.appspot.com",
            messagingSenderId: "453574408938",
            appId: "1:453574408938:web:f5b017647a17deacfc3593"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const loggedUser = localStorage.getItem("chat_user");
        const targetUser = urlParams.get('profile') || loggedUser;

        if(!loggedUser) {
            window.location.href = "trangchu.html";
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        document.getElementById("profile-username").innerText = targetUser;

        async function loadProfile() {
            const userSnap = await getDoc(doc(db, "users", targetUser));
            const meSnap = await getDoc(doc(db, "users", loggedUser));

            if(userSnap.exists()) {
                const data = userSnap.data();
                if(data.avatar) {
                    document.getElementById("profile-avatar-box").innerHTML = `<img src="${data.avatar}" class="w-full h-full object-cover">`;
                }
                if(data.cover) {
                    document.getElementById("profile-cover-box").innerHTML = `<img src="${data.cover}" class="w-full h-full object-cover">`;
                }
                if(data.bio) {
                    document.getElementById("profile-bio").innerText = data.bio;
                }
                const friends = data.friends || [];
                document.getElementById("profile-friends-count").innerText = `${friends.length} người bạn`;
            }

            renderActionButtons(userSnap.data() || {}, meSnap.data() || {});
            loadPosts();
        }

        function renderActionButtons(targetData = {}, meData = {}) {
            const actionBox = document.getElementById("profile-action-btn");
            if (targetUser === loggedUser) {
                actionBox.innerHTML = `
                    <button onclick="document.getElementById('avatar-input-file').click()" class="bg-fbHover hover:bg-[#4e4f50] px-4 py-2 rounded-xl text-xs font-bold text-white flex items-center gap-1.5"><i class="fa-solid fa-camera"></i> Đổi ảnh đại diện</button>
                    <button onclick="document.getElementById('cover-input-file').click()" class="bg-fbHover hover:bg-[#4e4f50] px-4 py-2 rounded-xl text-xs font-bold text-white flex items-center gap-1.5"><i class="fa-solid fa-image"></i> Đổi ảnh bìa</button>
                `;
                document.getElementById("btn-cover-edit").classList.remove("hidden");
                return;
            }

            const myFriends = meData.friends || [];
            const targetRequests = targetData.friendRequests || [];
            const myRequests = meData.friendRequests || [];

            if (myFriends.includes(targetUser)) {
                actionBox.innerHTML = `<button class="bg-green-600 px-4 py-2 rounded-xl text-xs font-bold text-white"><i class="fa-solid fa-user-check"></i> Bạn bè</button>`;
            } else if (targetRequests.includes(loggedUser)) {
                actionBox.innerHTML = `<button class="bg-fbHover px-4 py-2 rounded-xl text-xs font-bold text-white">Đã gửi lời mời</button>`;
            } else if (myRequests.includes(targetUser)) {
                actionBox.innerHTML = `<button onclick="acceptFriend()" class="bg-fbBlue px-4 py-2 rounded-xl text-xs font-bold text-white">Chấp nhận lời mời</button>`;
            } else {
                actionBox.innerHTML = `<button onclick="sendRequest()" class="bg-fbBlue px-4 py-2 rounded-xl text-xs font-bold text-white"><i class="fa-solid fa-user-plus"></i> Thêm bạn bè</button>`;
            }
        }

        window.handleAvatarUpload = async function(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = async function(uploadEvent) {
                const base64 = uploadEvent.target.result;
                await setDoc(doc(db, "users", loggedUser), { avatar: base64 }, { merge: true });
                localStorage.setItem("user_avatar", base64);
                loadProfile();
            };
            reader.readAsDataURL(file);
        };

        window.handleCoverUpload = async function(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = async function(uploadEvent) {
                const base64 = uploadEvent.target.result;
                await setDoc(doc(db, "users", loggedUser), { cover: base64 }, { merge: true });
                loadProfile();
            };
            reader.readAsDataURL(file);
        };

        window.sendRequest = async function() {
            await updateDoc(doc(db, "users", targetUser), { friendRequests: arrayUnion(loggedUser) });
            await addDoc(collection(db, `users/${targetUser}/notifications`), {
                text: `${loggedUser} đã gửi cho bạn một lời mời kết bạn.`,
                type: 'friend_request',
                createdAt: new Date()
            });
            alert("Đã gửi lời mời kết bạn!");
            loadProfile();
        };

        window.acceptFriend = async function() {
            await updateDoc(doc(db, "users", loggedUser), {
                friends: arrayUnion(targetUser),
                friendRequests: arrayRemove(targetUser)
            });
            await updateDoc(doc(db, "users", targetUser), { friends: arrayUnion(loggedUser) });
            await addDoc(collection(db, `users/${targetUser}/notifications`), {
                text: `${loggedUser} đã trở thành bạn bè với bạn.`,
                type: 'friend_accept',
                createdAt: new Date()
            });
            alert("Đã trở thành bạn bè!");
            loadProfile();
        };

        function loadPosts() {
            const q = query(collection(db, "posts"));
            onSnapshot(q, (snap) => {
                const userPosts = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                    .filter(p => p.author === targetUser)
                    .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                
                const container = document.getElementById("profile-posts-container");
                if (userPosts.length === 0) {
                    container.innerHTML = `<div class="bg-fbPanel p-6 rounded-xl border border-fbHover text-center text-xs text-[#b0b3b8] italic">Chưa có bài viết nào.</div>`;
                } else {
                    container.innerHTML = userPosts.map(p => `
                        <div class="bg-fbPanel rounded-xl border border-fbHover p-4 space-y-3 shadow">
                            <h4 class="text-xs font-bold text-white">${escapeHTML(p.author)}</h4>
                            ${p.title ? `<p class="text-xs text-slate-200 break-words">${escapeHTML(p.title)}</p>` : ''}
                            ${p.media ? `<div class="rounded-lg overflow-hidden bg-black max-h-[400px] flex items-center justify-center"><img src="${p.media}" class="w-full object-cover"></div>` : ''}
                        </div>
                    `).join("");
                }
            });
        }

        loadProfile();
    </script>
</body>
</html>
