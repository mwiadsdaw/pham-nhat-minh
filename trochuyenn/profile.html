<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Cá Nhân - MinhNet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fbBg: '#18191a',
                        fbPanel: '#242526',
                        fbHover: '#3a3b3c',
                        fbInput: '#3a3b3c',
                        fbBlue: '#2d88ff',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #18191a; color: #e4e6eb; }
    </style>
</head>
<body class="bg-fbBg text-[#e4e6eb] min-h-screen flex flex-col overflow-x-hidden pb-14">

    <!-- HEADER TOP -->
    <header class="h-14 bg-fbPanel border-b border-fbHover px-3 sm:px-4 flex items-center justify-between sticky top-0 z-40 shrink-0">
        <div class="flex items-center gap-3">
            <a href="trangchu.html" class="text-fbBlue text-2xl sm:text-3xl cursor-pointer hover:opacity-85 transition" title="Quay lại Bảng tin"><i class="fa-solid fa-arrow-left"></i></a>
            <span class="text-sm font-bold text-white">Trang Cá Nhân</span>
        </div>
        <div class="flex items-center gap-2">
            <a href="setting.html" class="text-xs bg-fbInput px-3 py-1.5 rounded-xl hover:bg-fbHover text-white font-bold flex items-center gap-1.5 transition">
                <i class="fa-solid fa-gear text-fbBlue"></i> Cài đặt
            </a>
            <a href="trangchu.html" class="text-fbBlue font-bold text-xs bg-fbInput px-3 py-1.5 rounded-xl hover:bg-fbHover">Về Bảng Tin</a>
        </div>
    </header>

    <!-- TRANG CÁ NHÂN FACEBOOK 1:1 -->
    <div class="w-full flex flex-col items-center bg-fbBg pb-20">
        
        <div class="w-full max-w-[1050px] bg-fbPanel border-b border-fbHover rounded-b-2xl overflow-hidden shadow-2xl relative">
            
            <!-- Ảnh bìa áp dụng object-position theo % đã kéo -->
            <div id="profile-cover-box" class="w-full h-52 sm:h-72 md:h-80 bg-gradient-to-r from-slate-900 via-gray-800 to-zinc-900 relative overflow-hidden flex items-center justify-center"></div>

            <!-- Khung Thông tin User -->
            <div class="px-4 sm:px-8 pb-5 pt-2 relative flex flex-col md:flex-row items-center md:items-end justify-between gap-4">
                <div class="flex flex-col md:flex-row items-center md:items-end gap-5 text-center md:text-left -mt-20 sm:-mt-24 z-20 w-full md:w-auto">
                    
                    <div class="relative shrink-0">
                        <div id="profile-avatar-box" class="w-32 h-32 sm:w-40 sm:h-40 rounded-full border-4 border-fbPanel bg-fbHover flex items-center justify-center text-5xl font-bold text-white overflow-hidden shadow-2xl relative">
                            <i class="fa-solid fa-user"></i>
                        </div>
                    </div>

                    <div class="space-y-1 md:mb-3">
                        <h2 id="profile-username" class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">---</h2>
                        <p id="profile-bio-text" class="text-xs text-[#b0b3b8] italic">Chưa có tiểu sử</p>
                    </div>
                </div>

                <div id="profile-action-btn" class="flex items-center gap-2 md:mb-3 w-full md:w-auto justify-center shrink-0 z-20"></div>
            </div>
        </div>

        <!-- Bố cục 2 Cột -->
        <div class="w-full max-w-[1050px] p-2 sm:p-4 grid grid-cols-1 md:grid-cols-5 gap-4 mt-2">
            
            <div class="md:col-span-2 space-y-4">
                <div class="bg-fbPanel p-4 rounded-2xl border border-fbHover space-y-3 shadow">
                    <h3 class="text-base font-bold text-white">Giới thiệu</h3>
                    <div class="space-y-2.5 text-xs text-slate-300">
                        <div class="flex items-center gap-2.5">
                            <i class="fa-solid fa-location-dot text-[#b0b3b8] w-4 text-center"></i>
                            <span>Sống tại <strong class="text-white">Đông Xuân, Hà Nội</strong></span>
                        </div>
                        <div class="flex items-center gap-2.5">
                            <i class="fa-solid fa-graduation-cap text-[#b0b3b8] w-4 text-center"></i>
                            <span>Học sinh tại <strong class="text-white">THPT Sóc Sơn</strong></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="md:col-span-3 space-y-4">
                <div class="bg-fbPanel p-3.5 rounded-2xl border border-fbHover flex items-center justify-between shadow">
                    <h3 class="text-sm font-bold text-white">Bài viết</h3>
                </div>
                <div id="profile-posts-container" class="space-y-4"></div>
            </div>

        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB100rlybpLzv5ax2otgGPzDJc1l5pASyo",
            authDomain: "minh-s-website.firebaseapp.com",
            projectId: "minh-s-website",
            storageBucket: "minh-s-website.appspot.com",
            messagingSenderId: "453574408938",
            appId: "1:453574408938:web:f5b017647a17deacfc3593"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const loggedUser = localStorage.getItem("chat_user");
        const targetUser = urlParams.get('profile') || loggedUser;
        let userAvatarBase64 = localStorage.getItem("user_avatar") || "";
        let userCoverBase64 = localStorage.getItem("user_cover") || "";
        let coverPercent = parseFloat(localStorage.getItem("user_cover_pos_percent") || "0");
        let userAvatarPos = localStorage.getItem("user_avatar_pos") || "center center";
        let userBio = localStorage.getItem("user_bio") || "";

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        document.getElementById("profile-username").innerText = targetUser === 'phamnhatminh' ? 'Phạm Nhật Minh' : targetUser;
        if (userBio) document.getElementById("profile-bio-text").innerText = userBio;

        // Render Avatar
        if (userAvatarBase64) {
            if (userAvatarBase64.startsWith("data:video")) {
                document.getElementById("profile-avatar-box").innerHTML = `<video src="${userAvatarBase64}" class="w-full h-full object-cover" style="object-position: ${userAvatarPos};" autoplay loop muted></video>`;
            } else {
                document.getElementById("profile-avatar-box").innerHTML = `<img src="${userAvatarBase64}" class="w-full h-full object-cover" style="object-position: ${userAvatarPos};">`;
            }
        }

        // Render Cover Photo chuẩn 100% theo phần trăm tọa độ đã kéo
        if (userCoverBase64) {
            // Chuyển % dịch chuyển thành offset top linh hoạt
            document.getElementById("profile-cover-box").innerHTML = `
                <img src="${userCoverBase64}" class="w-full h-full object-cover" style="object-position: center ${coverPercent}%;">
            `;
        }

        if (targetUser === loggedUser) {
            document.getElementById("profile-action-btn").innerHTML = `
                <button class="bg-fbBlue hover:opacity-90 px-4 py-2 rounded-xl text-xs font-bold text-white flex items-center gap-1.5 shadow"><i class="fa-solid fa-plus"></i> Thêm vào tin</button>
            `;
        } else {
            document.getElementById("profile-action-btn").innerHTML = `
                <button class="bg-fbBlue hover:opacity-90 px-4 py-2 rounded-lg text-xs font-bold text-white flex items-center gap-1.5 shadow"><i class="fa-solid fa-message"></i> Nhắn tin</button>
            `;
        }

        const q = query(collection(db, "posts"));
        onSnapshot(q, (snap) => {
            const userPosts = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                .filter(p => p.author === targetUser)
                .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            
            const container = document.getElementById("profile-posts-container");
            if (userPosts.length === 0) {
                container.innerHTML = `<div class="bg-fbPanel p-6 rounded-2xl border border-fbHover text-center text-xs text-[#b0b3b8] italic">Chưa có bài viết nào.</div>`;
            } else {
                container.innerHTML = userPosts.map(p => `
                    <div class="bg-fbPanel rounded-2xl border border-fbHover p-4 space-y-3 shadow">
                        <h4 class="text-xs font-bold text-white">${escapeHTML(p.author)}</h4>
                        ${p.title ? `<p class="text-xs text-slate-200 break-words">${escapeHTML(p.title)}</p>` : ''}
                        ${p.media ? `<div class="rounded-xl overflow-hidden bg-black max-h-[350px] sm:max-h-[400px] flex items-center justify-center"><img src="${p.media}" class="w-full object-cover"></div>` : ''}
                    </div>
                `).join("");
            }
        });
    </script>
</body>
</html>
