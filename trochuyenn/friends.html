<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bạn bè | Facebook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fbBg: '#18191a',
                        fbPanel: '#242526',
                        fbHover: '#3a3b3c',
                        fbInput: '#3a3b3c',
                        fbBlue: '#2d88ff',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #18191a; color: #e4e6eb; }
    </style>
</head>
<body class="bg-fbBg text-[#e4e6eb] h-screen flex flex-col overflow-hidden">

    <!-- HEADER TOP -->
    <header class="h-14 bg-fbPanel border-b border-fbHover px-4 flex items-center justify-between shrink-0 z-40">
        <div class="flex items-center gap-3">
            <a href="trangchu.html" class="text-fbBlue text-3xl"><i class="fa-solid fa-house"></i></a>
            <span class="text-lg font-bold text-white">Bạn bè</span>
        </div>
        <a href="trangchu.html" class="bg-fbInput hover:bg-fbHover text-xs font-bold px-3 py-2 rounded-xl text-white flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Quay lại Trang Chủ
        </a>
    </header>

    <!-- GIAO DIỆN BẠN BÈ 2 CỘT -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- CỘT TRÁI: MENU BẠN BÈ -->
        <div class="w-[280px] sm:w-[320px] bg-fbPanel border-r border-fbHover p-3 space-y-2 flex flex-col shrink-0">
            <div class="flex items-center justify-between px-2 py-1">
                <h2 class="text-xl font-bold text-white">Bạn bè</h2>
                <div class="w-8 h-8 rounded-full bg-fbInput flex items-center justify-center text-white"><i class="fa-solid fa-gear"></i></div>
            </div>

            <!-- NÚT BACK VỀ MENU CHÍNH -->
            <button id="btn-back-main" onclick="showSection('requests')" class="w-full text-left p-2.5 rounded-xl hover:bg-fbHover flex items-center gap-3 font-semibold text-xs text-fbBlue border border-fbBlue/30 bg-fbBlue/10">
                <i class="fa-solid fa-arrow-left"></i> quay lại Lời mời kết bạn
            </button>

            <nav class="space-y-1 text-sm font-semibold">
                <button onclick="showSection('requests')" id="menu-requests" class="w-full flex items-center justify-between p-3 rounded-xl bg-fbHover text-white">
                    <div class="flex items-center gap-3"><i class="fa-solid fa-user-plus text-fbBlue text-lg"></i> Lời mời kết bạn</div>
                    <i class="fa-solid fa-chevron-right text-xs text-[#b0b3b8]"></i>
                </button>
                <button onclick="showSection('suggestions')" id="menu-suggestions" class="w-full flex items-center justify-between p-3 rounded-xl hover:bg-fbHover text-[#e4e6eb]">
                    <div class="flex items-center gap-3"><i class="fa-solid fa-user-check text-green-400 text-lg"></i> Gợi ý</div>
                    <i class="fa-solid fa-chevron-right text-xs text-[#b0b3b8]"></i>
                </button>
                <button onclick="showSection('all')" id="menu-all" class="w-full flex items-center justify-between p-3 rounded-xl hover:bg-fbHover text-[#e4e6eb]">
                    <div class="flex items-center gap-3"><i class="fa-solid fa-users text-purple-400 text-lg"></i> Tất cả bạn bè</div>
                    <i class="fa-solid fa-chevron-right text-xs text-[#b0b3b8]"></i>
                </button>
            </nav>
        </div>

        <!-- CỘT PHẢI: HIỂN THỊ DANH SÁCH -->
        <div class="flex-1 overflow-y-auto p-4 sm:p-6">
            <div class="max-w-6xl mx-auto space-y-4">
                <div class="flex items-center justify-between">
                    <h3 id="section-title" class="text-xl font-bold text-white">Lời mời kết bạn</h3>
                    <button id="btn-see-all" class="text-xs font-semibold text-fbBlue hover:underline">Xem tất cả</button>
                </div>

                <!-- LƯỚI CARD BẠN BÈ -->
                <div id="friends-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, arrayUnion, arrayRemove, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB100rlybpLzv5ax2otgGPzDJc1l5pASyo",
            authDomain: "minh-s-website.firebaseapp.com",
            projectId: "minh-s-website",
            storageBucket: "minh-s-website.appspot.com",
            messagingSenderId: "453574408938",
            appId: "1:453574408938:web:f5b017647a17deacfc3593"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const loggedUser = localStorage.getItem("chat_user");

        if(!loggedUser) window.location.href = "trangchu.html";

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        window.showSection = function(section) {
            const title = document.getElementById("section-title");
            ['requests', 'suggestions', 'all'].forEach(m => {
                const btn = document.getElementById(`menu-${m}`);
                if(btn) btn.className = "w-full flex items-center justify-between p-3 rounded-xl hover:bg-fbHover text-[#e4e6eb]";
            });
            document.getElementById(`menu-${section}`).className = "w-full flex items-center justify-between p-3 rounded-xl bg-fbHover text-white font-bold";

            if(section === 'requests') {
                title.innerText = "Lời mời kết bạn";
                loadRequests();
            } else if(section === 'suggestions') {
                title.innerText = "Gợi ý kết bạn (Có bạn chung)";
                loadSuggestions();
            } else if(section === 'all') {
                title.innerText = "Tất cả bạn bè";
                loadAllFriends();
            }
        };

        async function getMutualFriendsCount(targetUser) {
            const meSnap = await getDoc(doc(db, "users", loggedUser));
            const targetSnap = await getDoc(doc(db, "users", targetUser));
            if(!meSnap.exists() || !targetSnap.exists()) return 0;

            const myFriends = meSnap.data().friends || [];
            const targetFriends = targetSnap.data().friends || [];

            return myFriends.filter(f => targetFriends.includes(f)).length;
        }

        async function loadRequests() {
            const grid = document.getElementById("friends-grid");
            const snap = await getDoc(doc(db, "users", loggedUser));
            const requests = snap.data()?.friendRequests || [];

            if(requests.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-xs text-[#b0b3b8] italic py-8">Không có lời mời kết bạn nào</p>`;
                return;
            }

            grid.innerHTML = "";
            for(let reqUser of requests) {
                const count = await getMutualFriendsCount(reqUser);
                const userDoc = await getDoc(doc(db, "users", reqUser));
                const avatar = userDoc.data()?.avatar || "";

                grid.innerHTML += `
                    <div class="bg-fbPanel border border-fbHover rounded-2xl overflow-hidden shadow flex flex-col justify-between">
                        <a href="profile.html?profile=${escapeHTML(reqUser)}" class="block">
                            <div class="h-44 bg-fbHover flex items-center justify-center overflow-hidden">
                                ${avatar ? `<img src="${avatar}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-user text-5xl text-gray-500"></i>`}
                            </div>
                            <div class="p-3">
                                <h4 class="font-bold text-sm text-white hover:underline">${escapeHTML(reqUser)}</h4>
                                <p class="text-xs text-[#b0b3b8] mt-1">${count} bạn chung</p>
                            </div>
                        </a>
                        <div class="p-3 pt-0 space-y-2">
                            <button onclick="acceptFriend('${escapeHTML(reqUser)}')" class="w-full bg-fbBlue hover:opacity-90 py-2 rounded-xl font-bold text-xs text-white">Xác nhận</button>
                            <button onclick="rejectFriend('${escapeHTML(reqUser)}')" class="w-full bg-fbHover hover:bg-[#4e4f50] py-2 rounded-xl font-bold text-xs text-white">Xóa</button>
                        </div>
                    </div>
                `;
            }
        }

        async function loadSuggestions() {
            const grid = document.getElementById("friends-grid");
            const snap = await getDocs(collection(db, "users"));
            const meSnap = await getDoc(doc(db, "users", loggedUser));
            const myFriends = meSnap.data()?.friends || [];
            const myRequests = meSnap.data()?.friendRequests || [];

            grid.innerHTML = "";
            for(let docSnap of snap.docs) {
                const u = docSnap.id;
                if(u === loggedUser || myFriends.includes(u) || myRequests.includes(u)) continue;

                const count = await getMutualFriendsCount(u);
                if(count > 0) { // Chỉ hiện người có bạn chung
                    const avatar = docSnap.data()?.avatar || "";
                    grid.innerHTML += `
                        <div class="bg-fbPanel border border-fbHover rounded-2xl overflow-hidden shadow flex flex-col justify-between">
                            <a href="profile.html?profile=${escapeHTML(u)}" class="block">
                                <div class="h-44 bg-fbHover flex items-center justify-center overflow-hidden">
                                    ${avatar ? `<img src="${avatar}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-user text-5xl text-gray-500"></i>`}
                                </div>
                                <div class="p-3">
                                    <h4 class="font-bold text-sm text-white hover:underline">${escapeHTML(u)}</h4>
                                    <p class="text-xs text-[#b0b3b8] mt-1">${count} bạn chung</p>
                                </div>
                            </a>
                            <div class="p-3 pt-0">
                                <button onclick="sendFriendRequest('${escapeHTML(u)}')" class="w-full bg-fbBlue hover:opacity-90 py-2 rounded-xl font-bold text-xs text-white">Thêm bạn bè</button>
                            </div>
                        </div>
                    `;
                }
            }
        }

        async function loadAllFriends() {
            const grid = document.getElementById("friends-grid");
            const meSnap = await getDoc(doc(db, "users", loggedUser));
            const friends = meSnap.data()?.friends || [];

            if(friends.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-xs text-[#b0b3b8] italic py-8">Bạn chưa có người bạn nào</p>`;
                return;
            }

            grid.innerHTML = "";
            for(let f of friends) {
                const uSnap = await getDoc(doc(db, "users", f));
                const avatar = uSnap.data()?.avatar || "";
                grid.innerHTML += `
                    <div class="bg-fbPanel border border-fbHover rounded-2xl overflow-hidden shadow flex flex-col justify-between p-3">
                        <a href="profile.html?profile=${escapeHTML(f)}" class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-full bg-fbHover flex items-center justify-center overflow-hidden">
                                ${avatar ? `<img src="${avatar}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-user text-xl text-gray-500"></i>`}
                            </div>
                            <div>
                                <h4 class="font-bold text-sm text-white hover:underline">${escapeHTML(f)}</h4>
                                <p class="text-[10px] text-green-400">Bạn bè</p>
                            </div>
                        </a>
                    </div>
                `;
            }
        }

        window.acceptFriend = async function(targetUser) {
            await updateDoc(doc(db, "users", loggedUser), {
                friends: arrayUnion(targetUser),
                friendRequests: arrayRemove(targetUser)
            });
            await updateDoc(doc(db, "users", targetUser), {
                friends: arrayUnion(loggedUser)
            });

            // Gửi thông báo đến người kia
            await addDoc(collection(db, `users/${targetUser}/notifications`), {
                text: `${loggedUser} đã chấp nhận lời mời kết bạn của bạn.`,
                type: 'friend_accept',
                createdAt: new Date()
            });

            alert("Đã trở thành bạn bè!");
            loadRequests();
        };

        window.rejectFriend = async function(targetUser) {
            await updateDoc(doc(db, "users", loggedUser), {
                friendRequests: arrayRemove(targetUser)
            });
            loadRequests();
        };

        window.sendFriendRequest = async function(targetUser) {
            await updateDoc(doc(db, "users", targetUser), {
                friendRequests: arrayUnion(loggedUser)
            });
            await addDoc(collection(db, `users/${targetUser}/notifications`), {
                text: `${loggedUser} đã gửi cho bạn một lời mời kết bạn.`,
                type: 'friend_request',
                createdAt: new Date()
            });
            alert("Đã gửi lời mời kết bạn!");
        };

        loadRequests();
    </script>
</body>
</html>
