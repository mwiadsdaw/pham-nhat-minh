<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bạn bè | MinhNet</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fbBg: '#18191a',
                        fbPanel: '#242526',
                        fbHover: '#3a3b3c',
                        fbInput: '#3a3b3c',
                        fbBlue: '#2d88ff',
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #18191a;
            color: #e4e6eb;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a3b3c;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-fbBg text-[#e4e6eb] min-h-screen flex flex-col overflow-x-hidden pb-14 lg:pb-0">

    <!-- HEADER TOP -->
    <header class="h-14 bg-fbPanel border-b border-fbHover px-3 sm:px-4 flex items-center justify-between sticky top-0 z-40 shrink-0">
        <div class="flex items-center gap-2 sm:gap-3">
            <a href="index.html" class="text-fbBlue text-2xl sm:text-3xl cursor-pointer hover:opacity-80 transition" title="Về trang chủ"><i class="fa-solid fa-house"></i></a>
            <div class="bg-fbInput rounded-full px-3 py-2 hidden sm:flex items-center gap-2 w-[180px] md:w-[240px]">
                <i class="fa-solid fa-search text-[#b0b3b8] text-xs"></i>
                <input type="text" placeholder="Tìm kiếm bạn bè" class="bg-transparent text-xs text-white placeholder-[#b0b3b8] focus:outline-none w-full">
            </div>
        </div>

        <!-- Navbar Desktop -->
        <div class="hidden md:flex items-center gap-1 sm:gap-4">
            <a href="index.html" class="h-12 px-4 sm:px-6 flex items-center justify-center border-b-4 border-transparent text-[#b0b3b8] text-lg sm:text-xl rounded-lg hover:bg-fbHover transition cursor-pointer" title="Bảng feed"><i class="fa-solid fa-users"></i></a>
            <a href="index.html" class="h-12 px-4 sm:px-6 flex items-center justify-center border-b-4 border-transparent text-[#b0b3b8] text-lg sm:text-xl rounded-lg hover:bg-fbHover transition cursor-pointer" title="Thước phim"><i class="fa-solid fa-clapperboard"></i></a>
            <div class="h-12 px-4 sm:px-6 flex items-center justify-center border-b-4 border-fbBlue text-fbBlue text-lg sm:text-xl rounded-lg hover:bg-fbHover transition cursor-pointer" title="Bạn bè"><i class="fa-solid fa-user-group"></i></div>
        </div>

        <div class="flex items-center gap-2 sm:gap-3 justify-end">
            <div class="flex items-center gap-2 cursor-pointer hover:bg-fbHover p-1.5 rounded-full" onclick="location.href='index.html'">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-fbBlue to-purple-600 flex items-center justify-center font-bold text-xs text-white overflow-hidden shrink-0">
                    <i class="fa-solid fa-user"></i>
                </div>
                <span id="header-username" class="text-xs font-bold text-white hidden md:block">Tài khoản</span>
            </div>
        </div>
    </header>

    <!-- BODY CHÍNH -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- CỘT TRÁI (Desktop) -->
        <div class="w-[260px] hidden lg:flex flex-col p-3 space-y-1 overflow-y-auto border-r border-fbHover shrink-0">
            <a href="index.html" class="flex items-center gap-3 p-2.5 rounded-xl hover:bg-fbHover cursor-pointer transition text-[#e4e6eb]">
                <i class="fa-solid fa-house text-fbBlue text-lg w-6 text-center"></i>
                <span class="text-xs font-semibold">Trang chủ MinhNet</span>
            </a>
            <div class="flex items-center gap-3 p-2.5 rounded-xl bg-fbHover cursor-pointer transition text-white">
                <i class="fa-solid fa-user-group text-cyan-400 text-lg w-6 text-center"></i>
                <span class="text-xs font-semibold">Gợi ý kết bạn</span>
            </div>
        </div>

        <!-- NỘI DUNG TRANG BẠN BÈ -->
        <div class="flex-1 overflow-y-auto p-4 sm:p-6 flex flex-col items-center">
            <div class="max-w-[900px] w-full space-y-6 pb-20">
                <div class="flex items-center justify-between">
                    <h2 class="text-xl font-bold text-white">Những người bạn có thể biết</h2>
                </div>

                <!-- Danh sách gợi ý kết bạn -->
                <div id="friends-suggestions-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                    <!-- Thẻ gợi ý 1 -->
                    <div class="bg-fbPanel rounded-xl border border-fbHover overflow-hidden shadow flex flex-col">
                        <div class="h-24 bg-gradient-to-r from-blue-900 to-indigo-900"></div>
                        <div class="px-4 pb-4 flex-1 flex flex-col justify-between -mt-10">
                            <div class="space-y-3">
                                <div class="w-20 h-20 rounded-full border-4 border-fbPanel bg-fbHover flex items-center justify-center text-2xl font-bold text-white overflow-hidden shadow">
                                    <i class="fa-solid fa-user"></i>
                                </div>
                                <div>
                                    <h3 class="font-bold text-white text-sm">Nguyễn Văn A</h3>
                                    <p class="text-[11px] text-[#b0b3b8]">Có 15 bạn chung</p>
                                </div>
                            </div>
                            <div class="space-y-2 pt-4">
                                <button onclick="alert('Đã gửi lời mời kết bạn!')" class="w-full bg-fbBlue hover:opacity-90 py-2 rounded-xl text-xs font-bold text-white transition cursor-pointer">Thêm bạn bè</button>
                                <button onclick="this.parentElement.parentElement.parentElement.remove()" class="w-full bg-fbHover hover:bg-[#4e4f50] py-2 rounded-xl text-xs font-bold text-white transition cursor-pointer">Gỡ</button>
                            </div>
                        </div>
                    </div>

                    <!-- Thẻ gợi ý 2 -->
                    <div class="bg-fbPanel rounded-xl border border-fbHover overflow-hidden shadow flex flex-col">
                        <div class="h-24 bg-gradient-to-r from-purple-900 to-pink-900"></div>
                        <div class="px-4 pb-4 flex-1 flex flex-col justify-between -mt-10">
                            <div class="space-y-3">
                                <div class="w-20 h-20 rounded-full border-4 border-fbPanel bg-fbHover flex items-center justify-center text-2xl font-bold text-white overflow-hidden shadow">
                                    <i class="fa-solid fa-user"></i>
                                </div>
                                <div>
                                    <h3 class="font-bold text-white text-sm">Trần Thị B</h3>
                                    <p class="text-[11px] text-[#b0b3b8]">Có 3 bạn chung</p>
                                </div>
                            </div>
                            <div class="space-y-2 pt-4">
                                <button onclick="alert('Đã gửi lời mời kết bạn!')" class="w-full bg-fbBlue hover:opacity-90 py-2 rounded-xl text-xs font-bold text-white transition cursor-pointer">Thêm bạn bè</button>
                                <button onclick="this.parentElement.parentElement.parentElement.remove()" class="w-full bg-fbHover hover:bg-[#4e4f50] py-2 rounded-xl text-xs font-bold text-white transition cursor-pointer">Gỡ</button>
                            </div>
                        </div>
                    </div>

                    <!-- Thẻ gợi ý 3 -->
                    <div class="bg-fbPanel rounded-xl border border-fbHover overflow-hidden shadow flex flex-col">
                        <div class="h-24 bg-gradient-to-r from-emerald-900 to-teal-900"></div>
                        <div class="px-4 pb-4 flex-1 flex flex-col justify-between -mt-10">
                            <div class="space-y-3">
                                <div class="w-20 h-20 rounded-full border-4 border-fbPanel bg-fbHover flex items-center justify-center text-2xl font-bold text-white overflow-hidden shadow">
                                    <i class="fa-solid fa-user"></i>
                                </div>
                                <div>
                                    <h3 class="font-bold text-white text-sm">Lê Hoàng C</h3>
                                    <p class="text-[11px] text-[#b0b3b8]">Học sinh THPT Sóc Sơn</p>
                                </div>
                            </div>
                            <div class="space-y-2 pt-4">
                                <button onclick="alert('Đã gửi lời mời kết bạn!')" class="w-full bg-fbBlue hover:opacity-90 py-2 rounded-xl text-xs font-bold text-white transition cursor-pointer">Thêm bạn bè</button>
                                <button onclick="this.parentElement.parentElement.parentElement.remove()" class="w-full bg-fbHover hover:bg-[#4e4f50] py-2 rounded-xl text-xs font-bold text-white transition cursor-pointer">Gỡ</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- BOTTOM NAVIGATION BAR CHO MOBILE -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 h-14 bg-fbPanel border-t border-fbHover flex items-center justify-around z-50">
        <a href="index.html" class="flex flex-col items-center justify-center text-[#b0b3b8] flex-1 py-1 cursor-pointer">
            <i class="fa-solid fa-users text-base"></i>
            <span class="text-[10px] font-semibold">Feed</span>
        </a>
        <a href="index.html" class="flex flex-col items-center justify-center text-[#b0b3b8] flex-1 py-1 cursor-pointer">
            <i class="fa-solid fa-clapperboard text-base"></i>
            <span class="text-[10px] font-semibold">Reels</span>
        </a>
        <div class="flex flex-col items-center justify-center text-fbBlue flex-1 py-1 cursor-pointer">
            <i class="fa-solid fa-user-group text-base"></i>
            <span class="text-[10px] font-semibold">Bạn bè</span>
        </div>
        <a href="index.html" class="flex flex-col items-center justify-center text-[#b0b3b8] flex-1 py-1 cursor-pointer">
            <i class="fa-solid fa-circle-user text-base"></i>
            <span class="text-[10px] font-semibold">Cá nhân</span>
        </a>
    </div>

    <script>
        // Hiển thị tên người dùng hiện tại nếu đã đăng nhập từ trang chính
        const currentUser = localStorage.getItem("chat_user");
        if (currentUser) {
            document.getElementById("header-username").innerText = currentUser;
        }
    </script>
</body>
</html>
