<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vẽ hình đa cử chỉ - pminh83</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
        }
        h2 { margin-bottom: 5px; font-size: 1.1rem; text-align: center; }
        .container {
            position: relative;
            width: 640px;
            height: 480px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
        }
        .instruction {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #aaa;
            text-align: center;
            max-width: 640px;
        }
    </style>

    <!-- Thư viện MediaPipe từ Google -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <h2>Điều khiển hình học bằng cử chỉ ngón tay</h2>
    <div class="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas" width="640" height="480"></canvas>
    </div>
    <div class="instruction">
        - 1 tay chụm (Trỏ + Cái): Tạo điểm.<br>
        - 2 tay chụm: Nối thành đoạn thẳng.<br>
        - 1 tay mở (tách ngón): Tạo hình chữ nhật co giãn theo vị trí tay.<br>
        - Xoay cổ tay: Biến hình chữ nhật thành 2 tam giác vắt chéo.
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            let hands = results.multiHandLandmarks || [];
            
            if (hands.length === 1) {
                const landmarks = hands[0];
                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];
                const x = indexTip.x * canvasElement.width;
                const y = indexTip.y * canvasElement.height;
                
                // Tính khoảng cách ngón cái và trỏ để xem có chụm không
                const pinchDist = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);

                if (pinchDist < 0.05) {
                    // Chụm 1 tay -> Tạo 1 điểm
                    canvasCtx.fillStyle = '#ff0055';
                    canvasCtx.beginPath();
                    canvasCtx.arc(x, y, 12, 0, 2 * Math.PI);
                    canvasCtx.fill();
                } else {
                    // Tách tay ra -> Tạo hình chữ nhật co giãn theo vị trí ngón trỏ và cổ tay (điểm 0)
                    const wrist = landmarks[0];
                    let rx = wrist.x * canvasElement.width;
                    let ry = wrist.y * canvasElement.height;

                    let width = Math.abs(x - rx) * 1.5;
                    let height = Math.abs(y - ry) * 1.5;
                    let cx = (x + rx) / 2;
                    let cy = (y + ry) / 2;

                    // Kiểm tra độ nghiêng/xoay cổ tay dựa vào điểm ngón út (20) và ngón cái (4)
                    let angle = Math.atan2(indexTip.y - wrist.y, indexTip.x - wrist.x);

                    canvasCtx.save();
                    canvasCtx.translate(cx, cy);
                    canvasCtx.rotate(angle);

                    canvasCtx.strokeStyle = '#00ffcc';
                    canvasCtx.lineWidth = 4;
                    canvasCtx.fillStyle = 'rgba(0, 255, 204, 0.15)';

                    // Nếu xoay góc lớn (ví dụ nghiêng tay), biến thành 2 tam giác vắt chéo
                    if (Math.abs(angle) > 0.8) {
                        canvasCtx.beginPath();
                        canvasCtx.rect(-width/2, -height/2, width, height);
                        // Vẽ 2 đường chéo
                        canvasCtx.moveTo(-width/2, -height/2);
                        canvasCtx.lineTo(width/2, height/2);
                        canvasCtx.moveTo(width/2, -height/2);
                        canvasCtx.lineTo(-width/2, height/2);
                        canvasCtx.stroke();
                        canvasCtx.fill();
                    } else {
                        // Hình chữ nhật bình thường co giãn theo tay
                        canvasCtx.beginPath();
                        canvasCtx.rect(-width/2, -height/2, width, height);
                        canvasCtx.stroke();
                        canvasCtx.fill();
                    }
                    canvasCtx.restore();
                }
            } else if (hands.length >= 2) {
                // 2 tay cùng chụm ngón trỏ và ngón cái -> Nối thành đoạn thẳng
                const p1 = hands[0][8];
                const p2 = hands[1][8];
                const x1 = p1.x * canvasElement.width;
                const y1 = p1.y * canvasElement.height;
                const x2 = p2.x * canvasElement.width;
                const y2 = p2.y * canvasElement.height;

                canvasCtx.strokeStyle = '#ffff00';
                canvasCtx.lineWidth = 6;
                canvasCtx.beginPath();
                canvasCtx.moveTo(x1, y1);
                canvasCtx.lineTo(x2, y2);
                canvasCtx.stroke();

                // Vẽ 2 điểm ở đầu mút
                canvasCtx.fillStyle = '#ff0055';
                canvasCtx.beginPath();
                canvasCtx.arc(x1, y1, 8, 0, 2 * Math.PI);
                canvasCtx.arc(x2, y2, 8, 0, 2 * Math.PI);
                canvasCtx.fill();
            }

            canvasCtx.restore();
        }

        const handsModel = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        handsModel.setOptions({
            maxNumHands: 2,           // Bật chế độ nhận diện tối đa 2 bàn tay
            modelComplexity: 0,       // Đặt về 0 để tăng tốc độ khung hình (giảm giật lag, tăng FPS)
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        handsModel.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await handsModel.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });
        camera.start();
    </script>
</body>
</html>
