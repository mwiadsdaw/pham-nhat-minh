<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đếm số lần đứng lên ngồi xuống - pminh83</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
        }
        h2 { margin-bottom: 5px; font-size: 1.2rem; text-align: center; }
        .counter-box {
            font-size: 2rem;
            color: #00ffcc;
            font-weight: bold;
            margin: 10px 0;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 8px;
            border: 2px solid #00ffcc;
        }
        .container {
            position: relative;
            width: 640px;
            height: 480px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
        }
        .instruction {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #aaa;
            text-align: center;
            max-width: 640px;
        }
    </style>

    <!-- Thư viện MediaPipe Pose & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>

    <h2>AI Đếm Số Lần Đứng Lên / Ngồi Xuống</h2>
    <div class="counter-box" id="counter">Số lần: 0</div>
    
    <div class="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas" width="640" height="480"></canvas>
    </div>
    
    <div class="instruction">
        Đứng lùi lại sao cho camera thấy toàn thân (từ đầu gối đến đầu).<br>
        Trạng thái hiện tại: <span id="status" style="color: yellow; font-weight: bold;">Đang chờ...</span>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const counterEl = document.getElementById('counter');
        const statusEl = document.getElementById('status');

        let count = 0;
        let poseState = "STANDING"; // Trạng thái ban đầu: Đang đứng

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks) {
                const landmarks = results.poseLandmarks;

                // Lấy tọa độ hông (điểm 23 là hông trái, 24 là hông phải) hoặc trung bình hông
                const leftHip = landmarks[23];
                const rightHip = landmarks[24];
                
                // Lấy tọa độ đầu gối (25, 26) để làm mốc so sánh độ cao
                const leftKnee = landmarks[25];

                if (leftHip && rightHip && leftKnee) {
                    // Tính độ cao trung bình của hông theo trục Y (Y càng nhỏ càng ở trên cao)
                    const hipY = (leftHip.y + rightHip.y) / 2;
                    const kneeY = leftKnee.y;

                    // Vẽ các điểm mốc cơ thể lên màn hình cho trực quan
                    drawConnectors(canvasCtx, landmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
                    drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 1});

                    // Logic phát hiện Đứng lên / Ngồi xuống dựa vào vị trí tương đối giữa Hông và Đầu gối
                    // Khi ngồi xuống, vị trí Y của hông sẽ tiến gần lại hoặc thấp hơn đầu gối tùy góc quay
                    // Ở đây dùng ngưỡng chênh lệch Y đơn giản và ổn định
                    if (hipY > kneeY - 0.05) {
                        // Hông hạ thấp -> Đang ngồi xuống (Squat)
                        poseState = "SITTING";
                        statusEl.innerText = "Đang ngồi xuống 🔽";
                        statusEl.style.color = "#ff5555";
                    } else if (hipY < kneeY - 0.15 && poseState === "SITTING") {
                        // Hông nâng cao hẳn lên -> Đã đứng thẳng dậy từ tư thế ngồi
                        poseState = "STANDING";
                        count++;
                        counterEl.innerText = `Số lần: ${count}`;
                        statusEl.innerText = "Đã đứng lên 🔼 (+1)";
                        statusEl.style.color = "#55ff55";
                    }
                }
            } else {
                statusEl.innerText = "Không nhìn thấy toàn thân, hãy lùi ra xa!";
                statusEl.style.color = "orange";
            }

            canvasCtx.restore();
        }

        // Khởi tạo mô hình MediaPipe Pose
        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 0, // Đặt về 0 để tối ưu tốc độ 60 FPS
            smoothLandmarks: true,
            enableSegmentation: false,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(onResults);

        // Khởi động Camera với độ phân giải tối ưu tốc độ
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await pose.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });
        camera.start();
    </script>
</body>
</html>
