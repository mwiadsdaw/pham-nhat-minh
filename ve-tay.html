<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vẽ hình bằng ngón tay - pminh83</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
        }
        h2 { margin-bottom: 10px; font-size: 1.2rem; text-align: center; }
        .container {
            position: relative;
            width: 640px;
            height: 480px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
        }
        .instruction {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #aaa;
        }
    </style>

    <!-- Thư viện MediaPipe từ Google -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <h2>Chụm ngón cái và ngón trỏ để vẽ</h2>
    <div class="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas" width="640" height="480"></canvas>
    </div>
    <div class="instruction">Đưa tay trước camera, chụm 2 ngón tay lại để bắt đầu vẽ nét xanh!</div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');

        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        const drawingCanvas = document.createElement('canvas');
        drawingCanvas.width = 640;
        drawingCanvas.height = 480;
        const drawingCtx = drawingCanvas.getContext('2d');

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(drawingCanvas, 0, 0);

            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    const indexFinger = landmarks[8];
                    const thumb = landmarks[4];

                    const x = indexFinger.x * canvasElement.width;
                    const y = indexFinger.y * canvasElement.height;

                    const distance = Math.hypot(indexFinger.x - thumb.x, indexFinger.y - thumb.y);

                    if (distance < 0.05) {
                        if (!isDrawing) {
                            isDrawing = true;
                            lastX = x;
                            lastY = y;
                        } else {
                            drawingCtx.strokeStyle = '#00ffcc';
                            drawingCtx.lineWidth = 6;
                            drawingCtx.lineCap = 'round';
                            drawingCtx.beginPath();
                            drawingCtx.moveTo(lastX, lastY);
                            drawingCtx.lineTo(x, y);
                            drawingCtx.stroke();
                        }
                        lastX = x;
                        lastY = y;

                        canvasCtx.fillStyle = '#ff0055';
                        canvasCtx.beginPath();
                        canvasCtx.arc(x, y, 8, 0, 2 * Math.PI);
                        canvasCtx.fill();
                    } else {
                        isDrawing = false;
                    }
                }
            }
            canvasCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });
        camera.start();
    </script>
</body>
</html>
