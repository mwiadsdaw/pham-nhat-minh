<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phát hiện người và cử chỉ - pminh83</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
        }
        h2 { margin-bottom: 5px; font-size: 1.1rem; text-align: center; }
        .container {
            position: relative;
            width: 640px;
            height: 480px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
        }
        .instruction {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #aaa;
            text-align: center;
            max-width: 640px;
        }
    </style>

    <!-- Thư viện TensorFlow.js và mô hình Coco-Ssd (Phát hiện người và vật thể) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
</head>
<body>

    <h2>Hệ thống nhận diện Người và Cử chỉ</h2>
    <div class="container">
        <video id="webcam" autoplay playsinline muted width="640" height="480"></video>
        <canvas id="output_canvas" width="640" height="480"></canvas>
    </div>
    <div class="instruction">
        Đứng trước camera để hệ thống quét và nhận diện người...
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');

        let model = undefined;
        let isDetecting = false;

        // 1. Khởi động Webcam
        async function setupCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: 640, height: 480 },
                audio: false
            });
            videoElement.srcObject = stream;
            return new Promise((resolve) => {
                videoElement.onloadedmetadata = () => {
                    resolve(videoElement);
                };
            });
        }

        // 2. Tải mô hình nhận diện AI
        async function loadModel() {
            canvasCtx.fillStyle = "white";
            canvasCtx.font = "18px Arial";
            canvasCtx.fillText("Đang tải mô hình AI nhận diện người...", 160, 240);
            
            model = await cocoSsd.load();
            console.log("Đã tải xong mô hình Coco-SSD!");
            detectFrame();
        }

        // 3. Quét liên tục từng khung hình để tìm người
        async function detectFrame() {
            if (!model) return;

            // Dự đoán các đối tượng xuất hiện trong video
            const predictions = await model.detect(videoElement);

            // Xóa màn hình cũ và vẽ lại khung hình video (lật gương)
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);

            let personDetected = false;

            // Duyệt qua các vật thể AI tìm thấy
            predictions.forEach(prediction => {
                // Chỉ lấy đối tượng là "person" (con người)
                if (prediction.class === 'person') {
                    personDetected = true;
                    const [x, y, width, height] = prediction.bbox;

                    // Vì dùng lật gương (scaleX(-1)), cần tính lại tọa độ X cho khớp khung hình canvas
                    const mirroredX = canvasElement.width - x - width;

                    // Vẽ khung bao quanh người
                    canvasCtx.strokeStyle = '#00ffcc';
                    canvasCtx.lineWidth = 4;
                    canvasCtx.strokeRect(mirroredX, y, width, height);

                    // Hiển thị nhãn tên và độ chính xác
                    canvasCtx.fillStyle = '#00ffcc';
                    canvasCtx.font = '16px Arial';
                    canvasCtx.fillText(
                        `Người (${Math.round(prediction.score * 100)}%)`, 
                        mirroredX > 10 ? mirroredX : 10, 
                        y > 20 ? y - 10 : 20
                    );
                }
            });

            // Hiển thị trạng thái lên giao diện
            if (personDetected) {
                canvasCtx.fillStyle = '#00ff55';
                canvasCtx.font = 'bold 20px Arial';
                canvasCtx.fillText("Trạng thái: Đã phát hiện NGƯỜI", 20, 40);
            } else {
                canvasCtx.fillStyle = '#ff0055';
                canvasCtx.font = 'bold 20px Arial';
                canvasCtx.fillText("Trạng thái: Không có người", 20, 40);
            }

            canvasCtx.restore();

            // Lặp lại liên tục ở khung hình tiếp theo
            requestAnimationFrame(detectFrame);
        }

        // Khởi chạy chương trình
        async function main() {
            await setupCamera();
            videoElement.play();
            loadModel();
        }

        main();
    </script>
</body>
</html>
