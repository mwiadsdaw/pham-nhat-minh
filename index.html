<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards Tiếng Anh & Tiếng Việt - Unit 3: My Friends</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Flashcard Container */
        .card-container {
            perspective: 1000px;
            width: 100%;
            height: 260px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            border-radius: 16px;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            background: white;
            border: 2px solid #e0e0e0;
        }

        .card-front {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            border: none;
        }

        .card-back {
            background: #ffffff;
            color: #333;
            transform: rotateY(180deg);
            border: 2px solid #2575fc;
        }

        .word-type {
            font-size: 0.9rem;
            font-style: italic;
            opacity: 0.85;
            margin-top: 5px;
        }

        .word-main {
            font-size: 2rem;
            font-weight: bold;
            margin: 10px 0;
        }

        /* Buttons */
        .controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background-color: #2575fc;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            background-color: #1a5cd8;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-audio {
            background-color: #27ae60;
            margin-top: 10px;
            font-size: 0.9rem;
            padding: 8px 16px;
        }

        .btn-audio:hover {
            background-color: #219150;
        }

        .progress {
            font-size: 0.95rem;
            color: #666;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <h1>Unit 3: My Friends</h1>

    <div class="container">
        <div class="progress" id="progress">Thẻ 1 / 26</div>

        <div class="card-container" onclick="flipCard()">
            <div class="card" id="card">
                <!-- Mặt trước (Tiếng Anh) -->
                <div class="card-face card-front">
                    <div class="word-main" id="en-word">active</div>
                    <div class="word-type" id="en-type">(adj)</div>
                    <button class="btn-audio" onclick="speakText(event, 'en')">🔊 Đọc tiếng Anh</button>
                </div>
                <!-- Mặt sau (Tiếng Việt) -->
                <div class="card-face card-back">
                    <div class="word-main" id="vi-word">hăng hái, năng động</div>
                    <button class="btn-audio" onclick="speakText(event, 'vi')">🔊 Đọc tiếng Việt</button>
                </div>
            </div>
        </div>

        <div class="controls">
            <button onclick="prevCard()">❮ Trước</button>
            <button onclick="nextCard()">Sau ❯</button>
        </div>
    </div>

    <script>
        const flashcards = [
            { en: "active", type: "(adj)", vi: "hăng hái, năng động" },
            { en: "appearance", type: "(n)", vi: "dáng vẻ, ngoại hình" },
            { en: "barbecue", type: "(n)", vi: "món thịt nướng barbecue" },
            { en: "boring", type: "(adj)", vi: "buồn tẻ" },
            { en: "choir", type: "(n)", vi: "dàn đồng ca" },
            { en: "clap (one's hands)", type: "(v)", vi: "vỗ tay" },
            { en: "competition", type: "(n)", vi: "cuộc đua, cuộc thi" },
            { en: "confident", type: "(adj)", vi: "tự tin, tin tưởng" },
            { en: "curious", type: "(adj)", vi: "tò mò, thích tìm hiểu" },
            { en: "do the gardening", type: "(v.phr)", vi: "làm vườn" },
            { en: "firefighter", type: "(n)", vi: "lính chữa cháy, cứu hoả" },
            { en: "fireworks", type: "(n)", vi: "pháo hoa" },
            { en: "funny", type: "(adj)", vi: "buồn cười, thú vị" },
            { en: "generous", type: "(adj)", vi: "rộng rãi, hào phóng" },
            { en: "museum", type: "(n)", vi: "viện bảo tàng" },
            { en: "organise", type: "(v)", vi: "tổ chức" },
            { en: "patient", type: "(adj)", vi: "điềm tĩnh" },
            { en: "personality", type: "(n)", vi: "tính cách, tính tình" },
            { en: "prepare", type: "(v)", vi: "chuẩn bị" },
            { en: "racing", type: "(n)", vi: "cuộc đua" },
            { en: "reliable", type: "(adj)", vi: "đáng tin cậy" },
            { en: "serious", type: "(adj)", vi: "nghiêm túc" },
            { en: "shy", type: "(adj)", vi: "bút rứt, bẽn lẽn" },
            { en: "sporty", type: "(adj)", vi: "dáng thể thao, khỏe mạnh" },
            { en: "volunteer", type: "(n)", vi: "tình nguyện viên" },
            { en: "zodiac", type: "(n)", vi: "cung hoàng đạo" }
        ];

        let currentIndex = 0;
        const card = document.getElementById('card');
        const enWord = document.getElementById('en-word');
        const enType = document.getElementById('en-type');
        const viWord = document.getElementById('vi-word');
        const progress = document.getElementById('progress');

        function updateCard() {
            card.classList.remove('flipped');
            setTimeout(() => {
                const item = flashcards[currentIndex];
                enWord.textContent = item.en;
                enType.textContent = item.type;
                viWord.textContent = item.vi;
                progress.textContent = `Thẻ ${currentIndex + 1} / ${flashcards.length}`;
            }, 150);
        }

        function flipCard() {
            card.classList.toggle('flipped');
        }

        function nextCard() {
            if (currentIndex < flashcards.length - 1) {
                currentIndex++;
                updateCard();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        // Hàm phát âm hỗ trợ Tiếng Việt (vi-VN) và Tiếng Anh (en-US)
        function speakText(event, lang) {
            event.stopPropagation(); // Ngăn lật thẻ khi bấm nút loa

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Dừng âm thanh đang phát trước đó (nếu có)
                
                let text = lang === 'en' ? flashcards[currentIndex].en : flashcards[currentIndex].vi;
                let utterance = new SpeechSynthesisUtterance(text);
                
                utterance.lang = lang === 'en' ? 'en-US' : 'vi-VN';
                utterance.rate = 0.9; // Tốc độ đọc

                window.speechSynthesis.speak(utterance);
            } else {
                alert("Trình duyệt của bạn không hỗ trợ đọc tự động.");
            }
        }

        // Khởi tạo thẻ đầu tiên
        updateCard();
    </script>
</body>
</html>
