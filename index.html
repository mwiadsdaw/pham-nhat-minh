<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desert Base FPS Survival 3D</title>
  
  <!-- Font & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">

  <!-- Engine 3D Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Plus Jakarta Sans', sans-serif; }

    #game-container { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
    #fps-canvas { width: 100%; height: 100%; display: block; }

    /* Crosshair */
    .crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 14px; height: 14px; pointer-events: none; z-index: 20;
    }
    .crosshair::before, .crosshair::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.95); box-shadow: 0 0 2px #000; }
    .crosshair::before { top: 6px; left: 0; width: 14px; height: 2px; }
    .crosshair::after { top: 0; left: 6px; width: 2px; height: 14px; }

    /* HUD TOP LEFT: MINIMAP & KILL COUNTER */
    .hud-top-left {
      position: absolute; top: 20px; left: 20px; z-index: 20;
      display: flex; flex-direction: column; gap: 10px; pointer-events: none;
    }

    .kill-box {
      background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 4px 12px; border-radius: 4px; display: flex; align-items: center; gap: 10px; width: 130px;
    }
    .kill-icon { width: 22px; height: 22px; background: #475569; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: #fff; }
    .kill-text { font-family: 'Teko', sans-serif; font-size: 1.6rem; color: #fff; line-height: 1; }

    #minimap {
      width: 120px; height: 120px; background: rgba(20, 15, 10, 0.75);
      border: 2px solid rgba(255, 255, 255, 0.35); border-radius: 4px;
    }

    /* HUD TOP CENTER: WAVE TITLE */
    .hud-wave {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      font-family: 'Teko', sans-serif; font-size: 2.8rem; font-weight: 700;
      color: #fff; text-shadow: 0 0 12px rgba(0,0,0,0.9), 0 0 5px rgba(255,255,255,0.5);
      font-style: italic; letter-spacing: 2px; z-index: 20; pointer-events: none;
    }

    /* HUD TOP RIGHT: BUTTONS */
    .hud-top-right { position: absolute; top: 20px; right: 20px; z-index: 20; display: flex; gap: 8px; }
    .hud-btn {
      width: 40px; height: 40px; background: rgba(0,0,0,0.65); border: 1px solid rgba(255,255,255,0.3);
      color: #fff; border-radius: 4px; font-size: 1.1rem; display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }

    /* HUD BOTTOM CENTER: LOCK CURSOR TEXT */
    .hud-lock-text {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      font-size: 1.1rem; font-weight: 800; color: rgba(255, 255, 255, 0.9);
      font-style: italic; text-shadow: 0 2px 6px rgba(0,0,0,0.95); z-index: 20; pointer-events: none;
    }

    /* HUD BOTTOM LEFT: HEALTH BAR */
    .hud-bottom-left {
      position: absolute; bottom: 25px; left: 25px; z-index: 20; pointer-events: none;
      display: flex; align-items: flex-end; gap: 10px;
    }
    .hp-num { font-family: 'Teko', sans-serif; font-size: 1.8rem; color: #fff; line-height: 1; }
    .hp-bar-bg {
      width: 220px; height: 18px; background: rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.4);
      transform: skewX(-22deg); overflow: hidden; padding: 2px;
    }
    .hp-bar-fill {
      width: 100%; height: 100%; background: linear-gradient(90deg, #15803d, #4ade80);
      box-shadow: 0 0 10px #22c55e; transition: width 0.2s;
    }

    /* HUD BOTTOM RIGHT: AMMO */
    .hud-bottom-right {
      position: absolute; bottom: 25px; right: 25px; z-index: 20; pointer-events: none;
      background: rgba(0, 0, 0, 0.8); border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 4px 18px; border-radius: 4px; display: flex; align-items: center; gap: 12px;
    }
    .ammo-icon { font-size: 1.2rem; color: #f59e0b; }
    .ammo-num { font-family: 'Teko', sans-serif; font-size: 2.2rem; color: #fff; letter-spacing: 1px; line-height: 1; }

    /* DAY TIME SHOP OVERLAY */
    .shop-bar {
      position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255,255,255,0.25);
      padding: 10px 20px; border-radius: 12px; display: flex; gap: 12px; z-index: 22;
    }
    .shop-btn {
      background: rgba(255,255,255,0.08); border: 1px solid #38bdf8; color: #fff;
      padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 700; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }

    /* START OVERLAY */
    .overlay {
      position: absolute; inset: 0; background: rgba(3, 7, 18, 0.92);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 30; text-align: center; color: #fff;
    }
    .start-btn {
      background: linear-gradient(135deg, #38bdf8, #c084fc); color: #fff; border: none;
      padding: 16px 45px; font-size: 1.2rem; font-weight: 800; border-radius: 99px;
      cursor: pointer; box-shadow: 0 0 30px rgba(56, 189, 248, 0.5); margin-top: 20px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="crosshair"></div>

    <!-- 1. TOP LEFT -->
    <div class="hud-top-left">
      <div class="kill-box">
        <div class="kill-icon"><i class="fa-solid fa-user"></i></div>
        <div class="kill-text"><span id="kills">6</span> / <span id="total-zombies">10</span></div>
      </div>
      <canvas id="minimap" width="120" height="120"></canvas>
    </div>

    <!-- 2. TOP CENTER -->
    <div class="hud-wave" id="wave-text">WAVE 1</div>

    <!-- 3. TOP RIGHT -->
    <div class="hud-top-right">
      <button class="hud-btn"><i class="fa-solid fa-volume-high"></i></button>
      <button class="hud-btn"><i class="fa-solid fa-pause"></i></button>
    </div>

    <!-- 4. BOTTOM CENTER -->
    <div class="hud-lock-text">Press L to Lock and Unlock Cursor</div>

    <!-- 5. BOTTOM LEFT -->
    <div class="hud-bottom-left">
      <div class="hp-num"><span id="hp-val">100</span> %</div>
      <div class="hp-bar-bg">
        <div class="hp-bar-fill" id="hp-fill"></div>
      </div>
    </div>

    <!-- 6. BOTTOM RIGHT -->
    <div class="hud-bottom-right">
      <i class="fa-solid fa-fire ammo-icon"></i>
      <div class="ammo-num"><span id="clip">13</span> / <span id="reserve">970</span></div>
    </div>

    <!-- DAYTIME SHOP -->
    <div id="shop-bar" class="shop-bar">
      <button class="shop-btn" onclick="doMission()"><i class="fa-solid fa-coins" style="color:#f59e0b;"></i> NHIỆM VỤ (+50$)</button>
      <button class="shop-btn" onclick="upgradeGun()"><i class="fa-solid fa-gun" style="color:#38bdf8;"></i> NÂNG SÚNG (100$)</button>
      <button class="shop-btn" onclick="repairBase()"><i class="fa-solid fa-wrench" style="color:#22c55e;"></i> SỬA CĂN CỨ (40$)</button>
      <button class="shop-btn" onclick="startNightWave()" style="background:#ef4444; border:none;"><i class="fa-solid fa-moon"></i> VÀO BAN ĐÊM</button>
    </div>

    <div id="canvas-holder" style="width:100%; height:100%;"></div>

    <div id="start-overlay" class="overlay">
      <i class="fa-solid fa-crosshairs" style="font-size: 4rem; color: #38bdf8; margin-bottom: 15px;"></i>
      <h1 style="font-size: 2.5rem; font-family: 'Teko', sans-serif; letter-spacing: 2px;">DESERT BASE SURVIVAL 3D</h1>
      <p style="color: #94a3b8; max-width: 400px; margin-top: 5px;">Nhấn phím <b>L</b> trong khi chơi để Bật/Tắt Khóa Chuột xoay 360 độ!</p>
      <button class="start-btn" onclick="startGame()">BẮT ĐẦU VÀO TRẬN</button>
    </div>
  </div>

  <script>
    let scene, camera, renderer, gunGroup, muzzleFlash;
    let isGameRunning = false, isDayTime = true;
    let kills = 6, totalZombies = 10, wave = 1, hp = 100, clip = 13, reserve = 970, money = 100;
    let zombies = [], bullets = [], keys = {};
    let yaw = 0, pitch = 0;

    const minimapCanvas = document.getElementById('minimap');
    const miniCtx = minimapCanvas.getContext('2d');

    function updateHUD() {
      document.getElementById('kills').innerText = kills;
      document.getElementById('total-zombies').innerText = totalZombies;
      document.getElementById('wave-text').innerText = 'WAVE ' + wave;
      document.getElementById('hp-val').innerText = Math.max(0, Math.floor(hp));
      document.getElementById('hp-fill').style.width = Math.max(0, hp) + '%';
      document.getElementById('clip').innerText = clip;
      document.getElementById('reserve').innerText = reserve;
    }

    function init3D() {
      const holder = document.getElementById('canvas-holder');
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0xe0ab76, 0.018); // Màu cát sa mạc

      camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 2, 5);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      holder.appendChild(renderer.domElement);

      // Ánh sáng Sa mạc
      const ambientLight = new THREE.AmbientLight(0xffedd5, 1.2);
      scene.add(ambientLight);

      const sunLight = new THREE.DirectionalLight(0xfffaed, 2.0);
      sunLight.position.set(40, 60, 20);
      sunLight.castShadow = true;
      scene.add(sunLight);

      // Địa hình Sa Mạc Cát
      const groundGeo = new THREE.PlaneGeometry(200, 200, 32, 32);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.95 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      // Các Mỏm Đá Sa Mạc (Desert Rocks trong ảnh)
      for(let i = 0; i < 15; i++) {
        const rockGeo = new THREE.DodecahedronGeometry(2 + Math.random() * 4, 1);
        const rockMat = new THREE.MeshStandardMaterial({ color: 0xb45309, roughness: 0.8 });
        const rock = new THREE.Mesh(rockGeo, rockMat);
        rock.position.set((Math.random() - 0.5) * 120, 1, -10 - Math.random() * 80);
        scene.add(rock);
      }

      // Tường Căn Cứ Base Wall
      const wallGeo = new THREE.BoxGeometry(36, 5, 2);
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x475569 });
      const baseWall = new THREE.Mesh(wallGeo, wallMat);
      baseWall.position.set(0, 2.5, -4);
      scene.add(baseWall);

      // DỰNG MODEL KHẨU SÚNG 3D M4A1 NÓNG MÀU VÀNG NÂU CÓ KÍNH NGẮM (ĐÚNG NHƯ ẢNH MAU)
      gunGroup = new THREE.Group();

      // Thân súng
      const bodyGeo = new THREE.BoxGeometry(0.18, 0.28, 0.9);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd97706, metalness: 0.7 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);

      // Nòng súng
      const barrelGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.7, 12);
      barrelGeo.rotateX(Math.PI / 2);
      const barrelMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.9 });
      const barrel = new THREE.Mesh(barrelGeo, barrelMat);
      barrel.position.set(0, 0.05, -0.7);

      // Kính ngắm Holographic Red Dot
      const sightGeo = new THREE.BoxGeometry(0.14, 0.18, 0.22);
      const sightMat = new THREE.MeshStandardMaterial({ color: 0x0f172a });
      const sight = new THREE.Mesh(sightGeo, sightMat);
      sight.position.set(0, 0.22, -0.1);

      // Ánh sáng phát ra từ kính ngắm (như ảnh)
      const lightGeo = new THREE.SphereGeometry(0.06, 8, 8);
      const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const sightLight = new THREE.Mesh(lightGeo, lightMat);
      sightLight.position.set(0, 0.22, -0.15);

      // Muzzle Flash (Lửa đầu nòng)
      const flashGeo = new THREE.SphereGeometry(0.12, 8, 8);
      const flashMat = new THREE.MeshBasicMaterial({ color: 0xffea00, visible: false });
      muzzleFlash = new THREE.Mesh(flashGeo, flashMat);
      muzzleFlash.position.set(0, 0.05, -1.1);

      gunGroup.add(body, barrel, sight, sightLight, muzzleFlash);
      gunGroup.position.set(0.38, -0.32, -0.65);
      camera.add(gunGroup);
      scene.add(camera);

      // PHÍM L LOCK/UNLOCK CHUỘT
      window.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (e.code === 'KeyL' && isGameRunning) {
          if (document.pointerLockElement === holder) document.exitPointerLock();
          else holder.requestPointerLock();
        }
      });
      window.addEventListener('keyup', (e) => keys[e.code] = false);

      holder.addEventListener('click', () => { if (isGameRunning) holder.requestPointerLock(); });

      document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement === holder) {
          yaw -= e.movementX * 0.0022;
          pitch -= e.movementY * 0.0022;
          pitch = Math.max(-Math.PI / 2.3, Math.min(Math.PI / 2.3, pitch));
          camera.rotation.order = 'YXZ';
          camera.rotation.y = yaw; camera.rotation.x = pitch;
        }
      });

      holder.addEventListener('mousedown', (e) => {
        if (isGameRunning && e.button === 0 && clip > 0) {
          clip--; updateHUD();
          muzzleFlash.material.visible = true;
          setTimeout(() => muzzleFlash.material.visible = false, 40);

          // Tạo viên đạn
          const bulletGeo = new THREE.SphereGeometry(0.08, 8, 8);
          const bulletMat = new THREE.MeshBasicMaterial({ color: 0xfffb26 });
          const bullet = new THREE.Mesh(bulletGeo, bulletMat);
          bullet.position.copy(camera.position);
          bullet.userData = { dir: new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion) };
          scene.add(bullet); bullets.push(bullet);
        }
      });
    }

    function renderMinimap() {
      miniCtx.clearRect(0, 0, 120, 120);
      // Căn cứ
      miniCtx.fillStyle = '#38bdf8'; miniCtx.fillRect(40, 55, 40, 5);
      // Bạn (Hình nón xanh)
      const px = 60 + camera.position.x * 1.4;
      const pz = 60 + camera.position.z * 1.4;
      miniCtx.beginPath(); miniCtx.arc(px, pz, 4, 0, Math.PI * 2); miniCtx.fillStyle = '#22c55e'; miniCtx.fill();
      // Zombie (Chấm đỏ)
      zombies.forEach(z => {
        const zx = 60 + z.position.x * 1.4;
        const zz = 60 + z.position.z * 1.4;
        miniCtx.beginPath(); miniCtx.arc(zx, zz, 3, 0, Math.PI * 2); miniCtx.fillStyle = '#ef4444'; miniCtx.fill();
      });
    }

    function doMission() { if (isDayTime) { money += 50; updateHUD(); } }
    function upgradeGun() { if (isDayTime && money >= 100) { money -= 100; updateHUD(); } }
    function repairBase() { if (isDayTime && money >= 40) { money -= 40; hp = Math.min(100, hp + 30); updateHUD(); } }

    function startNightWave() {
      isDayTime = false;
      document.getElementById('shop-bar').style.display = 'none';
      scene.fog.color.setHex(0x0a0f1d);
      for(let i=0; i<totalZombies; i++) {
        setTimeout(() => {
          if (!isDayTime && isGameRunning) {
            const zGeo = new THREE.BoxGeometry(1.2, 2.2, 1.2);
            const zMat = new THREE.MeshStandardMaterial({ color: 0xef4444 });
            const zombie = new THREE.Mesh(zGeo, zMat);
            zombie.position.set((Math.random() - 0.5) * 30, 1.1, -50 - Math.random() * 20);
            zombie.userData = { hp: 60, speed: 0.06 };
            scene.add(zombie); zombies.push(zombie);
          }
        }, i * 800);
      }
    }

    function startGame() {
      document.getElementById('start-overlay').style.display = 'none';
      if (!scene) init3D();
      isGameRunning = true; updateHUD();
      animate();
    }

    function animate() {
      if (!isGameRunning) return;
      requestAnimationFrame(animate);

      // WASD Di chuyển
      const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
      const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
      if (keys['KeyW']) camera.position.addScaledVector(forward, 0.15);
      if (keys['KeyS']) camera.position.addScaledVector(forward, -0.15);
      if (keys['KeyA']) camera.position.addScaledVector(side, -0.15);
      if (keys['KeyD']) camera.position.addScaledVector(side, 0.15);

      camera.position.y = 2;
      camera.position.z = Math.max(-3, Math.min(25, camera.position.z));
      camera.position.x = Math.max(-15, Math.min(15, camera.position.x));

      // Đạn
      for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.position.addScaledVector(b.userData.dir, 1.4);
        if (b.position.distanceTo(camera.position) > 70) { scene.remove(b); bullets.splice(i, 1); }
      }

      // Zombie
      for (let i = zombies.length - 1; i >= 0; i--) {
        let z = zombies[i];
        z.position.z += z.userData.speed;

        for (let j = bullets.length - 1; j >= 0; j--) {
          let b = bullets[j];
          if (b.position.distanceTo(z.position) < 1.3) {
            z.userData.hp -= 35; scene.remove(b); bullets.splice(j, 1);
            if (z.userData.hp <= 0) {
              scene.remove(z); zombies.splice(i, 1);
              kills++; updateHUD();
              break;
            }
          }
        }

        if (z && z.position.z >= -5) {
          hp -= 0.1; updateHUD();
        }
      }

      renderMinimap();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
