<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A1 English Test - Week 1 Review</title>
    <style>
        :root {
            --primary-color: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-color: #1F2937;
            --text-muted: #6B7280;
            --border-color: #E5E7EB;
            --correct-color: #10B981;
            --correct-bg: #D1FAE5;
            --wrong-color: #EF4444;
            --wrong-bg: #FEE2E2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 90vh;
            justify-content: space-between;
        }

        header {
            background: var(--primary-color);
            color: white;
            padding: 20px 16px;
            text-align: center;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        header p {
            font-size: 0.85rem;
            opacity: 0.9;
            margin-top: 4px;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.3);
            margin-top: 12px;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 10%;
            background-color: #10B981;
            transition: width 0.3s ease;
        }

        .main-content {
            padding: 20px 16px;
            flex-grow: 1;
        }

        .question-card {
            display: none;
        }

        .question-card.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-number {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            width: 100%;
            padding: 14px 16px;
            background-color: #F9FAFB;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            text-align: left;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            font-weight: 500;
        }

        .option-btn:active {
            transform: scale(0.98);
        }

        .option-btn.selected {
            border-color: var(--primary-color);
            background-color: #EEF2FF;
            color: var(--primary-color);
        }

        .option-btn.correct {
            border-color: var(--correct-color);
            background-color: var(--correct-bg);
            color: #065F46;
        }

        .option-btn.wrong {
            border-color: var(--wrong-color);
            background-color: var(--wrong-bg);
            color: #991B1B;
        }

        .explanation {
            margin-top: 16px;
            padding: 12px 14px;
            background-color: #F3F4F6;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.4;
            color: #374151;
            display: none;
        }

        .explanation.show {
            display: block;
        }

        footer {
            padding: 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            gap: 12px;
            background: #FAFAFA;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
        }

        .btn-prev {
            background-color: #E5E7EB;
            color: #374151;
        }

        .btn-next {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-next:disabled {
            background-color: #9CA3AF;
            cursor: not-allowed;
        }

        /* Result Screen */
        .result-screen {
            display: none;
            text-align: center;
            padding: 20px 10px;
        }

        .result-screen.active {
            display: block;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
        }

        .score-circle .number {
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1;
        }

        .score-circle .label {
            font-size: 0.8rem;
            opacity: 0.8;
            margin-top: 4px;
        }

        .result-status {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .result-desc {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .btn-restart {
            background-color: var(--primary-color);
            color: white;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Destination A1 Test</h1>
        <p>Kiểm tra kiến thức Tuần 1 (Ngày 1–7)</p>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </header>

    <div class="main-content">
        <!-- Questions Container -->
        <div id="quiz-container">
            <!-- Question Cards will be generated by JS -->
        </div>

        <!-- Result Screen -->
        <div class="result-screen" id="result-screen">
            <div class="score-circle">
                <span class="number" id="score-text">0/10</span>
                <span class="label">Điểm số</span>
            </div>
            <div class="result-status" id="result-status">Đang tính kết quả...</div>
            <div class="result-desc" id="result-desc">...</div>
            <button class="btn btn-restart" onclick="restartQuiz()">Làm lại bài test</button>
        </div>
    </div>

    <footer id="footer-nav">
        <button class="btn btn-prev" id="btn-prev" onclick="changeQuestion(-1)">Trở lại</button>
        <button class="btn btn-next" id="btn-next" onclick="changeQuestion(1)">Tiếp theo</button>
    </footer>
</div>

<script>
const quizData = [
    {
        q: "She _______ a doctor. She works in a hospital.",
        options: ["am", "is", "are", "be"],
        correct: 1,
        explain: "Chủ ngữ 'She' đi với động từ To Be là 'is'."
    },
    {
        q: "This is my brother. _______ name is Nam.",
        options: ["He", "Him", "His", "Her"],
        correct: 2,
        explain: "Cần tính từ sở hữu 'His' đứng trước danh từ 'name' (His name = Tên của anh ấy)."
    },
    {
        q: "Every morning, My _______ coffee at 7 AM.",
        options: ["drink", "drinks", "drinking", "is drink"],
        correct: 1,
        explain: "Thì Hiện tại đơn, chủ ngữ số ít 'My' nên động từ phải thêm '-s' (drinks)."
    },
    {
        q: "They _______ like eating seafood because they are allergic.",
        options: ["don't", "doesn't", "isn't", "aren't"],
        correct: 0,
        explain: "Trợ động từ phủ định ở hiện tại đơn đi với chủ ngữ 'They' là 'don't'."
    },
    {
        q: "Where _______ your parents live?",
        options: ["is", "are", "do", "does"],
        correct: 2,
        explain: "Câu hỏi thì hiện tại đơn với động từ thường 'live', chủ ngữ số nhiều 'your parents' dùng trợ động từ 'do'."
    },
    {
        q: "Can I have _______ apple, please?",
        options: ["a", "an", "the", "không điền"],
        correct: 1,
        explain: "Mạo từ 'an' đứng trước danh từ bắt đầu bằng nguyên âm 'apple' (a, e, i, o, u)."
    },
    {
        q: "Lan has three _______ in her room.",
        options: ["cat", "cats", "cates", "caties"],
        correct: 1,
        explain: "Số đếm 'three' đi với danh từ số nhiều thêm '-s' (cats)."
    },
    {
        q: "_______ do you usually go to bed? – At 10:30 PM.",
        options: ["Where", "What time", "Who", "Why"],
        correct: 1,
        explain: "Hỏi về mốc thời gian / giờ giấc cụ thể ta dùng từ hỏi 'What time'."
    },
    {
        q: "Look at _______! She is singing very well.",
        options: ["she", "her", "his", "hers"],
        correct: 1,
        explain: "Đứng sau giới từ 'at' phải dùng đại từ tân ngữ 'her' (thay cho 'she')."
    },
    {
        q: "My brother _______ play video games on weekdays.",
        options: ["don't", "isn't", "doesn't", "not"],
        correct: 2,
        explain: "Phủ định thì hiện tại đơn với động từ thường 'play', chủ ngữ số ít 'My brother' dùng 'doesn't'."
    }
];

let currentQuestion = 0;
let userAnswers = new Array(quizData.length).fill(null);

const quizContainer = document.getElementById('quiz-container');
const progressBar = document.getElementById('progress-bar');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');
const resultScreen = document.getElementById('result-screen');
const footerNav = document.getElementById('footer-nav');

function renderQuiz() {
    quizContainer.innerHTML = '';
    quizData.forEach((data, index) => {
        const card = document.createElement('div');
        card.className = `question-card ${index === 0 ? 'active' : ''}`;
        card.id = `q-${index}`;

        let optionsHTML = '';
        data.options.forEach((opt, optIdx) => {
            optionsHTML += `
                <button class="option-btn" onclick="selectOption(${index}, ${optIdx})">
                    <span style="margin-right: 8px; font-weight: bold;">${String.fromCharCode(65 + optIdx)}.</span> ${opt}
                </button>
            `;
        });

        card.innerHTML = `
            <div class="question-number">Câu hỏi ${index + 1} / ${quizData.length}</div>
            <div class="question-text">${data.q}</div>
            <div class="options-list">${optionsHTML}</div>
            <div class="explanation" id="explain-${index}">
                <strong>Giải thích:</strong> ${data.explain}
            </div>
        `;

        quizContainer.appendChild(card);
    });
    updateNav();
}

function selectOption(qIdx, optIdx) {
    userAnswers[qIdx] = optIdx;
    const card = document.getElementById(`q-${qIdx}`);
    const options = card.querySelectorAll('.option-btn');
    const explainBox = document.getElementById(`explain-${qIdx}`);
    const correctIdx = quizData[qIdx].correct;

    options.forEach((btn, idx) => {
        btn.disabled = true; // Block change after selection for instant review
        if (idx === correctIdx) {
            btn.classList.add('correct');
        }
        if (idx === optIdx && optIdx !== correctIdx) {
            btn.classList.add('wrong');
        }
    });

    explainBox.classList.add('show');
    btnNext.disabled = false;
}

function changeQuestion(direction) {
    const cards = document.querySelectorAll('.question-card');
    cards[currentQuestion].classList.remove('active');

    currentQuestion += direction;

    if (currentQuestion >= quizData.length) {
        showResults();
        return;
    }

    cards[currentQuestion].classList.add('active');
    updateNav();
}

function updateNav() {
    progressBar.style.width = `${((currentQuestion + 1) / quizData.length) * 100}%`;
    btnPrev.style.visibility = currentQuestion === 0 ? 'hidden' : 'visible';

    if (currentQuestion === quizData.length - 1) {
        btnNext.textContent = 'Xem kết quả';
    } else {
        btnNext.textContent = 'Tiếp theo';
    }

    // Disable Next if not answered yet
    btnNext.disabled = userAnswers[currentQuestion] === null;
}

function showResults() {
    quizContainer.style.display = 'none';
    footerNav.style.display = 'none';
    resultScreen.classList.add('active');

    let score = 0;
    userAnswers.forEach((ans, idx) => {
        if (ans === quizData[idx].correct) score++;
    });

    document.getElementById('score-text').textContent = `${score}/${quizData.length}`;
    
    const statusEl = document.getElementById('result-status');
    const descEl = document.getElementById('result-desc');

    if (score >= 8) {
        statusEl.textContent = "ĐẠT (Pass Tuần 1)";
        statusEl.style.color = "var(--correct-color)";
        descEl.textContent = "Chúc mừng! Cô ấy đã nắm chắc kiến thức Tuần 1 và sẵn sàng chuyển sang học tiếp Tuần 2.";
    } else if (score >= 5) {
        statusEl.textContent = "CHƯA ĐẠT (Cần ôn lại)";
        statusEl.style.color = "#F59E0B";
        descEl.textContent = "Cô ấy đã hiểu một chút nhưng vẫn nhầm lẫn giữa To Be và Do/Does hoặc chia động từ. Nên ôn lại 1-2 ngày trước khi qua Tuần 2.";
    } else {
        statusEl.textContent = "MẤT GỐC (Weak)";
        statusEl.style.color = "var(--wrong-color)";
        descEl.textContent = "Kiến thức nền vẫn còn rất hổng. Bạn nên cho cô ấy giảng lại lý thuyết và làm lại bài test này lần nữa.";
    }
}

function restartQuiz() {
    currentQuestion = 0;
    userAnswers.fill(null);
    quizContainer.style.display = 'block';
    footerNav.style.display = 'flex';
    resultScreen.classList.remove('active');
    renderQuiz();
}

// Init
renderQuiz();
</script>
</body>
</html>
