<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài liệu Lập trình C++ & Python | Phạm Nhật Minh</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#111827',
                        accentCyan: '#06b6d4',
                        accentPurple: '#8b5cf6',
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
            color: #e2e8f0;
        }
        .font-code {
            font-family: 'Fira Code', monospace;
        }
        .glass-panel {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            color: white;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
        }
        @media print {
            .no-print { display: none !important; }
            body { background: white; color: black; }
        }
    </style>
</head>
<body class="min-h-screen py-10 px-4 sm:px-6 flex flex-col items-center">

    <!-- Top Action Bar -->
    <div class="no-print w-full max-w-4xl mb-6 flex justify-between items-center">
        <a href="/" class="text-sm font-medium text-slate-400 hover:text-cyan-400 transition-colors flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Quay lại Portfolio
        </a>
        <div class="flex gap-3">
            <button id="btn-open-modal" class="px-4 py-2 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-semibold text-xs transition flex items-center gap-2 shadow-lg cursor-pointer">
                <i class="fa-solid fa-plus"></i> Đăng bài giảng mới
            </button>
            <button onclick="window.print()" class="px-4 py-2 rounded-xl bg-gradient-to-r from-cyan-500 to-purple-600 text-white font-semibold text-xs shadow-lg shadow-cyan-500/20 hover:scale-105 transition-all flex items-center gap-2 cursor-pointer">
                <i class="fa-solid fa-file-pdf"></i> In / Xuất PDF
            </button>
        </div>
    </div>

    <!-- Main Container -->
    <main class="w-full max-w-4xl glass-panel rounded-3xl p-6 sm:p-10 shadow-2xl space-y-8">
        
        <!-- Header -->
        <div class="border-b border-slate-800 pb-6 mb-4 flex justify-between items-start">
            <div>
                <span class="px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-xs font-semibold uppercase tracking-wider">Hệ thống tài liệu</span>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-white mt-3 tracking-tight">Thư Viện Bài Giảng Lập Trình</h1>
                <p class="text-slate-400 text-xs mt-1">Biên soạn bởi: Phạm Nhật Minh | THPT Sóc Sơn</p>
            </div>
            <div class="hidden sm:block text-right text-xs text-slate-500 font-mono">
                Code Hub<br>v2.0.2026
            </div>
        </div>

        <!-- Tab Switcher (C++ vs Python) -->
        <div class="flex gap-3 bg-slate-900/80 p-2 rounded-2xl border border-slate-800">
            <button id="tab-cpp" class="tab-btn active flex-1 py-3 rounded-xl font-bold text-xs transition flex items-center justify-center gap-2 cursor-pointer">
                <i class="fa-solid fa-code"></i> Ngôn ngữ C++
            </button>
            <button id="tab-python" class="tab-btn flex-1 py-3 rounded-xl font-bold text-xs text-slate-400 hover:text-white transition flex items-center justify-center gap-2 cursor-pointer">
                <i class="fa-brands fa-python"></i> Ngôn ngữ Python
            </button>
        </div>

        <!-- Content Area -->
        <div id="lessons-container" class="space-y-4">
            <div class="text-center py-12 text-slate-500 italic text-xs">Đang tải danh sách bài giảng từ máy chủ...</div>
        </div>

    </main>

    <!-- Modal Tạo Bài Giảng Mới -->
    <div id="post-modal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-lg rounded-3xl p-6 sm:p-8 border border-slate-700 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-lg font-bold text-cyan-400 flex items-center gap-2">
                    <i class="fa-solid fa-pen-nib"></i> Tạo Bài Giảng Mới
                </h3>
                <button id="btn-close-modal" class="text-slate-400 hover:text-white text-lg cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="font-semibold text-slate-300 uppercase">Chọn chuyên mục:</label>
                    <select id="new-category" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-cyan-400">
                        <option value="cpp">C++ (Thuật toán & Cơ bản)</option>
                        <option value="python">Python (Scripting & Tự động hóa)</option>
                    </select>
                </div>
                <div>
                    <label class="font-semibold text-slate-300 uppercase">Tiêu đề bài giảng:</label>
                    <input type="text" id="new-title" placeholder="Ví dụ: Bài 4: Vòng lặp For trong C++..." class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-cyan-400">
                </div>
                <div>
                    <label class="font-semibold text-slate-300 uppercase">Nội dung lý thuyết:</label>
                    <textarea id="new-content" rows="4" placeholder="Nhập nội dung bài giảng..." class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-cyan-400 resize-none"></textarea>
                </div>
                <div>
                    <label class="font-semibold text-slate-300 uppercase">Đoạn mã mẫu (Code snippet):</label>
                    <textarea id="new-code" rows="4" placeholder="Nhập mã code minh họa..." class="font-code w-full mt-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-cyan-300 focus:outline-none focus:border-cyan-400 resize-none"></textarea>
                </div>
                <button id="btn-submit-post" class="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-purple-600 font-bold text-white shadow-lg mt-2 transition hover:opacity-90 cursor-pointer">Đăng Bài Giảng</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-12 text-center text-xs text-slate-500">
        <p>© 2026 Phạm Nhật Minh. All rights reserved.</p>
    </footer>

    <!-- Firebase & Script Xử lý An Toàn -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB100rlybpLzv5ax2otgGPzDJc1l5pASyo",
            authDomain: "minh-s-website.firebaseapp.com",
            projectId: "minh-s-website",
            storageBucket: "minh-s-website.appspot.com",
            messagingSenderId: "453574408938",
            appId: "1:453574408938:web:8e15469ca906fce7f3b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let activeLanguageTab = 'cpp';
        let cachedAllLectures = [];

        function switchLang(lang) {
            activeLanguageTab = lang;
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('active');
                b.classList.add('text-slate-400');
            });
            const activeBtn = document.getElementById(`tab-${lang}`);
            if(activeBtn) {
                activeBtn.classList.add('active');
                activeBtn.classList.remove('text-slate-400');
            }
            renderLecturesList();
        }

        function openModal() {
            document.getElementById('post-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('post-modal').classList.add('hidden');
        }

        // Gắn sự kiện lắng nghe trực tiếp thay vì phụ thuộc hàm global scope
        document.getElementById('tab-cpp').addEventListener('click', () => switchLang('cpp'));
        document.getElementById('tab-python').addEventListener('click', () => switchLang('python'));
        document.getElementById('btn-open-modal').addEventListener('click', openModal);
        document.getElementById('btn-close-modal').addEventListener('click', closeModal);

        function loadLecturesRealtime() {
            const q = query(collection(db, "lessons"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                cachedAllLectures = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderLecturesList();
            });
        }

        function renderLecturesList() {
            const container = document.getElementById('lessons-container');
            const filteredData = cachedAllLectures.filter(item => item.category === activeLanguageTab);

            if (filteredData.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-500 italic text-xs">Chưa có bài giảng nào thuộc chuyên mục này. Hãy bấm "Đăng bài giảng mới" để thêm!</div>`;
                return;
            }

            container.innerHTML = filteredData.map(item => `
                <details class="group bg-slate-900/80 border border-slate-800 rounded-2xl p-5 hover:border-slate-700 transition">
                    <summary class="flex justify-between items-center cursor-pointer select-none">
                        <div class="flex items-center gap-3">
                            <i class="fa-solid fa-book-open text-cyan-400"></i>
                            <span class="text-base font-bold text-white group-hover:text-cyan-300 transition">
                                ${item.title}
                            </span>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-[10px] bg-slate-800 text-slate-400 px-2.5 py-1 rounded-lg">
                                Đăng bởi: ${item.author || 'Phạm Nhật Minh'}
                            </span>
                            <i class="fa-solid fa-chevron-down text-slate-400 group-open:rotate-180 transition-transform duration-200"></i>
                        </div>
                    </summary>

                    <div class="mt-4 pt-4 border-t border-slate-800 space-y-4">
                        <p class="text-sm text-slate-300 leading-relaxed">${item.content}</p>
                        
                        ${item.codeSnippet ? `
                            <div class="bg-slate-950 border border-slate-800 p-3 rounded-xl">
                                <pre class="font-code text-xs text-cyan-300 overflow-x-auto">${item.codeSnippet}</pre>
                            </div>
                        ` : ''}

                        <div class="pt-2 flex justify-end">
                            <a href="/hoctap/baigiang.html?id=${item.id}" class="text-xs font-semibold text-purple-400 hover:underline flex items-center gap-1">
                                Xem chi tiết & Thảo luận <i class="fa-solid fa-arrow-right"></i>
                            </a>
                        </div>
                    </div>
                </details>
            `).join("");
        }

        async function createNewPost() {
            const category = document.getElementById('new-category').value;
            const title = document.getElementById('new-title').value.trim();
            const content = document.getElementById('new-content').value.trim();
            const codeSnippet = document.getElementById('new-code').value.trim();

            if(!title || !content) return alert("Vui lòng điền đầy đủ tiêu đề và nội dung bài giảng!");

            try {
                await addDoc(collection(db, "lessons"), {
                    category,
                    title,
                    content,
                    codeSnippet,
                    author: "Phạm Nhật Minh",
                    createdAt: serverTimestamp()
                });
                closeModal();
                document.getElementById('new-title').value = '';
                document.getElementById('new-content').value = '';
                document.getElementById('new-code').value = '';
                alert("Đăng bài giảng thành công!");
            } catch (e) {
                alert("Lỗi khi đăng bài: " + e.message);
            }
        }

        document.getElementById('btn-submit-post').addEventListener('click', createNewPost);

        loadLecturesRealtime();
    </script>
</body>
</html>
