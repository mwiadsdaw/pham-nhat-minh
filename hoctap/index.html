<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện Bài Giảng Lập Trình | Phạm Nhật Minh</title>
    <!-- FIX LỖI: Sửa lại link CDN Tailwind chuẩn -->
    <script src="https://tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { darkBg: '#0b0f19', cardBg: '#111827', accentCyan: '#06b6d4', accentPurple: '#8b5cf6' }
                }
            }
        }
    </script>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0b0f19; color: #e2e8f0; }
        .font-code { font-family: 'Fira Code', monospace; }
        .tab-btn.active { background: linear-gradient(135deg, #06b6d4, #8b5cf6); color: white; box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3); }
    </style>
</head>
<body class="min-h-screen py-10 px-4 flex flex-col items-center justify-between">

    <!-- Top Action Bar -->
    <div class="w-full max-w-4xl mb-6 flex justify-between items-center no-print">
        <a href="/" class="text-sm font-medium text-slate-400 hover:text-cyan-400 flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Quay lại Portfolio
        </a>
        <div class="flex gap-3">
            <button onclick="toggleModal(true)" class="px-4 py-2 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-semibold text-xs shadow-lg flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> Đăng bài giảng mới
            </button>
            <button onclick="window.print()" class="px-4 py-2 rounded-xl bg-gradient-to-r from-cyan-500 to-purple-600 text-white font-semibold text-xs shadow-lg flex items-center gap-2">
                <i class="fa-solid fa-file-pdf"></i> In PDF
            </button>
        </div>
    </div>

    <!-- Main Container -->
    <main class="w-full max-w-4xl bg-slate-900/85 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 sm:p-10 shadow-2xl space-y-8">
        <div class="border-b border-slate-800 pb-6 flex justify-between items-start">
            <div>
                <span class="px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-xs font-semibold uppercase tracking-wider">Hệ thống tài liệu</span>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-white mt-3 tracking-tight">Thư Viện Bài Giảng Lập Trình</h1>
                <p class="text-slate-400 text-xs mt-1">Biên soạn bởi: Phạm Nhật Minh | THPT Sóc Sơn</p>
            </div>
        </div>

        <!-- Tab Switcher -->
        <div class="flex gap-3 bg-slate-900/80 p-2 rounded-2xl border border-slate-800">
            <button onclick="switchLang('cpp')" id="tab-cpp" class="tab-btn active flex-1 py-3 rounded-xl font-bold text-xs flex items-center justify-center gap-2 transition">
                <i class="fa-solid fa-code"></i> Ngôn ngữ C++
            </button>
            <button onclick="switchLang('python')" id="tab-python" class="tab-btn flex-1 py-3 rounded-xl font-bold text-xs text-slate-400 hover:text-white flex items-center justify-center gap-2 transition">
                <i class="fa-brands fa-python"></i> Ngôn ngữ Python
            </button>
        </div>

        <!-- Content Area -->
        <div id="lessons-container" class="space-y-6">
            <div class="text-center py-12 text-slate-500 italic text-xs">Đang tải danh sách bài giảng từ máy chủ...</div>
        </div>
    </main>

    <!-- Modal Tạo Bài Giảng Mới -->
    <div id="post-modal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-3xl p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-lg font-bold text-cyan-400 flex items-center gap-2"><i class="fa-solid fa-pen-nib"></i> Tạo Bài Giảng Mới</h3>
                <button onclick="toggleModal(false)" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-3 text-xs">
                <select id="new-category" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white focus:outline-none">
                    <option value="cpp">C++ (Thuật toán & Cơ bản)</option>
                    <option value="python">Python (Scripting & Tự động hóa)</option>
                </select>
                <input type="text" id="new-title" placeholder="Tiêu đề bài giảng..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white focus:outline-none">
                <textarea id="new-content" rows="3" placeholder="Nội dung lý thuyết chi tiết..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white focus:outline-none resize-none"></textarea>
                <textarea id="new-code" rows="4" placeholder="Nhập đoạn mã code minh họa..." class="font-code w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-cyan-300 focus:outline-none resize-none"></textarea>
                <button id="submit-btn" class="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-purple-600 font-bold text-white shadow-lg transition hover:opacity-90">Đăng Bài Giảng</button>
            </div>
        </div>
    </div>

    <footer class="mt-12 text-center text-xs text-slate-500"><p>© 2026 Phạm Nhật Minh.</p></footer>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://gstatic.com";

        const firebaseConfig = {
            apiKey: "AIzaSyB100rlybpLzv5ax2otgGPzDJc1l5pASyo",
            authDomain: "://firebaseapp.com",
            projectId: "minh-s-website",
            storageBucket: "://appspot.com",
            messagingSenderId: "453574408938",
            appId: "1:453574408938:web:8e15469ca906fce7f3b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let activeTab = 'cpp', cachedLectures = [];

        function renderLectures() {
            const container = document.getElementById('lessons-container');
            container.innerHTML = '';
            const filtered = cachedLectures.filter(item => item.category === activeTab);

            if (!filtered.length) {
                container.innerHTML = '<div class="text-center py-12 text-slate-500 italic text-xs">Chưa có bài giảng nào.</div>';
                return;
            }

            filtered.forEach(item => {
                const color = activeTab === 'cpp' ? 'cyan' : 'amber';
                const firstLine = item.code ? item.code.split('\n')[0] : '';
                
                container.innerHTML += `
                    <div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-6 border-l-4 border-l-${color}-500 shadow-lg">
                        <div onclick="toggleDetail('${item.id}')" class="flex justify-between items-start cursor-pointer select-none">
                            <div>
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold border border-${color}-500/20 bg-${color}-500/10 text-${color}-400 uppercase">${activeTab}</span>
                                <h2 class="text-base font-bold text-white mt-2">${item.title}</h2>
                                <p class="font-code text-xs text-slate-500 mt-1">${firstLine}</p>
                            </div>
                            <i id="arrow-${item.id}" class="fa-solid fa-chevron-down text-xs text-slate-500 transition-transform duration-200"></i>
                        </div>
                        <div id="detail-${item.id}" class="hidden mt-4 pt-4 border-t border-slate-800/60 space-y-4">
                            <p class="text-xs text-slate-300 leading-relaxed">${item.content}</p>
                            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                <pre class="font-code text-xs text-${color}-300 whitespace-pre">${item.code}</pre>
                            </div>
                            <!-- Khung bình luận nằm gọn bên trong phần chi tiết -->
                            <div class="pt-2 border-t border-slate-800/40 space-y-3">
                                <span class="text-[10px] font-bold text-purple-400 uppercase"><i class="fa-solid fa-comments"></i> Bình luận</span>
                                <div class="bg-slate-950/40 p-2.5 rounded-lg border border-slate-800/60 text-[11px] text-slate-400">
                                    <span class="font-semibold text-cyan-400">Học sinh:</span> Bài này ẩn bình luận nhìn gọn gàng và dễ tập trung học hẳn thầy ơi!
                                </div>
                                <div class="flex gap-2">
                                    <input type="text" placeholder="Viết bình luận..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none">
                                    <button class="px-3 py-1.5 rounded-xl bg-purple-600 text-white text-xs font-bold whitespace-nowrap">Gửi</button>
                                </div>
                            </div>
                        </div>
                    </div>`;
            });
        }

        // Lắng nghe Realtime Firestore
