<body class="min-h-screen py-10 px-4 sm:px-6 flex flex-col items-center">

    <!-- Firebase & Script Xử lý -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Cấu hình kết nối Firebase dựa trên tài nguyên của bạn
        const firebaseConfig = {
            apiKey: "AIzaSyB100rlybpLzv5ax2otgGPzDJc1l5pASyo",
            authDomain: "minh-s-website.firebaseapp.com",
            projectId: "minh-s-website",
            storageBucket: "minh-s-website.appspot.com",
            messagingSenderId: "453574408938",
            appId: "1:453574408938:web:8e15469ca906fce7f3b"
        };

        // Khởi tạo các thực thể Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Biến toàn cục quản trị trạng thái ngôn ngữ lọc dữ liệu ngoài giao diện (mặc định: cpp)
        let activeLanguageTab = 'cpp';
        let cachedAllLectures = [];

        // Hàm vẽ danh sách bài giảng ra màn hình sau khi lọc chuyên mục
        function renderLecturesList() {
            const container = document.getElementById('lessons-container');
            container.innerHTML = '';

            // Tiến hành lọc bài viết theo tab ngôn ngữ đang mở
            const filteredData = cachedAllLectures.filter(item => item.category === activeLanguageTab);

            if (filteredData.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-500 italic text-xs">Chưa có bài giảng nào thuộc chuyên mục này.</div>`;
                return;
            }

            filteredData.forEach(item => {
                const accentColor = activeLanguageTab === 'cpp' ? 'border-l-cyan-500' : 'border-l-amber-500';
                const tagBadge = activeLanguageTab === 'cpp' ? 'bg-cyan-500/10 text-cyan-400 border-cyan-500/20' : 'bg-amber-500/10 text-amber-400 border-amber-500/20';
