<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện Bài Giảng Lập Trình | Phạm Nhật Minh</title>
    
    <!-- HỆ THỐNG STYLE NỘI BỘ LIÊN ĐỚI ĐỒNG BỘ CHỐNG VỠ KHUNG -->
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #e2e8f0;
            margin: 0;
            padding: 40px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 95vh;
        }
        .action-bar {
            width: 100%;
            max-width: 850px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .back-link {
            color: #94a3b8;
            font-size: 14px;
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .back-link:hover { color: #06b6d4; }
        .right-actions { display: flex; align-items: center; gap: 12px; }
        .btn-add {
            background-color: #8b5cf6;
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 12px;
            border: none;
            cursor: pointer;
        }
        .btn-add:hover { background-color: #7c3aed; }
        .account-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #1e293b;
            padding: 5px 12px;
            border-radius: 12px;
        }
        .btn-auth {
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            color: white;
            font-weight: 700;
            font-size: 11px;
            padding: 6px 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            text-decoration: none;
        }
        .avatar-img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #8b5cf6;
            background: #1e293b;
            color: #06b6d4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
        }
        .user-name { font-size: 12px; font-weight: 600; color: #e2e8f0; }
        .btn-logout {
            background: #1e293b;
            color: #f87171;
            font-size: 10px;
            font-weight: 700;
            border: 1px solid #334155;
            padding: 3px 6px;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 4px;
        }
        .btn-logout:hover { background: #334155; }
        .main-panel {
            width: 100%;
            max-width: 850px;
            background: rgba(17, 24, 39, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 32px;
            box-sizing: border-box;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .header-section {
            border-bottom: 1px solid #1e293b;
            padding-bottom: 24px;
            margin-bottom: 32px;
        }
        .badge {
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.3);
            color: #06b6d4;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        h1 { font-size: 28px; font-weight: 800; color: white; margin: 14px 0 6px 0; }
        .sub-txt { color: #94a3b8; font-size: 12px; margin: 0; }
        .tab-container {
            display: flex;
            gap: 12px;
            background: #0f172a;
            padding: 6px;
            border-radius: 16px;
            border: 1px solid #1e293b;
            margin-bottom: 32px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 12px;
            background: transparent;
            color: #94a3b8;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            color: white;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
        }
        .lesson-card {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            position: relative;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .card-title { font-size: 16px; font-weight: 700; color: white; margin: 0; }
        .card-summary { font-family: monospace; font-size: 12px; color: #64748b; margin: 4px 0 0 0; }
        .btn-delete-card {
            position: absolute;
            top: 24px;
            right: 24px;
            background: #ef4444;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 11px;
            display: none;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 8px;
        }
        .arrow-icon { color: #64748b; font-size: 12px; transition: transform 0.2s; margin-left: 12px; }
        .detail-block { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid #1e293b; }
        .desc-text { font-size: 14px; color: #cbd5e1; line-height: 1.6; }
        .code-box {
            background: #020617;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #1e293b;
            overflow-x: auto;
            margin: 16px 0;
        }
        pre { font-family: monospace; font-size: 13px; margin: 0; line-height: 1.5; color: #e2e8f0; }
        .comment-section { margin-top: 16px; padding-top: 16px; border-top: 1px solid #1e293b; }
        .comment-title { font-size: 11px; font-weight: 700; color: #c084fc; text-transform: uppercase; }
        .comment-area-list { margin-top: 8px; }
        .comment-box { background: rgba(2, 6, 23, 0.4); padding: 10px 14px; border-radius: 12px; border: 1px solid #1e293b; font-size: 12px; margin-bottom: 6px; }
        .comment-user { font-weight: 700; color: #06b6d4; margin-right: 4px; }
        .comment-input-group { display: flex; gap: 8px; margin-top: 12px; }
        .input-comment { flex: 1; background: #020617; border: 1px solid #1e293b; border-radius: 10px; padding: 8px 12px; color: white; font-size: 12px; }
        .btn-comment-send { background: #8b5cf6; color: white; border: none; padding: 0 16px; border-radius: 10px; font-size: 11px; font-weight: 700; cursor: pointer; }
        
        .modal-mask {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(4px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-box {
            background: #0f172a;
            border: 1px solid #1e293b;
            width: 100%;
            max-width: 500px;
            border-radius: 24px;
            padding: 24px;
            box-sizing: border-box;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .modal-title { font-size: 16px; font-weight: 700; color: #06b6d4; margin: 0; }
        .close-btn { background: transparent; border: none; color: #64748b; cursor: pointer; font-size: 24px; line-height: 1; }
        .form-group { margin-bottom: 12px; }
        .form-control {
            width: 100%;
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 10px;
            color: white;
            box-sizing: border-box;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <!-- Top Action Bar -->
    <div class="action-bar">
        <a href="/" class="back-link">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Quay lại Portfolio
        </a>
        <div class="right-actions">
            <button onclick="toggleModal(true)" class="btn-add">+ Đăng bài giảng mới</button>
            <div id="account-area" class="account-box">
                <button onclick="handleAuth()" id="auth-btn" class="btn-auth">Đăng nhập</button>
            </div>
        </div>
    </div>

    <!-- Main Panel -->
    <div class="main-panel">
        <div class="header-section">
            <span class="badge">Hệ thống tài liệu</span>
            <h1>Thư Viện Bài Giảng Lập Trình</h1>
            <p class="sub-txt">Biên soạn bởi: Ban quản trị khóa học | THPT Sóc Sơn</p>
        </div>

        <!-- Tab Switcher -->
        <div class="tab-container">
            <button onclick="switchLang('cpp')" id="tab-cpp" class="tab-btn active">Ngôn ngữ C++</button>
            <button onclick="switchLang('python')" id="tab-python" class="tab-btn">Ngôn ngữ Python</button>
        </div>

        <div id="lessons-container"></div>
    </div>

    <!-- Modal Form -->
    <div id="post-modal" class="modal-mask">
        <div class="modal-box">
            <div class="modal-header">
                <h3 class="modal-title">Tạo Bài Giảng Mới</h3>
