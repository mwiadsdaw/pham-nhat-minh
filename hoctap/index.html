<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện Bài Giảng Lập Trình | Phạm Nhật Minh</title>
    
    <!-- Nhúng thư viện Tailwind CSS chính thức -->
    <script src="https://tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { darkBg: '#0b0f19', cardBg: '#111827', accentCyan: '#06b6d4', accentPurple: '#8b5cf6' }
                }
            }
        }
    </script>
    
    <!-- Nhúng phông chữ và bộ icon đầy đủ -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #e2e8f0; }
        .font-code { font-family: 'Fira Code', monospace; }
        .glass-panel { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .tab-btn.active { background: linear-gradient(135deg, #06b6d4, #8b5cf6); color: white; box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3); }
    </style>
</head>
<body class="min-h-screen py-10 px-4 flex flex-col items-center justify-between">

    <!-- Top Action Bar -->
    <div class="w-full max-w-4xl mb-6 flex justify-between items-center">
        <a href="/" class="text-sm font-medium text-slate-400 hover:text-cyan-400 flex items-center gap-2 transition-colors">
            <i class="fa-solid fa-arrow-left"></i> Quay lại Portfolio
        </a>
        <div class="flex items-center gap-4">
            <button onclick="toggleModal(true)" class="px-4 py-2 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-semibold text-xs shadow-lg flex items-center gap-2 transition-all">
                <i class="fa-solid fa-plus"></i> Đăng bài giảng mới
            </button>
            <!-- Khối tài khoản tự động nhận diện từ trang chat -->
            <div id="account-area" class="flex items-center gap-2 border border-slate-800 bg-slate-950/60 p-1.5 pr-3 rounded-xl">
                <a href="/chat" class="px-3 py-1 rounded-lg bg-gradient-to-r from-cyan-500 to-blue-500 text-slate-950 font-bold text-xs shadow text-none decoration-none" style="text-decoration: none;">Đăng nhập</a>
            </div>
        </div>
    </div>

    <!-- Main Panel -->
    <main class="w-full max-w-4xl glass-panel rounded-3xl p-6 sm:p-10 shadow-2xl space-y-8">
        <div class="border-b border-slate-800 pb-6 flex justify-between items-start">
            <div>
                <span class="px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-xs font-semibold uppercase tracking-wider">Hệ thống tài liệu</span>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-white mt-3 tracking-tight">Thư Viện Bài Giảng Lập Trình</h1>
                <p class="text-slate-400 text-xs mt-1">Biên soạn bởi: Ban quản trị khóa học | THPT Sóc Sơn</p>
            </div>
            <div class="hidden sm:block text-right text-xs text-slate-500 font-mono">Code Hub<br>v2.2.2026</div>
        </div>

        <!-- Tab Switcher đầy đủ cả C++ và Python -->
        <div class="flex gap-3 bg-slate-900/80 p-2 rounded-2xl border border-slate-800">
            <button onclick="switchLang('cpp')" id="tab-cpp" class="tab-btn active flex-1 py-3 rounded-xl font-bold text-xs flex items-center justify-center gap-2 transition">
                <i class="fa-solid fa-code"></i> Ngôn ngữ C++
            </button>
            <button onclick="switchLang('python')" id="tab-python" class="tab-btn flex-1 py-3 rounded-xl font-bold text-xs text-slate-400 hover:text-white flex items-center justify-center gap-2 transition">
                <i class="fa-brands fa-python"></i> Ngôn ngữ Python
            </button>
        </div>

        <!-- Vùng hiển thị danh sách bài học -->
        <div id="lessons-container" class="space-y-6"></div>
    </main>

    <!-- Hộp thoại Modal Form tạo bài mới -->
    <div id="post-modal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-3xl p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-lg font-bold text-cyan-400 flex items-center gap-2"><i class="fa-solid fa-pen-nib"></i> Tạo Bài Giảng Mới</h3>
                <button onclick="toggleModal(false)" class="text-slate-400 hover:text-white text-xl bg-transparent border-none cursor-pointer">×</button>
            </div>
            <div class="space-y-3 text-xs">
                <select id="new-category" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white focus:outline-none">
                    <option value="cpp">C++ (Thuật toán & Cơ bản)</option>
                    <option value="python">Python (Scripting & Tự động hóa)</option>
                </select>
                <input type="text" id="new-title" placeholder="Tiêu đề bài giảng..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white focus:outline-none">
                <textarea id="new-content" rows="3" placeholder="Nội dung lý thuyết chi tiết..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white focus:outline-none resize-none"></textarea>
                <textarea id="new-code" rows="4" placeholder="Nhập đoạn mã code minh họa..." class="font-code w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-cyan-300 focus:outline-none resize-none"></textarea>
                <button onclick="createNewPost()" class="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-purple-600 font-bold text-white shadow-lg transition hover:opacity-90">Đăng Bài Giảng</button>
            </div>
        </div>
    </div>

    <footer class="mt-12 text-center text-xs text-slate-500"><p>© 2026 Phạm Nhật Minh.</p></footer>

    <!-- Khối kịch bản Javascript độc lập quản lý dữ liệu -->
    <script>
        const defaultData = [
            {
                id: "1",
                category: "cpp",
                title: "Bài 3: Câu lệnh điều kiện IF - ELSE trong C++",
                content: "Trong lập trình C++, câu lệnh điều kiện giúp chương trình đưa ra các quyết định rẽ nhánh dựa trên logic đúng/sai.",
                code: "#include <iostream>\nusing namespace std;\n\nint main() {\n    int score = 8.5;\n    if (score >= 8.0) {\n        cout << \"Học lực: Giỏi!\";\n    }\n    return 0;\n}",
                author: "Hệ thống lớp học",
                comments: [{ user: "Học sinh 10A2", text: "Giao diện bọc bình luận vào trong gọn gàng thật thầy ạ!" }]
            },
            {
                id: "2",
                category: "python",
                title: "Bài 3: Cấu trúc rẽ nhánh điều kiện trong Python",
                content: "Khác với C++, Python sử dụng dấu hai chấm (:) và quy tắc thụt lề (indentation) bắt buộc để phân tách khối lệnh.",
                code: "score = 8.5\nif score >= 8.0:\n    print('Học lực: Giỏi!')\nelse:\n    print('Học lực: Chưa đạt Giỏi.')",
                author: "Hệ thống lớp học",
                comments: [{ user: "Học sinh 10A2", text: "Python nhìn ngắn và dễ đọc hơn hẳn!" }]
            }
        ];

        let activeTab = 'cpp';
        let cachedLectures = JSON.parse(localStorage.getItem('minh_database')) || defaultData;
        let currentUser = JSON.parse(localStorage.getItem('shared_user')) || null;

        function syncUserUI() {
            const accountArea = document.getElementById('account-area');
            if (currentUser) {
                const displayName = currentUser.displayName || currentUser.name || "User";
                const shortName = displayName.split(' ').pop();
                accountArea.innerHTML = '<div class="w-6 h-6 rounded-full bg-purple-500/20 border border-purple-400 flex items-center justify-center text-[10px] font-bold text-purple-400">' + shortName.substring(0,2).toUpperCase() + '</div><span class="text-xs font-bold text-slate-200">' + shortName + '</span><button onclick="logOutAction()" class="text-[10px] bg-slate-800 text-red-400 font-bold px-1.5 py-0.5 rounded ml-2">Thoát</button>';
            } else {
                accountArea.innerHTML = '<a href="/chat" class="px-3 py-1 rounded-lg bg-gradient-to-r from-cyan-500 to-blue-500 text-slate-950 font-bold text-xs shadow" style="text-decoration:none; color:#0f172a;">Đăng nhập</a>';
            }
            renderLectures();
        }

        function logOutAction() {
            currentUser = null;
            localStorage.removeItem('shared_user');
            syncUserUI();
        }

        function renderLectures() {
            const container = document.getElementById('lessons-container');
            container.innerHTML = '';
            const filtered = cachedLectures.filter(item => item.category === activeTab);

            if (filtered.length === 0) {
                container.innerHTML = '<div class="text-center py-12 text-slate-500 italic text-xs">Chưa có bài giảng nào thuộc mục này.</div>';
                return;
            }

            filtered.forEach(item => {
                const color = activeTab === 'cpp' ? 'cyan' : 'amber';
                const colorHex = activeTab === 'cpp' ? '#06b6d4' : '#f59e0b';
                const firstLine = item.code ? item.code.split('\n')[0] : '';
                
                let commentsHtml = '';
                if (item.comments) {
                    item.comments.forEach(c => {
