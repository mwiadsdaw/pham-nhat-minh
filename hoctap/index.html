<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện Bài Giảng Lập Trình | Phạm Nhật Minh</title>
    
    <!-- Nhúng thư viện Tailwind CSS chính thức đầy đủ đường dẫn -->
    <script src="https://tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#111827',
                        accentCyan: '#06b6d4',
                        accentPurple: '#8b5cf6',
                    }
                }
            }
        }
    </script>
    
    <!-- Nhúng Google Fonts và FontAwesome Icons gốc -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
            color: #e2e8f0;
        }
        .font-code {
            font-family: 'Fira Code', monospace;
        }
        .glass-panel {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            color: white;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.25s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen py-10 px-4 sm:px-6 flex flex-col items-center">

    <!-- Top Action Bar (Đã gỡ bỏ vĩnh viễn nút In / Xuất PDF) -->
    <div class="w-full max-w-4xl mb-6 flex justify-between items-center">
        <a href="/" class="text-sm font-medium text-slate-400 hover:text-cyan-400 transition-colors flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Quay lại Portfolio
        </a>
        <div class="flex items-center gap-4">
            <button onclick="toggleModal(true)" class="px-4 py-2 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-semibold text-xs transition flex items-center gap-2 shadow-lg">
                <i class="fa-solid fa-plus"></i> Đăng bài giảng mới
            </button>
            <!-- Khối cầu nối tài khoản dùng chung kết nối với phòng Chat -->
            <div id="account-area" class="flex items-center gap-2 border border-slate-800 bg-slate-950/60 p-1.5 pr-3 rounded-xl">
                <a href="/chat" class="px-3 py-1 rounded-lg bg-gradient-to-r from-cyan-500 to-blue-500 text-slate-950 font-bold text-xs shadow" style="text-decoration: none;">Đăng nhập</a>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <main class="w-full max-w-4xl glass-panel rounded-3xl p-6 sm:p-10 shadow-2xl space-y-8">
        
        <!-- Header -->
        <div class="border-b border-slate-800 pb-6 flex justify-between items-start">
            <div>
                <span class="px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-xs font-semibold uppercase tracking-wider">Hệ thống tài liệu</span>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-white mt-3 tracking-tight">Thư Viện Bài Giảng Lập Trình</h1>
                <p class="text-slate-400 text-xs mt-1">Biên soạn bởi: Ban quản trị khóa học | THPT Sóc Sơn</p>
            </div>
            <div class="hidden sm:block text-right text-xs text-slate-500 font-mono">Code Hub<br>v2.2.2026</div>
        </div>

        <!-- Tab Switcher (C++ vs Python hoạt động mượt mà) -->
        <div class="flex gap-3 bg-slate-900/80 p-2 rounded-2xl border border-slate-800">
            <button onclick="switchLang('cpp')" id="tab-cpp" class="tab-btn active flex-1 py-3 rounded-xl font-bold text-xs transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-code"></i> Ngôn ngữ C++
            </button>
            <button onclick="switchLang('python')" id="tab-python" class="tab-btn flex-1 py-3 rounded-xl font-bold text-xs text-slate-400 hover:text-white transition flex items-center justify-center gap-2">
                <i class="fa-brands fa-python"></i> Ngôn ngữ Python
            </button>
        </div>

        <!-- Content Area -->
        <div id="lessons-container" class="space-y-6"></div>

    </main>

    <!-- Modal Tạo Bài Giảng Mới -->
    <div id="post-modal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-3xl p-6 sm:p-8 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-lg font-bold text-cyan-400 flex items-center gap-2">
                    <i class="fa-solid fa-pen-nib"></i> Tạo Bài Giảng Mới
                </h3>
                <button onclick="toggleModal(false)" class="text-slate-400 hover:text-white text-xl bg-transparent border-none cursor-pointer">×</button>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="font-semibold text-slate-300 uppercase">Chọn chuyên mục:</label>
                    <select id="new-category" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white focus:outline-none">
                        <option value="cpp">C++ (Thuật toán & Cơ bản)</option>
                        <option value="python">Python (Scripting & Tự động hóa)</option>
                    </select>
                </div>
                <div>
                    <label class="font-semibold text-slate-300 uppercase">Tiêu đề bài giảng:</label>
                    <input type="text" id="new-title" placeholder="Ví dụ: Bài 4: Vòng lặp For trong C++..." class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white focus:outline-none">
                </div>
                <div>
                    <label class="font-semibold text-slate-300 uppercase">Nội dung lý thuyết:</label>
                    <textarea id="new-content" rows="3" placeholder="Nhập nội dung lý thuyết chi tiết..." class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white focus:outline-none resize-none"></textarea>
                </div>
                <div>
                    <label class="font-semibold text-slate-300 uppercase">Đoạn mã mẫu (Code snippet):</label>
                    <textarea id="new-code" rows="4" placeholder="Nhập đoạn mã code minh họa..." class="font-code w-full mt-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-cyan-300 focus:outline-none resize-none"></textarea>
                </div>
                <button onclick="createNewPost()" class="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-purple-600 font-bold text-white shadow-lg mt-2 transition hover:opacity-90">Đăng Bài Giảng</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-12 text-center text-xs text-slate-500">
        <p>© 2026 Phạm Nhật Minh. THPT Sóc Sơn.</p>
    </footer>

    <!-- Hệ thống tập lệnh điều phối đồng bộ -->
    <script>
        // Kho bài học mẫu ban đầu ổn định hệ thống
        const defaultData = [
            {
                id: "1", category: "cpp",
                title: "Bài 3: Câu lệnh điều kiện IF - ELSE trong C++",
                content: "Trong lập trình C++, câu lệnh điều kiện giúp chương trình đưa ra các quyết định rẽ nhánh dựa trên logic đúng/sai (true hoặc false). C++ sử dụng cặp dấu ngoặc nhọn { } để bao bọc khối lệnh.",
                code: "#include <iostream>\nusing namespace std;\n\nint main() {\n    int score = 8.5;\n    if (score >= 8.0) {\n        cout << \"Học lực: Giỏi!\";\n    } else {\n        cout << \"Học lực: Khá\";\n    }\n    return 0;\n}",
                author: "Hệ thống lớp học",
                comments: [{ user: "Học sinh 10A2", text: "Bắc cầu tài khoản chung tiện lợi quá thầy Minh ơi!" }]
            },
            {
                id: "2", category: "python",
                title: "Bài 3: Cấu trúc rẽ nhánh điều kiện trong Python",
                content: "Khác với C++, Python không sử dụng dấu ngoặc nhọn hay dấu chấm phẩy, thay vào đó ngôi nhà này sử dụng dấu hai chấm (:) và quy tắc thụt lề (indentation) bắt buộc để phân tách khối lệnh.",
                code: "score = 8.5\n\nif score >= 8.0:\n    print('Học lực: Giỏi!')\nelse:\n    print('Học lực: Khá hoặc Trung bình.')",
                author: "Hệ thống lớp học",
                comments: [{ user: "Học sinh 10A2", text: "Bên Python nhìn gọn gàng dễ hiểu ghê!" }]
            }
        ];

        let activeTab = 'cpp';
        let cachedLectures = JSON.parse(localStorage.getItem('minh_database')) || defaultData;
        
        // Đọc thông tin cầu nối tài khoản dùng chung được bắc ngang từ trang phòng Chat sang
        let currentUser = JSON.parse(localStorage.getItem('shared_user')) || null;

        function syncUserUI() {
            const accountArea = document.getElementById('account-area');
            if (currentUser) {
                const displayName = currentUser.displayName || currentUser.name || "User Lớp Học";
                const shortName = displayName.split(' ').pop();

                if (currentUser.photoURL && currentUser.photoURL.includes('http')) {
