<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện Bài Giảng Lập Trình | Phạm Nhật Minh</title>
    
    <!-- SỬA LỖI CHI MẠNG: Sử dụng CSS nội bộ để vẽ giao diện, không phụ thuộc vào link Tailwind online -->
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #e2e8f0;
            margin: 0;
            padding: 40px 16px;
            display: flex;
            flex-col: column;
            flex-direction: column;
            align-items: center;
            min-height: 90vh;
        }
        .action-bar {
            width: 100%;
            max-width: 850px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .back-link {
            color: #94a3b8;
            font-size: 14px;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover { color: #06b6d4; }
        .btn-add {
            background-color: #8b5cf6;
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-add:hover { background-color: #7c3aed; }
        .main-panel {
            width: 100%;
            max-width: 850px;
            background: rgba(17, 24, 39, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 32px;
            box-sizing: border-box;
        }
        .header-section {
            border-b: 1px solid #1e293b;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 24px;
            margin-bottom: 32px;
        }
        .badge {
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.3);
            color: #06b6d4;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        h1 { font-size: 28px; font-weight: 800; color: white; margin: 12px 0 4px 0; }
        .sub-txt { color: #94a3b8; font-size: 12px; margin: 0; }
        .tab-container {
            display: flex;
            gap: 12px;
            background: #0f172a;
            padding: 8px;
            border-radius: 16px;
            border: 1px solid #1e293b;
            margin-bottom: 32px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 12px;
            background: transparent;
            color: #94a3b8;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn:hover { color: white; }
        .tab-btn.active {
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            color: white;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
        }
        .lesson-card {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            border-left: 4px solid #06b6d4;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .card-title { font-size: 16px; font-weight: 700; color: white; margin: 0; }
        .card-summary { font-family: monospace; font-size: 12px; color: #64748b; margin: 4px 0 0 0; }
        .detail-block { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid #1e293b; }
        .desc-text { font-size: 14px; color: #cbd5e1; line-height: 1.6; }
        .code-box {
            background: #020617;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #1e293b;
            overflow-x: auto;
            margin: 16px 0;
        }
        pre { font-family: monospace; font-size: 13px; color: #22d3ee; margin: 0; }
        .comment-section { margin-top: 16px; padding-top: 16px; border-top: 1px solid #1e293b; }
        .comment-title { font-size: 11px; font-weight: 700; color: #c084fc; text-transform: uppercase; }
        .comment-box { background: rgba(2, 6, 23, 0.4); pading: 12px; padding: 12px; border-radius: 12px; border: 1px solid #1e293b; font-size: 12px; margin-top: 8px; }
        
        /* Modal Style */
        .modal-mask {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-box {
            background: #0f172a;
            border: 1px solid #1e293b;
            width: 100%;
            max-width: 500px;
            border-radius: 24px;
            padding: 24px;
            box-sizing: border-box;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .modal-title { font-size: 16px; font-weight: 700; color: #06b6d4; margin: 0; }
        .close-btn { background: transparent; border: none; color: #64748b; cursor: pointer; font-size: 20px; }
        .form-group { margin-bottom: 12px; }
        .form-control {
            width: 100%;
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 10px;
            color: white;
            box-sizing: border-box;
            font-size: 13px;
        }
        .form-control:focus { outline: none; border-color: #8b5cf6; }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            color: white;
            font-weight: 700;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <!-- Top Action Bar -->
    <div class="action-bar">
        <a href="/" class="back-link">← Quay lại Portfolio</a>
        <button onclick="toggleModal(true)" class="btn-add">+ Đăng bài giảng mới</button>
    </div>

    <!-- Main Panel -->
    <div class="main-panel">
        <div class="header-section">
            <span class="badge">Hệ thống tài liệu</span>
            <h1>Thư Viện Bài Giảng Lập Trình</h1>
            <p class="sub-txt">Biên soạn bởi: Phạm Nhật Minh | THPT Sóc Sơn</p>
        </div>

        <!-- Tab Switcher -->
        <div class="tab-container">
            <button onclick="switchLang('cpp')" id="tab-cpp" class="tab-btn active">Ngôn ngữ C++</button>
            <button onclick="switchLang('python')" id="tab-python" class="tab-btn">Ngôn ngữ Python</button>
        </div>

        <!-- Content Area -->
        <div id="lessons-container">
            <!-- Render bài giảng ảo cục bộ bằng JS để tránh sập link -->
        </div>
    </div>

    <!-- Modal Form -->
    <div id="post-modal" class="modal-mask">
        <div class="modal-box">
            <div class="modal-header">
                <h3 class="modal-title">Tạo Bài Giảng Mới</h3>
                <button onclick="toggleModal(false)" class="close-btn">×</button>
            </div>
            <div class="form-group">
                <select id="new-category" class="form-control">
                    <option value="cpp">C++ (Thuật toán & Cơ bản)</option>
                    <option value="python">Python (Scripting & Tự động hóa)</option>
                </select>
            </div>
            <div class="form-group">
                <input type="text" id="new-title" placeholder="Tiêu đề bài giảng..." class="form-control">
            </div>
            <div class="form-group">
                <textarea id="new-content" rows="3" placeholder="Nội dung lý thuyết chi tiết..." class="form-control" style="resize:none;"></textarea>
            </div>
            <div class="form-group">
                <textarea id="new-code" rows="4" placeholder="Nhập đoạn mã code minh họa..." class="form-control font-code" style="resize:none; color:#22d3ee;"></textarea>
            </div>
            <button onclick="createNewPost()" class="btn-submit">Đăng Bài Giảng</button>
        </div>
    </div>

    <!-- JavaScript thuần xử lý dữ liệu và tương tác lưu trữ bền vững (Local Storage) -->
    <script>
        // Cơ sở dữ liệu mặc định ban đầu bảo vệ hệ thống không bị treo
        const defaultData = [
            {
                id: "1",
                category: "cpp",
                title: "Bài 3: Câu lệnh điều kiện IF - ELSE trong C++",
                content: "Trong lập trình C++, câu lệnh điều kiện giúp chương trình đưa ra các quyết định rẽ nhánh dựa trên logic đúng/sai (true hoặc false). C++ sử dụng cặp dấu ngoặc nhọn { } để bao bọc khối lệnh.",
                code: "#include <iostream>\nusing namespace std;\n\nint main() {\n    int score = 8.5;\n    if (score >= 8.0) {\n        cout << \"Học lực: Giỏi!\";\n    } else {\n        cout << \"Học lực: Khá\";\n    }\n    return 0;\n}"
            },
            {
                id: "2",
                category: "python",
                title: "Bài 3: Cấu trúc rẽ nhánh điều kiện trong Python",
                content: "Khác với C++, Python không sử dụng dấu ngoặc nhọn hay dấu chấm phẩy, thay vào đó ngôn ngữ này sử dụng dấu hai chấm (:) và quy tắc thụt lề (indentation) bắt buộc để phân tách khối lệnh.",
