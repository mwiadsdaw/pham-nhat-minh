<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài liệu Lập trình C++ & Python | Phạm Nhật Minh</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#111827',
                        accentCyan: '#06b6d4',
                        accentPurple: '#8b5cf6',
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
            color: #e2e8f0;
        }
        .font-code {
            font-family: 'Fira Code', monospace;
        }
        .glass-panel {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            color: white;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
        }
        @media print {
            .no-print { display: none !important; }
            body { background: white; color: black; }
        }
    </style>
</head>
<body class="min-h-screen py-10 px-4 sm:px-6 flex flex-col items-center">

    <!-- Top Action Bar -->
    <div class="no-print w-full max-w-4xl mb-6 flex justify-between items-center">
        <a href="/" class="text-sm font-medium text-slate-400 hover:text-cyan-400 transition-colors flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Quay lại Portfolio
        </a>
        <div class="flex gap-3">
            <button onclick="openModal()" class="px-4 py-2 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-semibold text-xs transition flex items-center gap-2 shadow-lg">
                <i class="fa-solid fa-plus"></i> Đăng bài giảng mới
            </button>
            <button onclick="window.print()" class="px-4 py-2 rounded-xl bg-gradient-to-r from-cyan-500 to-purple-600 text-white font-semibold text-xs shadow-lg shadow-cyan-500/20 hover:scale-105 transition-all flex items-center gap-2">
                <i class="fa-solid fa-file-pdf"></i> In / Xuất PDF
            </button>
        </div>
    </div>

    <!-- Main Container -->
    <main class="w-full max-w-4xl glass-panel rounded-3xl p-6 sm:p-10 shadow-2xl space-y-8">
        
        <!-- Header -->
        <div class="border-b border-slate-800 pb-6 flex justify-between items-start">
            <div>
                <span class="px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-xs font-semibold uppercase tracking-wider">Hệ thống tài liệu</span>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-white mt-3 tracking-tight">Thư Viện Bài Giảng Lập Trình</h1>
                <p class="text-slate-400 text-xs mt-1">Biên soạn bởi: Phạm Nhật Minh | THPT Sóc Sơn</p>
            </div>
            <div class="hidden sm:block text-right text-xs text-slate-500 font-mono">
                Code Hub<br>v2.0.2026
            </div>
        </div>

        <!-- Tab Switcher (C++ vs Python) -->
        <div class="flex gap-3 bg-slate-900/80 p-2 rounded-2xl border border-slate-800">
            <button onclick="switchLang('cpp')" id="tab-cpp" class="tab-btn active flex-1 py-3 rounded-xl font-bold text-xs transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-code"></i> Ngôn ngữ C++
            </button>
            <button onclick="switchLang('python')" id="tab-python" class="tab-btn flex-1 py-3 rounded-xl font-bold text-xs text-slate-400 hover:text-white transition flex items-center justify-center gap-2">
                <i class="fa-brands fa-python"></i> Ngôn ngữ Python
            </button>
        </div>

        <!-- Content Area -->
        <div id="lessons-container" class="space-y-6">
            <!-- Dữ liệu bài giảng sẽ được load tự động từ Firebase ở đây -->
            <div class="text-center py-12 text-slate-500 italic text-xs">Đang tải danh sách bài giảng...</div>
        </div>

    </main>

    <!-- Modal Tạo Bài Giảng Mới -->
    <div id="post-modal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-lg rounded-3xl p-6 sm:p-8 border border-slate-700 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-lg font-bold text-cyan-400 flex items-center gap-2">
                    <i class="fa-solid fa-pen-nib"></i> Tạo Bài Giảng Mới
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="font-semibold text-slate-300 uppercase">Chọn chuyên mục:</label>
                    <select id="new-category" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-cyan-400">
                        <option value="cpp">C++ (Thuật toán & Cơ bản)</option>
                        <option value="python">Python (Scripting & Tự động hóa)</option>
                    </select>
                </div>
                <div>
                    <label class="font-semibold text-slate-300 uppercase">Tiêu đề bài giảng:</label>
                    <input type="text" id="new-title" placeholder="Ví dụ: Bài 4: Vòng lặp For trong C++..." class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-cyan-400">
                </div>
                <div>
                    <label class="font-semibold text-slate-300 uppercase">Nội dung lý thuyết:</label>
                    <textarea id="new-content" rows="4" placeholder="Nhập nội dung bài giảng..." class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-cyan-400 resize-none"></textarea>
                </div>
                <div>
                    <label class="font-semibold text-slate-300 uppercase">Đoạn mã mẫu (Code snippet):</label>
                    <textarea id="new-code" rows="4" placeholder="#include <iostream>..." class="font-code w-full mt-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-cyan-300 focus:outline-none focus:border-cyan-400 resize-none"></textarea>
                </div>
                <button onclick="createNewPost()" class="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-purple-600 font-bold text-white shadow-lg mt-2 transition hover:opacity-90">Đăng Bài Giảng</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-12 text-center text-xs text-slate-500">
        <p>© 2026 Phạm Nhật Minh. All rights reserved.</p>
    </footer>

    <!-- Firebase & Script Xử lý -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB100rlybpLzv5ax2otgGPzDJc1l5pASyo",
            authDomain: "minh-s-website.firebaseapp.com",
            projectId: "minh-s-website",
            storageBucket: "minh-s-website.appspot.com",
            messagingSenderId: "453574408938",
            appId: "1:453574408938:web:f5b017647a17deacfc3593"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentLang = 'cpp';
        let allLessons = [];

        window.switchLang = (lang) => {
            currentLang = lang;
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('active');
                b.classList.add('text-slate-400');
            });
            const activeBtn = document.getElementById(`tab-${lang}`);
            activeBtn.classList.add('active');
            activeBtn.classList.remove('text-slate-400');
            renderLessons();
        };

        window.openModal = () => document.getElementById('post-modal').classList.remove('hidden');
        window.closeModal = () => document.getElementById('post-modal').classList.add('hidden');

        // Lắng nghe dữ liệu bài giảng real-time từ Firestore
        function loadLessons() {
            const q = query(collection(db, "lessons"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                allLessons = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderLessons();
            });
        }

        function renderLessons() {
            const container = document.getElementById('lessons-container');
            const filtered = allLessons.filter(l => l.category === currentLang);

            if(filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-500 italic text-xs">Chưa có bài giảng nào trong mục này. Hãy bấm "Đăng bài giảng mới" để thêm!</div>`;
                return;
            }

            container.innerHTML = filtered.map(lesson => `
                <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 space-y-4">
                    <div class="flex justify-between items-start">
                        <h2 class="text-lg font-bold text-cyan-400 flex items-center gap-2">
                            <i class="fa-solid fa-book-open"></i> ${lesson.title}
                        </h2>
                        <span class="text-[10px] bg-slate-800 text-slate-400 px-2.5 py-1 rounded-lg">Đăng bởi: ${lesson.author || 'Phạm Nhật Minh'}</span>
                    </div>
                    <p class="text-sm text-slate-300 leading-relaxed">${lesson.content}</p>
                    
                    ${lesson.codeSnippet ? `
                        <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl">
                            <pre class="font-code text-xs text-cyan-300 overflow-x-auto">${lesson.codeSnippet}</pre>
                        </div>
                    ` : ''}

                    <!-- Phần bình luận cho mỗi bài giảng -->
                    <div class="pt-4 border-t border-slate-800/80 space-y-3">
                        <h4 class="text-xs font-bold text-purple-400 uppercase tracking-wider"><i class="fa-solid fa-comments mr-1"></i> Bình luận bài giảng</h4>
                        <div id="comments-${lesson.id}" class="space-y-2 max-h-40 overflow-y-auto pr-1">
                            <!-- Các bình luận load ở đây -->
                        </div>
                        <div class="flex gap-2 pt-1">
                            <input type="text" id="comment-input-${lesson.id}" placeholder="Viết bình luận của bạn..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-400">
                            <button onclick="addComment('${lesson.id}')" class="bg-cyan-600 hover:bg-cyan-500 px-4 py-2 rounded-xl text-xs font-bold transition">Gửi</button>
                        </div>
                    </div>
                </div>
            `).join("");

            // Load bình luận cho từng bài giảng
            filtered.forEach(lesson => loadComments(lesson.id));
        }

        // Tạo bài giảng mới lên Firestore
        window.createNewPost = async () => {
            const category = document.getElementById('new-category').value;
            const title = document.getElementById('new-title').value.trim();
            const content = document.getElementById('new-content').value.trim();
            const codeSnippet = document.getElementById('new-code').value.trim();

            if(!title || !content) return alert("Vui lòng điền tiêu đề và nội dung bài giảng!");

            try {
                await addDoc(collection(db, "lessons"), {
                    category,
                    title,
                    content,
                    codeSnippet,
                    author: "Phạm Nhật Minh",
                    createdAt: serverTimestamp()
                });
                closeModal();
                document.getElementById('new-title').value = '';
                document.getElementById('new-content').value = '';
                document.getElementById('new-code').value = '';
                alert("Đăng bài giảng thành công!");
            } catch (e) {
                alert("Lỗi khi đăng bài: " + e.message);
            }
        };

        // Gửi bình luận vào bài giảng
        window.addComment = async (lessonId) => {
            const input = document.getElementById(`comment-input-${lessonId}`);
            const text = input.value.trim();
            if(!text) return;

            try {
                await addDoc(collection(db, "lesson_comments"), {
                    lessonId: lessonId,
                    author: "Học sinh",
                    text: text,
                    createdAt: serverTimestamp()
                });
                input.value = '';
            } catch(e) {
                alert("Lỗi gửi bình luận: " + e.message);
            }
        };

        // Lắng nghe bình luận real-time theo từng bài giảng
        function loadComments(lessonId) {
            const q = query(collection(db, "lesson_comments"));
            onSnapshot(q, (snapshot) => {
                const box = document.getElementById(`comments-${lessonId}`);
                if(!box) return;

                const comments = snapshot.docs
                    .map(d => d.data())
                    .filter(c => c.lessonId === lessonId);

                if(comments.length === 0) {
                    box.innerHTML = `<p class="text-[11px] text-slate-500 italic">Chưa có bình luận nào.</p>`;
                    return;
                }

                box.innerHTML = comments.map(c => `
                    <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800 text-xs">
                        <span class="font-bold text-cyan-300 mr-2">${c.author}:</span>
                        <span class="text-slate-200">${c.text}</span>
                    </div>
                `).join("");
            });
        }

        loadLessons();
    </script>
</body>
</html>
