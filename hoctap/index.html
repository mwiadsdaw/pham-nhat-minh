<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện Bài Giảng Lập Trình | Phạm Nhật Minh</title>
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #e2e8f0; }
        .font-code { font-family: 'Fira Code', monospace; }
    </style>
</head>
<body class="min-h-screen py-10 px-4 flex flex-col items-center">

    <div class="w-full max-w-4xl mb-6 flex justify-between items-center">
        <a href="/" class="text-sm text-slate-400 hover:text-cyan-400 flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Quay lại Portfolio
        </a>
        <div id="account-area" class="flex items-center gap-2 border border-slate-800 bg-slate-950/60 p-1.5 pr-3 rounded-xl">
            <a href="/chat" class="text-xs font-bold text-cyan-400">Đăng nhập từ phòng Chat</a>
        </div>
    </div>

    <main class="w-full max-w-4xl bg-slate-900/85 border border-slate-800 rounded-3xl p-6 sm:p-10 shadow-2xl space-y-8">
        <div class="border-b border-slate-800 pb-6">
            <span class="px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-xs font-semibold uppercase">Hệ thống tài liệu</span>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-white mt-3">Thư Viện Bài Giảng Lập Trình</h1>
        </div>

        <div class="flex gap-3 bg-slate-950 p-2 rounded-2xl border border-slate-800">
            <button onclick="switchTab('cpp')" id="tab-cpp" class="flex-1 py-3 rounded-xl font-bold text-xs bg-gradient-to-r from-cyan-500 to-purple-600 text-white">C++</button>
            <button onclick="switchTab('python')" id="tab-python" class="flex-1 py-3 rounded-xl font-bold text-xs text-slate-400 hover:text-white">Python</button>
        </div>

        <div id="lessons-container" class="space-y-4"></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://gstatic.com";

        const firebaseConfig = {
            apiKey: "AIzaSyB100rlybpLzv5ax2otgGPzDJc1l5pASyo",
            authDomain: "://firebaseapp.com",
            projectId: "minh-s-website",
            storageBucket: "://appspot.com",
            messagingSenderId: "453574408938",
            appId: "1:453574408938:web:8e15469ca906fce7f3b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let activeTab = 'cpp', cachedLectures =;

        // Tải danh sách realtime từ Firestore
        onSnapshot(query(collection(db, "lectures"), orderBy("createdAt", "desc")), (snap) => {
            cachedLectures =;
            snap.forEach(doc => cachedLectures.push({ id: doc.id, ...doc.data() }));
            render();
        });

        function render() {
            const container = document.getElementById('lessons-container');
            container.innerHTML = '';
            const filtered = cachedLectures.filter(item => item.category === activeTab);

            filtered.forEach(item => {
                container.innerHTML += `
                    <div class="p-5 bg-slate-950/40 border border-slate-800 rounded-xl flex justify-between items-center hover:border-cyan-500 transition-all">
                        <div>
                            <h3 class="font-bold text-white text-base">${item.title}</h3>
                            <p class="text-xs text-slate-500 mt-1">Người đăng: ${item.author || 'Ẩn danh'}</p>
                        </div>
                        <!-- BẮC CẦU: Chuyển hướng sang file chi tiết kèm ID bài viết -->
                        <a href="chitiet.html?id=${item.id}" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-cyan-500 hover:text-slate-950 text-xs font-bold transition-all">Xem bài học →</a>
                    </div>`;
            });
        }

        window.switchTab = function(lang) {
            activeTab = lang;
            document.querySelectorAll('button').forEach(b => b.classList.remove('bg-gradient-to-r', 'from-cyan-500', 'to-purple-600', 'text-white'));
            document.getElementById('tab-' + lang).classList.add('bg-gradient-to-r', 'from-cyan-500', 'to-purple-600', 'text-white');
            render();
        }
    </script>
</body>
</html>
