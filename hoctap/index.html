<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện Bài Giảng Lập Trình | Phạm Nhật Minh</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0b0f19;
            color: #e2e8f0;
            margin: 0;
            padding: 40px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 95vh;
        }
        .action-bar {
            width: 100%;
            max-width: 850px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .back-link {
            color: #94a3b8;
            font-size: 14px;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover { color: #06b6d4; }
        .right-actions { display: flex; align-items: center; gap: 12px; }
        .btn-add {
            background-color: #8b5cf6;
            color: white;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 12px;
            border: none;
            cursor: pointer;
        }
        .account-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #1e293b;
            padding: 6px 14px;
            border-radius: 12px;
        }
        .btn-auth {
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            color: white;
            font-weight: 700;
            font-size: 11px;
            padding: 6px 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            text-decoration: none;
        }
        .avatar-img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #8b5cf6;
            background: #1e293b;
            color: #06b6d4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
        }
        .user-name { font-size: 12px; font-weight: 600; color: #e2e8f0; }
        .btn-logout {
            background: #1e293b;
            color: #f87171;
            font-size: 10px;
            font-weight: 700;
            border: 1px solid #334155;
            padding: 3px 6px;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 6px;
        }
        .main-panel {
            width: 100%;
            max-width: 850px;
            background: rgba(17, 24, 39, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 32px;
            box-sizing: border-box;
        }
        .header-section {
            border-bottom: 1px solid #1e293b;
            padding-bottom: 24px;
            margin-bottom: 32px;
        }
        .badge {
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.3);
            color: #06b6d4;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        h1 { font-size: 28px; font-weight: 800; color: white; margin: 14px 0 6px 0; }
        .sub-txt { color: #94a3b8; font-size: 12px; margin: 0; }
        .tab-container {
            display: flex;
            gap: 12px;
            background: #0f172a;
            padding: 6px;
            border-radius: 16px;
            border: 1px solid #1e293b;
            margin-bottom: 32px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 12px;
            background: transparent;
            color: #94a3b8;
            border: none;
            cursor: pointer;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            color: white;
        }
        .lesson-item {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-view {
            padding: 8px 16px;
            background: #1e293b;
            color: #22d3ee;
            border: 1px solid #334155;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }
        .btn-view:hover { background: #06b6d4; color: #0b0f19; }
        .modal-mask {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(4px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-box {
            background: #0f172a;
            border: 1px solid #1e293b;
            width: 100%;
            max-width: 500px;
            border-radius: 24px;
            padding: 24px;
            box-sizing: border-box;
        }
        .form-control {
            width: 100%;
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 10px;
            color: white;
            box-sizing: border-box;
            font-size: 13px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <div class="action-bar">
        <a href="/" class="back-link">← Quay lại Portfolio</a>
        <div class="right-actions">
            <button onclick="toggleModal(true)" class="btn-add">+ Đăng bài giảng mới</button>
            <div id="account-area" class="account-box">
                <a href="/chat" class="btn-auth">Đăng nhập</a>
            </div>
        </div>
    </div>

    <div class="main-panel">
        <div class="header-section">
            <span class="badge">Hệ thống tài liệu</span>
            <h1>Thư Viện Bài Giảng Lập Trình</h1>
            <p class="sub-txt">Biên soạn bởi: Ban quản trị khóa học | THPT Sóc Sơn</p>
        </div>

        <div class="tab-container">
            <button onclick="switchLang('cpp')" id="tab-cpp" class="tab-btn active">C++</button>
            <button onclick="switchLang('python')" id="tab-python" class="tab-btn">Python</button>
        </div>

        <div id="lessons-container"></div>
    </div>

    <div id="post-modal" class="modal-mask">
        <div class="modal-box">
            <div style="display:flex; justify-content:space-between; margin-bottom:16px;">
                <h3 style="color:#06b6d4; margin:0;">Tạo Bài Giảng Mới</h3>
                <button onclick="toggleModal(false)" style="background:transparent; border:none; color:#64748b; cursor:pointer; font-size:20px;">×</button>
            </div>
            <select id="new-category" class="form-control">
                <option value="cpp">C++ (Thuật toán & Cơ bản)</option>
                <option value="python">Python (Scripting & Tự động hóa)</option>
            </select>
            <input type="text" id="new-title" placeholder="Tiêu đề bài giảng..." class="form-control">
            <textarea id="new-content" rows="3" placeholder="Nội dung lý thuyết..." class="form-control" style="resize:none;"></textarea>
            <textarea id="new-code" rows="4" placeholder="Mã code minh họa..." class="form-control" style="resize:none; font-family:monospace; color:#22d3ee;"></textarea>
            <button onclick="createNewPost()" style="width:100%; padding:12px; background:linear-gradient(135deg, #06b6d4, #8b5cf6); border:none; color:white; border-radius:12px; font-weight:700; cursor:pointer;">Đăng Bài Giảng</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://gstatic.com";

        const firebaseConfig = {
            apiKey: "AIzaSyB100rlybpLzv5ax2otgGPzDJc1l5pASyo",
            authDomain: "://firebaseapp.com",
            projectId: "minh-s-website",
            storageBucket: "://appspot.com",
            messagingSenderId: "453574408938",
            appId: "1:453574408938:web:8e15469ca906fce7f3b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let activeTab = 'cpp';
        let cachedLectures = [];
        let currentUser = JSON.parse(localStorage.getItem('shared_user')) || null;

        window.syncUserUI = function() {
            const accountArea = document.getElementById('account-area');
            if (currentUser) {
                const name = currentUser.displayName || currentUser.name || "User";
                accountArea.innerHTML = '<div class="avatar-img">' + name.substring(0,2).toUpperCase() + '</div><span class="user-name">' + name.split(' ').pop() + '</span><button onclick="logOut()" class="btn-logout">Thoát</button>';
            } else {
                accountArea.innerHTML = '<a href="/chat" class="btn-auth">Đăng nhập</a>';
            }
            renderLectures();
        };

        window.logOut = function() {
            currentUser = null;
            localStorage.removeItem('shared_user');
            syncUserUI();
        };

        onSnapshot(query(collection(db, "lectures"), orderBy("createdAt", "desc")), (snap) => {
