<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Bài Giảng | Phạm Nhật Minh</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#111827',
                        accentCyan: '#06b6d4',
                        accentPurple: '#8b5cf6',
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
            color: #e2e8f0;
        }
        .font-code {
            font-family: 'Fira Code', monospace;
        }
        .glass-panel {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="min-h-screen py-10 px-4 sm:px-6 flex flex-col items-center">

    <!-- Top Action Bar -->
    <div class="w-full max-w-3xl mb-6 flex justify-between items-center">
        <a href="javascript:history.back()" class="text-sm font-medium text-slate-400 hover:text-cyan-400 transition-colors flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Quay lại danh sách
        </a>
    </div>

    <!-- Main Container Chi Tiết Bài Giảng -->
    <main id="lesson-detail-container" class="w-full max-w-3xl glass-panel rounded-3xl p-6 sm:p-10 shadow-2xl space-y-6">
        <div class="text-center py-20 text-slate-400">Đang tải nội dung bài giảng...</div>
    </main>

    <!-- Footer -->
    <footer class="mt-12 text-center text-xs text-slate-500">
        <p>© 2026 Phạm Nhật Minh. All rights reserved.</p>
    </footer>

    <!-- Firebase & Script Xử lý -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, addDoc, onSnapshot, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB100rlybpLzv5ax2otgGPzDJc1l5pASyo",
            authDomain: "minh-s-website.firebaseapp.com",
            projectId: "minh-s-website",
            storageBucket: "minh-s-website.appspot.com",
            messagingSenderId: "453574408938",
            appId: "1:453574408938:web:f5b017647a17deacfc3593"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Lấy ID từ URL (Ví dụ: baigiang.html?id=xyz123)
        const urlParams = new URLSearchParams(window.location.search);
        const lessonId = urlParams.get('id');

        const container = document.getElementById('lesson-detail-container');

        async function fetchLessonDetail() {
            if (!lessonId) {
                container.innerHTML = `<div class="text-center py-20 text-red-400">Không tìm thấy mã bài giảng!</div>`;
                return;
            }

            try {
                const docRef = doc(db, "lessons", lessonId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const lesson = docSnap.data();
                    
                    // Render nội dung bài giảng lên trang
                    container.innerHTML = `
                        <div class="border-b border-slate-800 pb-4">
                            <span class="px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-xs font-semibold uppercase tracking-wider">Chuyên mục: ${lesson.category.toUpperCase()}</span>
                            <h1 class="text-2xl sm:text-3xl font-extrabold text-white mt-3 tracking-tight">${lesson.title}</h1>
                            <p class="text-slate-400 text-xs mt-1">Đăng bởi: ${lesson.author || 'Phạm Nhật Minh'}</p>
                        </div>

                        <div class="text-sm text-slate-300 leading-relaxed whitespace-pre-line py-2">
                            ${lesson.content}
                        </div>

                        ${lesson.image ? `
                            <div class="my-4">
                                <img src="${lesson.image}" class="max-h-96 rounded-2xl border border-slate-700 mx-auto">
                            </div>
                        ` : ''}

                        ${lesson.codeSnippet ? `
                            <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl">
                                <pre class="font-code text-xs sm:text-sm text-cyan-300 overflow-x-auto">${lesson.codeSnippet}</pre>
                            </div>
                        ` : ''}

                        <!-- Khu vực bình luận -->
                        <div class="pt-6 border-t border-slate-800 space-y-4">
                            <h3 class="text-sm font-bold text-purple-400 uppercase tracking-wider"><i class="fa-solid fa-comments mr-1"></i> Thảo luận & Bình luận</h3>
                            
                            <div id="comments-box" class="space-y-3 max-h-60 overflow-y-auto pr-2">
                                <p class="text-xs text-slate-500 italic">Đang tải bình luận...</p>
                            </div>

                            <!-- Khung xem trước ảnh dán bình luận -->
                            <div id="comment-preview-box" class="hidden relative inline-block mt-2">
                                <img id="comment-img-preview" src="" class="max-h-24 rounded-lg border border-slate-700">
                                <button onclick="removeCommentImage()" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px]">&times;</button>
                            </div>

                            <div class="flex gap-2 pt-2">
                                <input type="text" id="comment-input" placeholder="Viết bình luận hoặc Ctrl + V dán ảnh..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-cyan-400" onpaste="handleCommentPaste(event)">
                                <button onclick="addComment()" class="bg-gradient-to-r from-cyan-500 to-purple-600 hover:opacity-95 px-5 py-2.5 rounded-xl text-xs font-bold transition">Gửi</button>
                            </div>
                        </div>
                    `;

                    // Kích hoạt tính năng lắng nghe bình luận theo bài giảng này
                    loadCommentsRealtime(lessonId);

                } else {
                    container.innerHTML = `<div class="text-center py-20 text-red-400">Bài giảng này không tồn tại hoặc đã bị xóa!</div>`;
                }
            } catch (e) {
                container.innerHTML = `<div class="text-center py-20 text-red-400">Lỗi tải bài giảng: ${e.message}</div>`;
            }
        }

        // Xử lý dán ảnh trong bình luận
        let commentImageBase64 = "";
        window.handleCommentPaste = (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let item of items) {
                if (item.type.indexOf('image') === 0) {
                    const blob = item.getAsFile();
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        commentImageBase64 = event.target.result;
                        document.getElementById('comment-img-preview').src = commentImageBase64;
                        document.getElementById('comment-preview-box').classList.remove('hidden');
                    };
                    reader.readAsDataURL(blob);
                    e.preventDefault();
                }
            }
        };

        window.removeCommentImage = () => {
            commentImageBase64 = "";
            document.getElementById('comment-preview-box').classList.add('hidden');
            document.getElementById('comment-img-preview').src = "";
        };

        // Gửi bình luận
        window.addComment = async () => {
            const input = document.getElementById('comment-input');
            const text = input.value.trim();
            if(!text && !commentImageBase64) return;

            try {
                await addDoc(collection(db, "lesson_comments"), {
                    lessonId: lessonId,
                    author: "Học sinh",
                    text: text,
                    image: commentImageBase64,
                    createdAt: serverTimestamp()
                });
                input.value = '';
                removeCommentImage();
            } catch(e) {
                alert("Lỗi gửi bình luận: " + e.message);
            }
        };

        // Lắng nghe bình luận real-time
        function loadCommentsRealtime(id) {
            const q = query(collection(db, "lesson_comments"));
            onSnapshot(q, (snapshot) => {
                const box = document.getElementById('comments-box');
                if(!box) return;

                const comments = snapshot.docs
                    .map(d => d.data())
                    .filter(c => c.lessonId === id);

                if(comments.length === 0) {
                    box.innerHTML = `<p class="text-xs text-slate-500 italic">Chưa có bình luận nào cho bài giảng này.</p>`;
                    return;
                }

                box.innerHTML = comments.map(c => `
                    <div class="bg-slate-950/80 p-3 rounded-xl border border-slate-800 text-xs space-y-2">
                        <div>
                            <span class="font-bold text-cyan-300 mr-2">${c.author}:</span>
                            <span class="text-slate-200 whitespace-pre-line">${c.text}</span>
                        </div>
                        ${c.image ? `
                            <div>
                                <img src="${c.image}" class="max-h-36 rounded-lg border border-slate-700">
                            </div>
                        ` : ''}
                    </div>
                `).join("");
            });
        }

        fetchLessonDetail();
    </script>
</body>
</html>
