<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Bài Giảng | Phạm Nhật Minh</title>
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #e2e8f0; }
        .font-code { font-family: 'Fira Code', monospace; }
    </style>
</head>
<body class="min-h-screen py-10 px-4 flex flex-col items-center">

    <div class="w-full max-w-3xl mb-6">
        <a href="index.html" class="text-sm text-slate-400 hover:text-cyan-400 flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Quay lại danh sách bài giảng
        </a>
    </div>

    <main id="content-loading" class="w-full max-w-3xl bg-slate-900 border border-slate-800 rounded-3xl p-10 shadow-2xl text-center text-slate-500 italic">
        Đang tải nội dung chi tiết bài giảng từ máy chủ Cloud...
    </main>

    <main id="lecture-main" class="hidden w-full max-w-3xl bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-10 shadow-2xl space-y-6">
        <div class="border-b border-slate-800 pb-4">
            <h1 id="lecture-title" class="text-2xl font-extrabold text-white tracking-tight"></h1>
            <p id="lecture-author" class="text-xs text-slate-500 mt-2"></p>
        </div>

        <p id="lecture-content" class="text-sm text-slate-300 leading-relaxed whitespace-pre-line"></p>

        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
            <pre id="lecture-code" class="font-code text-xs text-cyan-300 whitespace-pre overflow-x-auto"></pre>
        </div>

        <!-- Khung thảo luận lồng đồng bộ -->
        <div class="pt-4 border-t border-slate-800 space-y-3">
            <h3 class="text-xs font-bold text-purple-400 uppercase tracking-wider"><i class="fa-solid fa-comments"></i> Thảo luận lớp học</h3>
            <div id="comments-container" class="space-y-2"></div>
            
            <div class="flex gap-2 pt-2">
                <input type="text" id="comment-input" placeholder="Viết bình luận của bạn..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
                <button onclick="sendComment()" class="px-4 py-2 rounded-xl bg-purple-600 text-white text-xs font-bold whitespace-nowrap hover:bg-purple-500 transition-colors">Gửi</button>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getFirestore, doc, onSnapshot, updateDoc } from "https://gstatic.com";

        const firebaseConfig = {
            apiKey: "AIzaSyB100rlybpLzv5ax2otgGPzDJc1l5pASyo",
            authDomain: "://firebaseapp.com",
            projectId: "minh-s-website",
            storageBucket: "://appspot.com",
            messagingSenderId: "453574408938",
            appId: "1:453574408938:web:8e15469ca906fce7f3b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 🧠 ĐỌC CẦU NỐI: Lấy ID từ URL của trình duyệt
        const urlParams = new URLSearchParams(window.location.search);
        const lectureId = urlParams.get('id');
        let currentComments =;

        if (lectureId) {
            // Lắng nghe Realtime đúng document bài giảng đó
            onSnapshot(doc(db, "lectures", lectureId), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    currentComments = data.comments ||;

                    document.getElementById('content-loading').classList.add('hidden');
                    document.getElementById('lecture-main').classList.remove('hidden');

                    document.getElementById('lecture-title').innerText = data.title;
                    document.getElementById('lecture-author').innerText = "Tác giả: " + (data.author || "Ẩn danh");
                    document.getElementById('lecture-content').innerText = data.content;
                    document.getElementById('lecture-code').innerText = data.code;

                    // Vẽ danh sách bình luận
                    const commentBox = document.getElementById('comments-container');
                    commentBox.innerHTML = '';
                    if(currentComments.length === 0) {
                        commentBox.innerHTML = '<p class="text-xs text-slate-600 italic">Chưa có thảo luận nào.</p>';
                    }
                    currentComments.forEach(c => {
                        commentBox.innerHTML += `<div class="bg-slate-950/60 p-2.5 rounded-lg border border-slate-800/80 text-[11px] text-slate-300"><span class="font-bold text-cyan-400">${c.user}:</span> ${c.text}</div>`;
                    });
                }
            });
        }

        // Hàm gửi bình luận trực tiếp lên document ID đó
        window.sendComment = async function() {
            const input = document.getElementById('comment-input');
            const txt = input.value.trim();
            if (!txt || !lectureId) return;

            const userSession = JSON.parse(localStorage.getItem('shared_user'));
            const authorName = userSession ? (userSession.displayName || userSession.name) : "Học sinh ẩn danh";

            currentComments.push({ user: authorName, text: txt });

            try {
                await updateDoc(doc(db, "lectures", lectureId), { comments: currentComments });
                input.value = '';
            } catch (err) { console.error("Lỗi lưu thảo luận:", err); }
        }
    </script>
</body>
</html>
