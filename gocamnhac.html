<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc Cảm Nhạc & Trò Chuyện</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-indigo-400 flex items-center gap-2">
                <i class="fa-solid fa-music"></i> Góc Cảm Nhạc
            </h1>
            
            <!-- Auth Container -->
            <div id="auth-section">
                <button id="btn-login" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg font-medium transition flex items-center gap-2">
                    <i class="fa-brands fa-google"></i> Đăng nhập Google
                </button>
                
                <div id="user-profile" class="hidden flex items-center gap-3">
                    <img id="user-avatar" src="" alt="Avatar" class="w-9 h-9 rounded-full border-2 border-indigo-500">
                    <span id="user-name" class="font-medium text-sm hidden sm:inline"></span>
                    <button id="btn-logout" class="text-slate-400 hover:text-red-400 text-sm ml-2 transition" title="Đăng xuất">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto w-full p-4 grid grid-cols-1 lg:grid-cols-3 gap-6 flex-grow">
        
        <!-- Left Side: Music Sharing Section -->
        <section class="lg:col-span-2 space-y-6">
            <!-- Share Music Form -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <h2 class="text-lg font-semibold mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-share-nodes text-indigo-400"></i> Chia sẻ bài hát
                </h2>
                <form id="share-form" class="flex gap-2">
                    <input type="url" id="song-url" placeholder="Dán liên kết video YouTube vào đây..." required
                        class="flex-grow bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-indigo-500">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg font-medium text-sm transition">
                        Chia sẻ
                    </button>
                </form>
            </div>

            <!-- Music Feed List -->
            <div id="music-feed" class="space-y-4">
                <p class="text-center text-slate-500 py-8">Đang tải danh sách bài hát...</p>
            </div>
        </section>

        <!-- Right Side: Realtime Chat Section -->
        <section class="bg-slate-800 rounded-xl border border-slate-700 flex flex-col h-[600px]">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center">
                <h2 class="font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-comments text-indigo-400"></i> Trò chuyện trực tuyến
                </h2>
            </div>

            <!-- Messages List -->
            <div id="chat-box" class="flex-grow p-4 overflow-y-auto space-y-3">
                <p class="text-center text-slate-500">Hãy đăng nhập để tham gia trò chuyện!</p>
            </div>

            <!-- Send Message Form -->
            <form id="chat-form" class="p-3 border-t border-slate-700 flex gap-2">
                <input type="text" id="chat-input" placeholder="Nhập tin nhắn..." disabled
                    class="flex-grow bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 disabled:opacity-50">
                <button type="submit" id="btn-send" disabled class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg text-sm transition disabled:opacity-50">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </section>

    </main>

    <!-- Firebase App & Services Modular SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Cấu hình Firebase thật của bạn
        const firebaseConfig = {
            apiKey: "AIzaSyB1O0rlybpLzv5aX2otgGPZdJc1l5pASyo",
            authDomain: "minh-s-website.firebaseapp.com",
            projectId: "minh-s-website",
            storageBucket: "minh-s-website.appfirebasestorage.app",
            messagingSenderId: "453574408938",
            appId: "1:453574408938:web:f5b017647a17deacfc3593"
        };

        // Khởi tạo Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;

        // Elements
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        const userProfile = document.getElementById('user-profile');
        const userAvatar = document.getElementById('user-avatar');
        const userName = document.getElementById('user-name');
        const chatInput = document.getElementById('chat-input');
        const btnSend = document.getElementById('btn-send');
        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const shareForm = document.getElementById('share-form');
        const musicFeed = document.getElementById('music-feed');

        // Authentication
        btnLogin.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Lỗi đăng nhập:", error);
                alert("Đăng nhập thất bại: " + error.message);
            }
        });

        btnLogout.addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                btnLogin.classList.add('hidden');
                userProfile.classList.remove('hidden');
                userAvatar.src = user.photoURL || 'https://via.placeholder.com/40';
                userName.textContent = user.displayName;
                chatInput.disabled = false;
                btnSend.disabled = false;
            } else {
                btnLogin.classList.remove('hidden');
                userProfile.classList.add('hidden');
                chatInput.disabled = true;
                btnSend.disabled = true;
            }
        });

        // Chat Realtime
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (!text || !currentUser) return;

            chatInput.value = '';
            try {
                await addDoc(collection(db, 'messages'), {
                    uid: currentUser.uid,
                    name: currentUser.displayName,
                    avatar: currentUser.photoURL,
                    text: text,
                    createdAt: serverTimestamp()
                });
            } catch (err) {
                console.error("Lỗi gửi tin nhắn:", err);
            }
        });

        const qChat = query(collection(db, 'messages'), orderBy('createdAt', 'asc'));
        onSnapshot(qChat, (snapshot) => {
            chatBox.innerHTML = '';
            snapshot.forEach((doc) => {
                const msg = doc.data();
                const isMe = currentUser && msg.uid === currentUser.uid;
                const div = document.createElement('div');
                div.className = `flex items-start gap-2 ${isMe ? 'flex-row-reverse' : ''}`;
                div.innerHTML = `
                    <img src="${msg.avatar || 'https://via.placeholder.com/32'}" class="w-8 h-8 rounded-full border border-slate-600">
                    <div class="${isMe ? 'bg-indigo-600' : 'bg-slate-700'} p-2.5 rounded-xl max-w-[75%] text-sm">
                        <p class="text-[10px] text-slate-300 font-medium mb-0.5">${msg.name || 'Người dùng'}</p>
                        <p class="break-words">${msg.text}</p>
                    </div>
                `;
                chatBox.appendChild(div);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        // YouTube Music Sharing
        function extractYouTubeID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        shareForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const urlInput = document.getElementById('song-url');
            const videoId = extractYouTubeID(urlInput.value);

            if (!videoId) {
                alert('Vui lòng nhập liên kết YouTube hợp lệ!');
                return;
            }

            if (!currentUser) {
                alert('Bạn cần đăng nhập để chia sẻ bài hát!');
                return;
            }

            try {
                await addDoc(collection(db, 'songs'), {
                    videoId: videoId,
                    sharedBy: currentUser.displayName,
                    avatar: currentUser.photoURL,
                    createdAt: serverTimestamp()
                });
                urlInput.value = '';
            } catch (err) {
                console.error("Lỗi chia sẻ bài hát:", err);
            }
        });

        const qSongs = query(collection(db, 'songs'), orderBy('createdAt', 'desc'));
        onSnapshot(qSongs, (snapshot) => {
            musicFeed.innerHTML = '';
            if (snapshot.empty) {
                musicFeed.innerHTML = '<p class="text-center text-slate-500 py-8">Chưa có bài hát nào được chia sẻ. Hãy là người đầu tiên!</p>';
                return;
            }
            snapshot.forEach((doc) => {
                const song = doc.data();
                const div = document.createElement('div');
                div.className = 'bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3';
                div.innerHTML = `
                    <div class="flex items-center gap-2 text-sm text-slate-400">
                        <img src="${song.avatar || 'https://via.placeholder.com/24'}" class="w-6 h-6 rounded-full">
                        <span><strong>${song.sharedBy || 'Ẩn danh'}</strong> đã chia sẻ:</span>
                    </div>
                    <div class="aspect-video w-full rounded-lg overflow-hidden bg-black">
                        <iframe class="w-full h-full" src="https://www.youtube.com/embed/${song.videoId}" frameborder="0" allowfullscreen></iframe>
                    </div>
                `;
                musicFeed.appendChild(div);
            });
        });
    </script>
</body>
</html>
