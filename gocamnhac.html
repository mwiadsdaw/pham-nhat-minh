<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Góc Cảm Nhạc - Cyberpunk Music Lounge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @keyframes pulse-slow {
      0%, 100% { transform: scale(1); opacity: 0.2; }
      50% { transform: scale(1.1); opacity: 0.35; }
    }
    .animate-glow { animation: pulse-slow 8s infinite ease-in-out; }
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .equalizer-bar { animation: bounce 1.2s infinite ease-in-out alternate; }
    @keyframes bounce { 0% { height: 4px; } 100% { height: 16px; } }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen relative overflow-x-hidden font-sans">

  <!-- Background Glow Effects -->
  <div class="fixed -top-40 -left-40 w-96 h-96 bg-purple-600 rounded-full blur-[140px] animate-glow pointer-events-none"></div>
  <div class="fixed top-1/2 -right-40 w-96 h-96 bg-cyan-500 rounded-full blur-[140px] animate-glow pointer-events-none"></div>

  <!-- Header -->
  <header class="sticky top-0 z-50 glass-panel border-b border-slate-800/80 px-4 py-3">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      
      <div class="flex items-center space-x-4">
        <a href="index.html" class="flex items-center space-x-2 bg-slate-800/80 hover:bg-slate-700 text-slate-200 px-3.5 py-1.5 rounded-xl border border-slate-700/60 transition text-sm font-medium hover:text-cyan-400">
          <i class="fa-solid fa-house text-cyan-400"></i>
          <span>Trang chủ</span>
        </a>
        <div class="h-5 w-[1px] bg-slate-800"></div>
        <div class="flex items-center space-x-2">
          <div class="flex items-end space-x-[2px] h-4">
            <span class="w-1 bg-cyan-400 rounded-t equalizer-bar" style="animation-delay: 0.1s;"></span>
            <span class="w-1 bg-purple-400 rounded-t equalizer-bar" style="animation-delay: 0.3s;"></span>
            <span class="w-1 bg-pink-400 rounded-t equalizer-bar" style="animation-delay: 0.2s;"></span>
          </div>
          <span class="text-lg font-bold bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-400 bg-clip-text text-transparent tracking-wide">
            Góc Cảm Nhạc
          </span>
        </div>
      </div>

      <!-- Auth / Admin Control Area -->
      <div id="auth-container" class="flex items-center space-x-3">
        <input type="text" id="username-input" placeholder="Tên của bạn..." class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-cyan-500">
        <button id="admin-login-btn" class="flex items-center space-x-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-xl border border-slate-700 text-xs font-medium transition">
          <i class="fa-solid fa-shield-halved text-purple-400"></i>
          <span>Kích hoạt Admin</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6 relative z-10">
    
    <!-- Left: Share & Songs -->
    <section class="lg:col-span-2 space-y-6">
      <div class="glass-panel p-5 rounded-2xl shadow-2xl border border-slate-800">
        <h2 class="text-sm font-semibold text-slate-400 mb-3 flex items-center space-x-2">
          <i class="fa-solid fa-compact-disc text-purple-400 animate-spin" style="animation-duration: 8s;"></i>
          <span>Chia sẻ bài hát mới</span>
        </h2>
        <div class="flex gap-2">
          <input type="text" id="song-url" placeholder="Dán link YouTube tại đây (ví dụ: https://www.youtube.com/watch?v=...)" 
                 class="flex-1 bg-slate-900/90 border border-slate-700/60 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-purple-500 transition">
          <button id="share-btn" class="bg-gradient-to-r from-purple-600 to-cyan-600 hover:opacity-90 text-white px-5 py-2.5 rounded-xl font-medium text-sm transition shadow-lg shadow-cyan-500/10 flex items-center space-x-1.5 shrink-0">
            <i class="fa-solid fa-paper-plane"></i>
            <span>Chia sẻ</span>
          </button>
        </div>
      </div>

      <div id="song-list" class="space-y-4">
        <p class="text-slate-500 text-center py-10 text-sm">Đang tải danh sách bài hát...</p>
      </div>
    </section>

    <!-- Right: Live Chat -->
    <section class="lg:col-span-1">
      <div class="glass-panel rounded-2xl p-4 flex flex-col h-[calc(100vh-120px)] sticky top-20 border border-slate-800">
        
        <div id="chat-header" class="pb-3 mb-3 border-b border-slate-800 flex justify-between items-center">
          <span class="font-semibold text-sm text-slate-300 flex items-center space-x-2">
            <i class="fa-solid fa-comments text-cyan-400"></i>
            <span>Trò chuyện trực tuyến</span>
          </span>
        </div>

        <div id="chat-box" class="flex-1 overflow-y-auto space-y-3 pr-1 text-sm scrollbar-thin scrollbar-thumb-slate-800">
          <p class="text-slate-500 text-center py-10 text-xs">Hãy nhập tên ở góc trên để bắt đầu chat!</p>
        </div>

        <div class="pt-3 mt-2 border-t border-slate-800/80 flex gap-2">
          <input type="text" id="chat-input" placeholder="Nhập tin nhắn..." 
                 class="flex-1 bg-slate-900/90 border border-slate-700/60 rounded-xl px-3.5 py-2 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition">
          <button id="send-btn" class="bg-cyan-600 hover:bg-cyan-500 text-white px-3.5 py-2 rounded-xl text-xs font-medium transition shrink-0">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </div>

      </div>
    </section>

  </main>

  <!-- Firebase Script (Only Firestore, No Auth SDK conflict) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, deleteDoc, doc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB100rlybpLzv5ax2otgGPzDJc1l5pASyo",
      authDomain: "minh-s-website.firebaseapp.com",
      projectId: "minh-s-website",
      storageBucket: "minh-s-website.appspot.com",
      messagingSenderId: "453574408938",
      appId: "1:453574408938:web:f5b017647a17deacfc3593"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let isAdmin = localStorage.getItem("gcn_admin") === "true";

    // Admin login toggle
    const adminBtn = document.getElementById('admin-login-btn');
    function updateAdminUI() {
      if (isAdmin) {
        adminBtn.innerHTML = `<i class="fa-solid fa-shield-check text-green-400 mr-1"></i><span>Admin Mode</span>`;
        adminBtn.className = "flex items-center space-x-1.5 bg-green-500/20 text-green-300 px-3 py-1.5 rounded-xl border border-green-500/40 text-xs font-medium transition";
      } else {
        adminBtn.innerHTML = `<i class="fa-solid fa-shield-halved text-purple-400 mr-1"></i><span>Kích hoạt Admin</span>`;
        adminBtn.className = "flex items-center space-x-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-xl border border-slate-700 text-xs font-medium transition";
      }
      renderAdminControls();
      if(window.refreshSongsUI) window.refreshSongsUI();
    }

    adminBtn.onclick = () => {
      if (!isAdmin) {
        const pass = prompt("Nhập mã PIN Admin:");
        if (pass === "123456" || pass === "minh2001") {
          isAdmin = true;
          localStorage.setItem("gcn_admin", "true");
          alert("Đã kích hoạt quyền Quản trị viên thành công!");
          updateAdminUI();
        } else {
          alert("Mã PIN không đúng!");
        }
      } else {
        if(confirm("Tắt chế độ Admin?")) {
          isAdmin = false;
          localStorage.removeItem("gcn_admin");
          updateAdminUI();
        }
      }
    };

    updateAdminUI();

    // Helper Youtube Embed
    function getYoutubeEmbedUrl(url) {
      if (!url || typeof url !== 'string') return null;
      if (url.includes('youtube.com/embed/')) return url;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}` : null;
    }

    // Share Song
    document.getElementById('share-btn').onclick = async () => {
      const nameInput = document.getElementById('username-input').value.trim();
      const userName = nameInput || "Ẩn danh";
      const urlInput = document.getElementById('song-url');
      const embedUrl = getYoutubeEmbedUrl(urlInput.value.trim());
      
      if (!embedUrl) return alert("Link YouTube không hợp lệ!");

      try {
        await addDoc(collection(db, "songs"), {
          url: embedUrl,
          user: userName,
          createdAt: serverTimestamp()
        });
        urlInput.value = "";
      } catch (e) { alert("Lỗi khi đăng bài: " + e.message); }
    };

    // Render Songs
    let latestSnapshots = null;
    const qSongs = query(collection(db, "songs"), orderBy("createdAt", "desc"));
    onSnapshot(qSongs, (snapshot) => {
      latestSnapshots = snapshot;
      window.refreshSongsUI();
    });

    window.refreshSongsUI = () => {
      const snapshot = latestSnapshots;
      const songList = document.getElementById('song-list');
      if (!snapshot || snapshot.empty) {
        songList.innerHTML = `<p class="text-slate-500 text-center py-10 text-sm">Chưa có bài hát nào. Hãy là người đầu tiên chia sẻ!</p>`;
        return;
      }
      songList.innerHTML = snapshot.docs.map(docSnap => {
        const data = docSnap.data();
        const embedUrl = getYoutubeEmbedUrl(data.url);
        
        return `
          <div class="glass-panel p-4 rounded-2xl border border-slate-800/80 relative group">
            <div class="flex items-center justify-between mb-3">
              <span class="text-xs font-semibold text-purple-300"><i class="fa-solid fa-user-circle mr-1"></i>${data.user || 'Ẩn danh'}</span>
              ${isAdmin ? `
                <button onclick="deleteSong('${docSnap.id}')" class="text-xs text-red-400 hover:text-red-300 bg-red-500/10 hover:bg-red-500/20 px-2.5 py-1 rounded-lg border border-red-500/20 transition flex items-center space-x-1">
                  <i class="fa-solid fa-trash"></i>
                  <span>Xóa video này</span>
                </button>
              ` : ''}
            </div>
            <div class="aspect-video w-full rounded-xl overflow-hidden bg-slate-900 border border-slate-800">
              ${embedUrl ? `<iframe src="${embedUrl}" class="w-full h-full" frameborder="0" allowfullscreen></iframe>` : `<p class="text-center py-12 text-xs text-red-400">Đường dẫn video lỗi</p>`}
            </div>
          </div>
        `;
      }).join('');
    };

    // Chat Logic
    document.getElementById('send-btn').onclick = sendMessage;
    document.getElementById('chat-input').onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };

    async function sendMessage() {
      const nameInput = document.getElementById('username-input').value.trim();
      const userName = nameInput || "Ẩn danh";
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;
      
      await addDoc(collection(db, "messages"), {
        text: text,
        user: userName,
        createdAt: serverTimestamp()
      });
      input.value = "";
    }

    const qMessages = query(collection(db, "messages"), orderBy("createdAt", "asc"));
    onSnapshot(qMessages, (snapshot) => {
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML = snapshot.docs.map(docSnap => {
        const msg = docSnap.data();
        return `
          <div class="flex flex-col items-start mb-2">
            <span class="text-[10px] text-slate-400 mb-0.5 px-1 font-medium">${msg.user || 'Ẩn danh'}</span>
            <div class="px-3 py-1.5 rounded-xl max-w-[85%] break-words bg-slate-800 text-slate-200 border border-slate-700/60 text-xs">
              ${msg.text}
            </div>
          </div>
        `;
      }).join('');
      chatBox.scrollTop = chatBox.scrollHeight;
    });

    // Admin Controls Header
    function renderAdminControls() {
      const chatHeader = document.getElementById('chat-header');
      chatHeader.innerHTML = `
        <span class="font-semibold text-sm text-slate-300 flex items-center space-x-2">
          <i class="fa-solid fa-comments text-cyan-400"></i>
          <span>Trò chuyện</span>
        </span>
        ${isAdmin ? `
          <button onclick="deleteAllMessages()" class="text-[11px] bg-red-500/10 hover:bg-red-500/20 text-red-400 px-2.5 py-1 rounded-lg border border-red-500/20 transition flex items-center space-x-1">
            <i class="fa-solid fa-broom"></i>
            <span>Xóa tất cả tin nhắn</span>
          </button>
        ` : ''}
      `;
    }

    window.deleteSong = async (id) => {
      if (confirm("Xóa bài hát này?")) deleteDoc(doc(db, "songs", id));
    };

    window.deleteAllMessages = async () => {
      if (confirm("Xóa toàn bộ tin nhắn trò chuyện?")) {
        const snap = await getDocs(collection(db, "messages"));
        snap.docs.forEach(d => deleteDoc(doc(db, "messages", d.id)));
      }
    };
  </script>

</body>
</html>
